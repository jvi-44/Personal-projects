<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Katong Diaries</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a full-bleed 3D model of Katong with glass panels floating over it — list on the left, the place you tapped on the right. */
:root {
  --bg: #f1f5f3; --panel: rgba(255,255,255,.88); --panel-2: rgba(255,255,255,.62); --solid: #ffffff; --ink: #172626; --ink-2: #51625f;
  --line: rgba(23,38,38,.12); --accent: #dd3f78; --accent-ink: #ffffff; --accent-soft: #fbe3ec; --jade: #1c8a70; --jade-soft: #d8f0e8;
  --butter: #f8e9b4; --shadow: 0 10px 34px rgba(20,40,45,.16), 0 1px 3px rgba(20,40,45,.10); --scrim: rgba(241,245,243,.72);
  --display: "Bodoni Moda", "Didot", "Bodoni MT", Georgia, serif; --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --r: 18px; --r-s: 11px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1718; --panel: rgba(20,31,32,.86); --panel-2: rgba(20,31,32,.6); --solid: #172324; --ink: #edf4f1; --ink-2: #a5b7b2;
  --line: rgba(237,244,241,.15); --accent: #ff6b9d; --accent-ink: #2a0a16; --accent-soft: #46202f; --jade: #58c9aa; --jade-soft: #17362f;
  --butter: #5a4c1f; --shadow: 0 12px 36px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); --scrim: rgba(15,23,24,.74); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1718; --panel: rgba(20,31,32,.86); --panel-2: rgba(20,31,32,.6); --solid: #172324; --ink: #edf4f1; --ink-2: #a5b7b2;
  --line: rgba(237,244,241,.15); --accent: #ff6b9d; --accent-ink: #2a0a16; --accent-soft: #46202f; --jade: #58c9aa; --jade-soft: #17362f;
  --butter: #5a4c1f; --shadow: 0 12px 36px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); --scrim: rgba(15,23,24,.74); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#stage { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-9999px,-9999px); white-space: nowrap; font: 600 11.5px/1.15 var(--body); color: #14201f; padding: 2px 7px 3px; border-radius: 9px;
  background: rgba(255,255,255,.9); box-shadow: 0 1px 4px rgba(0,0,0,.22); max-width: 190px; overflow: hidden; text-overflow: ellipsis; will-change: transform; }
.lbl.hot { font-size: 12.5px; }
.lbl.sel { background: #dd3f78; color: #fff; }
.lbl.street { background: none; box-shadow: none; color: #fff; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.6); }

.ui { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 372px) minmax(0, 1fr) minmax(0, 384px); grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.ui > * { pointer-events: auto; min-width: 0; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }

/* top bar */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 7px 16px 8px; }
.brand b { font: italic 500 23px/1 var(--display); letter-spacing: -.01em; }
.brand span { font: 500 10.5px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search input { width: 100%; height: 42px; padding: 0 14px 0 40px; border-radius: 21px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.search input::placeholder { color: var(--ink-2); }
.search > svg { position: absolute; left: 14px; top: 12px; color: var(--ink-2); pointer-events: none; }
.results { position: absolute; top: 48px; left: 0; right: 0; max-height: 60vh; overflow: auto; padding: 6px; z-index: 30; background: var(--solid); backdrop-filter: none; }
.results button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 8px 9px; border-radius: 10px; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results small { display: block; color: var(--ink-2); font-size: 12px; }
.spacer { flex: 1 1 0; }
.seg { display: flex; padding: 4px; gap: 2px; border-radius: 22px; }
.seg button { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 17px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; gap: 8px; }
.round { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; }
.round:hover, .seg button:hover:not([aria-pressed="true"]) { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px; border-radius: 21px; font-weight: 600; font-size: 13px; }

/* left dock */
.dock { grid-column: 1; grid-row: 2 / 4; display: flex; flex-direction: column; overflow: hidden; align-self: stretch; }
.tabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; padding: 10px 4px 11px; font-weight: 600; font-size: 13px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.tabs .n { font: 500 10.5px var(--mono); margin-left: 4px; color: var(--accent); }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px 16px; overscroll-behavior: contain; scrollbar-width: thin; }
.grip { display: none; }
h3.kick { font: 500 10.5px var(--mono); letter-spacing: .11em; text-transform: uppercase; color: var(--ink-2); margin: 14px 2px 8px; }
h3.kick:first-child { margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 5px; border-radius: 15px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.chip .dot { width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--c, #888); opacity: .45; }
.chip .dot svg { width: 13px; height: 13px; stroke-width: 2.2; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: transparent; background: var(--solid); box-shadow: 0 0 0 1.5px var(--c, var(--ink)) inset; }
.chip[aria-pressed="true"] .dot { opacity: 1; }
.chip em { font: 500 10.5px var(--mono); font-style: normal; color: var(--ink-2); }
.chip.plain { padding: 0 11px; }
.chip.plain[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 2px 6px; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
.switch input { appearance: none; width: 36px; height: 21px; border-radius: 11px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; border-radius: 9px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(15px); }
select.mini { border: 1px solid var(--line); border-radius: 9px; padding: 4px 8px; background: var(--solid); font-size: 12.5px; }
.list { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.item { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 8px; border-radius: 12px; text-align: left; width: 100%; }
.item:hover, .item.on { background: var(--accent-soft); }
.badge { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: var(--c, #888); }
.badge svg { width: 16px; height: 16px; stroke-width: 2.1; }
.item b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item small { display: block; color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .st { display: flex; gap: 4px; align-items: center; color: var(--ink-2); font: 500 11px var(--mono); }
.st .saved { color: var(--accent); } .st .been { color: var(--jade); }
.more { margin: 10px auto 0; display: block; padding: 8px 16px; border-radius: 16px; border: 1px solid var(--line); font-weight: 600; font-size: 12.5px; }
.empty { padding: 22px 14px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 14px; margin-top: 8px; }
.empty b { display: block; font: italic 500 19px var(--display); color: var(--ink); margin-bottom: 4px; }

/* bucket list */
.stats { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.ring { width: 64px; height: 64px; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--line); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .5s; }
.ring text { font: 500 15px var(--mono); fill: var(--ink); text-anchor: middle; }
.stats b { font: italic 500 20px/1.15 var(--display); display: block; }
.stats small { color: var(--ink-2); }
.sync { margin-top: 8px; font: 500 10.5px var(--mono); letter-spacing: .04em; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 4px; background: var(--jade); display: inline-block; }
.sync.local i { background: #d9a400; }
.entry { padding: 11px 12px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel-2); margin-top: 8px; }
.entry header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.entry header b { font-weight: 600; } .entry time { font: 500 11px var(--mono); color: var(--ink-2); white-space: nowrap; }
.entry p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.hearts { display: inline-flex; gap: 2px; color: var(--accent); vertical-align: -3px; }
.hearts svg { width: 14px; height: 14px; } .hearts .off { color: var(--line); }
.hearts svg.f { fill: currentColor; }

/* date ideas */
.date { display: block; width: 100%; text-align: left; padding: 13px 14px; border-radius: 15px; border: 1px solid var(--line); background: var(--panel-2); margin-top: 8px; }
.date:hover { border-color: var(--accent); }
.date b { font: italic 500 20px/1.15 var(--display); display: block; }
.date .meta { font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 5px 0 6px; display: flex; gap: 8px; flex-wrap: wrap; }
.date p { margin: 0; color: var(--ink-2); }
.steps { list-style: none; margin: 12px 0 0; padding: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 64px; top: 8px; bottom: 8px; width: 1.5px; background: var(--line); }
.steps li { display: grid; grid-template-columns: 52px 14px minmax(0,1fr); gap: 6px; padding: 7px 0; align-items: start; }
.steps time { font: 500 10.5px var(--mono); color: var(--ink-2); padding-top: 3px; text-align: right; }
.steps .node { width: 11px; height: 11px; border-radius: 6px; background: var(--solid); border: 2.5px solid var(--accent); margin-top: 4px; position: relative; z-index: 1; }
.steps button { text-align: left; font-weight: 600; } .steps button:hover { color: var(--accent); }
.steps small { display: block; color: var(--ink-2); font-size: 12.5px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }

/* right card */
.card { grid-column: 3; grid-row: 2 / 4; align-self: start; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.card[hidden] { display: none !important; }
.card .body { overflow: auto; padding: 16px 18px 18px; overscroll-behavior: contain; scrollbar-width: thin; }
header.h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 4px; border-radius: 13px; font: 600 12px var(--body); color: #fff; background: var(--c, #666); }
.tag .dot { width: 18px; height: 18px; display: grid; place-items: center; } .tag svg { width: 13px; height: 13px; stroke-width: 2.2; }
.tag.feat { background: none; color: var(--accent); padding: 0 2px; font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.x { width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; color: var(--ink-2); } .x:hover { background: var(--accent-soft); color: var(--accent); }
.card h2 { font: 500 27px/1.1 var(--display); margin: 4px 0 7px; text-wrap: balance; letter-spacing: -.012em; }
.sub { color: var(--ink-2); font-size: 13px; display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.sub .p { font: 500 12px var(--mono); color: var(--jade); }
.blurb { font-size: 15px; line-height: 1.5; margin: 12px 0 0; }
.tip { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--butter); font-size: 13.5px; }
.tip b { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 2px; opacity: .75; }
dl.info { margin: 14px 0 0; display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px 8px; font-size: 13.5px; }
dl.info dt { color: var(--ink-2); padding-top: 1px; } dl.info dd { margin: 0; overflow-wrap: anywhere; }
dl.info svg { width: 16px; height: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.tags span { font: 500 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 9px; background: var(--jade-soft); color: var(--jade); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 13px; font-weight: 600; font-size: 13.5px; border: 1px solid var(--line); background: var(--solid); }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; } .btn.pri:hover { filter: brightness(1.06); }
.btn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn.jade.on { background: var(--jade-soft); color: var(--jade); border-color: var(--jade); }
.btn.wide { grid-column: 1 / -1; } .btn.sm { height: 32px; font-size: 12.5px; padding: 0 11px; border-radius: 10px; }
.btn svg.f { fill: currentColor; }
.links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
.links a, .src a { color: var(--jade); text-decoration: none; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; } .links a:hover, .src a:hover { text-decoration: underline; }
.links svg { width: 13px; height: 13px; }
.sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.sec > h4 { font: italic 500 18px var(--display); margin: 0 0 8px; }
.src { font-size: 12.5px; color: var(--ink-2); } .src a { display: inline; font-weight: 500; }
.note { font-size: 12px; color: var(--ink-2); margin-top: 12px; }
form.log { display: grid; gap: 10px; margin-top: 4px; }
form.log label { display: grid; gap: 4px; font-weight: 600; font-size: 12.5px; }
form.log input[type=date], form.log textarea { border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; background: var(--solid); width: 100%; }
form.log textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.rate { display: flex; gap: 4px; } .rate button { color: var(--line); } .rate button.on { color: var(--accent); } .rate svg { width: 26px; height: 26px; } .rate button.on svg { fill: currentColor; }
.floors { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.store { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.store b { font-weight: 600; } .store button b { color: var(--accent); }
.store span { font: 500 11px var(--mono); color: var(--ink-2); white-space: nowrap; }
.store i { display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 6px; background: var(--c, #999); }
input.find { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px; background: var(--solid); margin-bottom: 8px; }

/* bottom HUD */
.hud { grid-column: 2; grid-row: 3; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; pointer-events: none; min-height: 44px; }
.hud > * { pointer-events: auto; }
.where { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 auto; max-width: 100%; }
.street { padding: 6px 14px; border-radius: 16px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.near { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.near button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 15px; font-size: 12px; font-weight: 600; }
.near .badge { width: 20px; height: 20px; } .near .badge svg { width: 12px; height: 12px; } .near em { font: 500 10.5px var(--mono); font-style: normal; color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; margin-left: auto; }
#mini { width: 132px; height: 132px; border-radius: 66px; display: block; }
.joy { width: 116px; height: 116px; border-radius: 58px; position: relative; touch-action: none; flex: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 23px; background: var(--accent); box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.hint { font-size: 12px; color: var(--ink-2); padding: 7px 12px; border-radius: 14px; max-width: 340px; }
.hint kbd { font: 500 10.5px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); background: var(--solid); }

/* overlays */
.veil { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: var(--scrim); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.veil[hidden] { display: none !important; }
.modal { width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 26px 28px; background: var(--solid); backdrop-filter: none; }
.modal.s { width: min(480px, 100%); }
.modal h1 { font: italic 500 clamp(34px, 6vw, 54px)/1 var(--display); margin: 0 0 6px; letter-spacing: -.02em; }
.modal h2 { font: italic 500 26px/1.1 var(--display); margin: 0; }
.modal p.lead { font-size: 15.5px; color: var(--ink-2); margin: 8px 0 16px; max-width: 56ch; }
.how { display: grid; gap: 10px; margin: 0 0 20px; padding: 0; list-style: none; }
.how li { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; align-items: start; }
.how li > span { width: 34px; height: 34px; border-radius: 17px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.how b { display: block; }
.how small { color: var(--ink-2); font-size: 13px; }
.go { display: flex; gap: 10px; flex-wrap: wrap; }
.load { text-align: center; }
.load b { font: italic 500 38px/1 var(--display); display: block; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 18px auto 10px; width: min(280px, 70vw); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .2s; }
.load small { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.fit { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 22px; }
#fitCanvas { width: 220px; height: 330px; border-radius: 16px; background: linear-gradient(180deg, var(--accent-soft), var(--jade-soft)); display: block; }
.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.look { text-align: left; padding: 10px 12px; border-radius: 13px; border: 1.5px solid var(--line); }
.look[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.look b { display: block; font-weight: 700; } .look small { color: var(--ink-2); font-size: 12px; display: block; }
.look .sw { display: flex; gap: 3px; margin-bottom: 6px; } .look .sw i { width: 16px; height: 16px; border-radius: 8px; border: 1px solid var(--line); }
.swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.swatches button { width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--solid); box-shadow: 0 0 0 1.5px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--accent); }
.legend { position: absolute; right: 0; top: 50px; width: min(330px, 86vw); padding: 14px 16px; z-index: 40; background: var(--solid); backdrop-filter: none; }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
.legend li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; }
.legend .badge { width: 22px; height: 22px; } .legend .badge svg { width: 13px; height: 13px; }
.legend .ringx { width: 22px; height: 22px; border-radius: 11px; border: 3px solid var(--c); background: var(--solid); flex: none; }
.legend .sq { width: 22px; height: 14px; border-radius: 4px; background: var(--c); flex: none; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); padding: 10px 16px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px;
  opacity: 0; transition: opacity .2s, transform .2s; z-index: 80; pointer-events: none; max-width: 86vw; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.credit { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(2px + env(safe-area-inset-bottom, 0px)); font: 400 10px var(--mono); color: var(--ink-2); opacity: .8; pointer-events: auto; z-index: 5; }
.credit a { color: inherit; }
.relpos { position: relative; }

@media (max-width: 1080px) { .ui { grid-template-columns: minmax(0, 330px) minmax(0, 1fr) minmax(0, 340px); } .brand span { display: none; } }
@media (max-width: 820px) {
  .ui { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px; padding-block: 8px; }

  .search { order: 5; flex: 1 1 100%; max-width: none; } .spacer { display: none; }
  .seg button span { display: none; } .seg button { padding: 0 11px; }
  .tools { margin-left: auto; } .pill span { display: none; } .pill { padding: 0 12px; }
  .hud { grid-column: 1; grid-row: 3; }
  .dock { grid-column: 1; grid-row: 4; max-height: 44vh; transition: max-height .25s; }
  .dock.min { max-height: 50px; } .dock.max { max-height: 76vh; }
  .grip { display: block; width: 100%; padding: 7px 0 2px; flex: none; } .grip i { display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
  .card { grid-column: 1; grid-row: 2 / 5; align-self: end; max-height: 72vh; z-index: 20; }
  .card h2 { font-size: 23px; }
  .fit { grid-template-columns: 1fr; } #fitCanvas { width: 100%; height: 230px; }
  .modal { padding: 20px 18px; }
  #mini { width: 96px; height: 96px; border-radius: 48px; } .hint { display: none; }
  .legend { right: -4px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

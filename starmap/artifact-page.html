<title>Vi's Starmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Dark-first single look: space. Full token set lives in css/style.css, injected below. */
:root { color-scheme: dark; --bg: #070512; --text: #f3effd; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); }
</style>
<script>
  window.ARTIFACT = true;
  // Stylesheets can only come from Google Fonts, so the app's own CSS is injected as an inline <style>.
  fetch("css/style.css").then(function (r) { return r.text(); }).then(function (t) {
    var s = document.createElement("style"); s.textContent = "html, body { height: 100%; }\n" + t; document.head.appendChild(s);
  });
</script>
<body data-view="garden">
<header class="top">
  <div class="brand"><span class="brand-mark">🌻</span><div><h1>Vi's Starmap</h1><p>sun garden · daily planner</p></div></div>
  <nav class="datenav" aria-label="Choose day">
    <button id="prevDay" aria-label="Previous day">‹</button>
    <label class="datepick"><span id="dateLabel"></span><input type="date" id="datePick" aria-label="Pick a date"></label>
    <button id="nextDay" aria-label="Next day">›</button>
    <button id="todayBtn" class="ghost">Today</button>
  </nav>
  <div class="syncpill" id="syncPill" role="status"><i></i><span>Loading…</span></div>
</header>

<main class="layout">
  <aside class="panel left" id="leftPanel">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="plan" class="on">Today's plan</button>
      <button role="tab" data-tab="inputs">Plan the day</button>
      <button role="tab" data-tab="settings">Routines</button>
    </div>
    <section id="tab-plan" class="tabpane on"></section>
    <section id="tab-inputs" class="tabpane"></section>
    <section id="tab-settings" class="tabpane"></section>
  </aside>

  <section class="stage" id="stage">
    <div id="scene" aria-label="3D sun garden. Each sunflower is one of today's six tasks."></div>
    <div class="hud hud-top">
      <div class="meter" aria-label="Day progress"><div class="meter-bar"><b id="meterFill"></b></div><span id="meterText"></span></div>
    </div>
    <div class="hud hud-bottom" id="focusCard"></div>
    <button class="hud-btn" id="resetCam" title="Reset camera">⌖</button>
    <p class="hint">drag to orbit · scroll to zoom · click a flower</p>
  </section>

  <aside class="panel right" id="rightPanel"></aside>
</main>

<nav class="mobnav" aria-label="Sections">
  <button data-view="garden" class="on">🌻<span>Garden</span></button>
  <button data-view="plan">🗓<span>Plan</span></button>
  <button data-view="week">✦<span>Week</span></button>
</nav>

<dialog id="modal"><form method="dialog"><header><h3 id="modalTitle"></h3><button aria-label="Close">✕</button></header><pre id="modalBody"></pre><footer><button type="button" id="copyPrev" hidden>Copy text</button></footer></form></dialog>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>

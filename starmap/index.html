<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vi's Starmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<header class="bar">
  <div class="brand"><h1>Vi's Starmap</h1><p>sun garden</p></div>
  <nav class="days" aria-label="Days of the week">
    <button id="prevDay" class="round" aria-label="Previous day">‹</button>
    <div id="weekStrip" class="strip"></div>
    <button id="nextDay" class="round" aria-label="Next day">›</button>
    <label class="round cal" title="Pick a date"><span aria-hidden="true">◷</span><input type="date" id="datePick" aria-label="Pick a date"></label>
    <button id="todayBtn" class="pill">Today</button>
  </nav>
  <div class="tools">
    <span id="aiBadge" class="badge">Built-in planner</span>
    <button id="openRoutines" class="pill">Routines</button>
    <button id="planDayTop" class="pill">✨ Plan my day</button>
    <button id="planWeekTop" class="gold">✨ Plan my week</button>
  </div>
</header>

<div id="scene" aria-label="3D sun garden. Each sunflower is one of the day's six tasks; seedlings are this week's seeds; lanterns are routine steps."></div>


<aside id="dayPanel" class="glass panel left" aria-label="Day plan"></aside>
<div class="rightcol">
  <aside id="weekPanel" class="glass panel right" aria-label="Week"></aside>
  <aside id="notionCard" class="notion" aria-label="Notion preview"></aside>
</div>
<div id="nudge" class="glass nudge" role="status" aria-live="polite" hidden></div>

<section id="focusCard" class="glass focus" hidden aria-live="polite"></section>
<button id="resetView" class="round view" title="Reset view" aria-label="Reset view">⌂</button>

<form id="seedForm" class="glass seedbar" autocomplete="off">
  <div id="scope" class="scope" role="radiogroup" aria-label="Plant into">
    <button type="button" role="radio" data-scope="today">Today</button>
    <button type="button" role="radio" data-scope="week">This week</button>
  </div>
  <input id="seedInput" aria-label="Plant a task" enterkeyhint="send">
  <button class="gold" type="submit">Plant 🌱</button>
</form>

<dialog id="dayDialog"><form id="dayForm" class="sheet" method="dialog"></form></dialog>
<dialog id="confirmDialog"><form id="confirmForm" class="sheet" method="dialog"></form></dialog>
<dialog id="weekDialog"><form id="weekForm" class="sheet" method="dialog"></form></dialog>
<dialog id="routineDialog"><div id="routineForm" class="sheet"></div></dialog>
<dialog id="copyDialog"><div class="sheet"><header><h2>Copy for Notion</h2><button type="button" class="x" data-close>✕</button></header><pre id="copyBody"></pre><footer><span></span><button id="copyAgain">Select all</button><button class="gold" data-close>Done</button></footer></div></dialog>
<div id="toasts" aria-live="polite"></div>
<!--/APP-->
<script src="dist/app.js"></script>
</body>
</html>

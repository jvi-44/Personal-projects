<title>Scranton Branch Intranet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a corporate intranet. Fixed department directory on the left, one working "department page" on the right; memos, ledgers and nameplates carry the theme. */
:root{
  --bg:#eef0f2; --panel:#ffffff; --panel2:#f6f7f9; --ink:#17212e; --muted:#5b6777; --line:#d5dae1;
  --navy:#1d3557; --navy-ink:#ffffff; --accent:#2a5fa5; --manila:#e9d9a8; --manila-ink:#4a3c10;
  --good:#1f7a4d; --good-bg:#dff1e7; --warn:#96610a; --warn-bg:#fbeccb; --crit:#b3261e; --crit-bg:#fbe0dd; --info-bg:#dfe9f6;
  --code-bg:#f3f5f8;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161f; --panel:#18212d; --panel2:#1e2936; --ink:#e6ebf2; --muted:#9aa7b8; --line:#2f3c4d;
  --navy:#0c1422; --navy-ink:#e6ebf2; --accent:#7fb0ee; --manila:#4b4124; --manila-ink:#f0e2b4;
  --good:#6fd3a0; --good-bg:#173527; --warn:#f0c06a; --warn-bg:#3d2f10; --crit:#ff9b93; --crit-bg:#45201d; --info-bg:#1d3150;
  --code-bg:#121a25; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10161f; --panel:#18212d; --panel2:#1e2936; --ink:#e6ebf2; --muted:#9aa7b8; --line:#2f3c4d;
  --navy:#0c1422; --navy-ink:#e6ebf2; --accent:#7fb0ee; --manila:#4b4124; --manila-ink:#f0e2b4;
  --good:#6fd3a0; --good-bg:#173527; --warn:#f0c06a; --warn-bg:#3d2f10; --crit:#ff9b93; --crit-bg:#45201d; --info-bg:#1d3150;
  --code-bg:#121a25; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--navy-ink);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.18)}
.brand b{font:800 19px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:4px;color:inherit;text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.16)}
.nav .t{display:flex;flex-direction:column;min-width:0}
.nav .t b{font:600 14px/1.2 var(--body)}
.nav .t span{font-size:11.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .c{font:500 11px var(--mono);opacity:.8}
.side .sync{margin-top:auto;font-size:11.5px;opacity:.75;line-height:1.4}
.badge{display:inline-block;vertical-align:middle;width:30px;height:30px;border-radius:3px;background:var(--c,#456);color:#fff;font:700 11px/30px var(--display);text-align:center;letter-spacing:.04em;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.badge.lg{width:44px;height:44px;line-height:44px;font-size:15px}

.main{padding-block:22px 48px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1180px}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.phead .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px}
.memo{background:var(--manila);color:var(--manila-ink);padding:12px 16px;border-left:0;font-size:14px;display:grid;gap:4px;box-shadow:2px 3px 0 rgba(0,0,0,.08)}
.memo .hd{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.panel>.body{padding:14px;display:flex;flex-direction:column;gap:12px}
.big{font:800 46px/1 var(--display);letter-spacing:-.02em}
.bar{height:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.good i{background:var(--good)}
table{border-collapse:collapse;width:100%}
th{font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.pill{display:inline-block;font:600 11.5px/1 var(--body);padding:4px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--accent);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:5px 8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:7px 9px;min-width:0}
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.empty{border:1px dashed var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.check{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;cursor:pointer}
.check input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through}
.stage{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0;padding-bottom:0}
.dept td:first-child{width:1%}
.dundies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dundie{border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--panel2);opacity:.55}
.dundie.on{opacity:1;background:var(--manila);color:var(--manila-ink);border-color:transparent}
.dundie b{font:700 13.5px var(--display)}
.dundie span{font-size:12px}
.hab{display:grid;grid-template-columns:minmax(110px,1fr) repeat(7,34px) 30px;gap:6px;align-items:center;min-width:420px}
.hab .d{font:600 11px var(--body);text-align:center;color:var(--muted);text-transform:uppercase}
.hab .d.today{color:var(--accent)}
.tick{width:34px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:3px;cursor:pointer;padding:0;font-weight:700;color:transparent}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--panel)}
.tick:disabled{opacity:.35;cursor:default}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:6px 10px 6px 6px;border-radius:4px;cursor:pointer;text-align:left}
.tab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.tab .badge{width:26px;height:26px;line-height:26px;font-size:10px}
.tab b{display:block;font:600 13px/1.2 var(--body)} .tab .tx span{font-size:11.5px;color:var(--muted)} .tab .tx>span{display:block}
.lab{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:20px;align-items:start}
.chlist{display:flex;flex-direction:column}
.chlist button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer}
.chlist button:last-child{border-bottom:0}
.chlist button[aria-current="true"]{background:var(--info-bg)}
.chlist .n{font:500 12px var(--mono);color:var(--muted)}
.chlist .ok{color:var(--good);font-weight:700}
.brief{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.brief code,.inl{font:13px var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:3px}
pre{margin:0;font:13px/1.5 var(--mono);background:var(--code-bg);border:1px solid var(--line);padding:10px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
pre.io{white-space:pre}
#code{width:100%;font:13.5px/1.55 var(--mono);background:var(--code-bg);tab-size:4;resize:vertical;white-space:pre;overflow:auto;min-height:260px}
.verdict{font-weight:600}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--crit)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .brand{padding-bottom:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{grid-template-columns:26px auto;flex:none}
  .nav .c,.nav .t span{display:none}
  .nav .badge{width:26px;height:26px;line-height:26px;font-size:10px}
  .side .sync{margin-top:0}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-block:16px 40px}
  .lab{grid-template-columns:minmax(0,1fr)}
  .big{font-size:38px}
}
</style>

</div>

<script>
"use strict";
const R = String.raw;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const monday = s => { const d = new Date(s + 'T12:00:00'); return addDays(s, -((d.getDay() + 6) % 7)); };
const uid = () => Math.random().toString(36).slice(2, 9);
const fmtDate = s => s ? new Date(s + 'T12:00:00').toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '';

/* ───────── People ───────── */
const HEADS = {

  darryl:{n:'Darryl Philbin', r:'Warehouse Foreman', i:'DP', c:'#3d6f80', v:'calm, practical, no-nonsense foreman'},

};
const DEPTS = [
  {id:'front-desk', name:'Front Desk', head:'michael', sub:'Branch overview'},
  {id:'sales', name:'Sales', head:'jim', sub:'Internship pipeline'},
  {id:'admin', name:'Administration', head:'pam', sub:'Colleges & scholarships'},
  {id:'lab', name:'Training Annex', head:'oscar', sub:'Coding lab'},
  {id:'warehouse', name:'Warehouse', head:'darryl', sub:'Hardware & ECE'},

  {id:'social', name:'Customer Relations', head:'kelly', sub:'Friends & travel'},

];
const badge = (h, lg) => `<span class="badge${lg ? ' lg' : ''}" style="--c:${HEADS[h].c}" aria-hidden="true">${HEADS[h].i}</span>`;

const MEMOS = [
  "Eight months is a long time. It is also not a long time. Use both halves.",
  "I am not saying you have to do everything today. I am saying somebody should, and you are the only one on the payroll.",
  "An internship is just a job where they have not realised how good you are yet.",
  "Write one line of code before lunch. Then the day cannot be a total loss. That is management science.",
  "Applications are like sales calls. The answer is no until you actually send it.",
  "Call a friend this week. A branch is only as strong as its conference room parties.",
  "Do the hard department first. Then reward yourself with the easy department. I invented that.",
  "Nobody remembers the day you skipped. Everybody remembers the streak."
];

/* ───────── Trackers ───────── */
const TR = {
  intern:{a:'Company, lab or team', b:'Role or contact', stages:['Lead','Applied','Interview','Offer','Closed'],
    empty:'No leads on the board yet. Add the first place you would like to work, or start from my shortlist of ideas to research.',
    suggest:[['Research institute attachment (e.g. A*STAR)','Find a lab doing embedded / signal processing work'],['Defence tech internship (e.g. DSTA, DSO)','Check pre-university programmes'],['Hardware or IoT startup','Cold email the founder with a small project'],['University lab attachment','Email a professor whose ECE research you can describe in two lines'],['Software internship at a tech SME','Lead with your GitHub']]},
  apps:{a:'University or scholarship', b:'Course or notes', cats:['Singapore','United States','United Kingdom','Scholarship'], stages:['Researching','Drafting','Submitted','Interview','Decision'],
    empty:'Nothing filed yet. Add each application as its own row and give it the deadline from the official site.',
    suggest:[['NUS','Electrical / Computer Engineering','Singapore'],['NTU','Electrical & Electronic Engineering','Singapore'],['SUTD','Check interview format','Singapore'],['UCAS (up to 5 choices)','Personal statement + reference','United Kingdom'],['Common App','Main essay + supplements, test scores','United States'],['Government scholarship (e.g. PSC)','Essays, psychometric tests, interviews','Scholarship'],['Research scholarship (e.g. A*STAR)','Tie to research attachment','Scholarship'],['Industry-sponsored scholarship','Shortlist 3 engineering sponsors','Scholarship']]},
  friends:{a:'Who', b:'What you will do', stages:['To plan','Scheduled','Done'],
    empty:'Your social calendar is literally empty. Add someone you keep meaning to see.', suggest:[['A JC classmate you have not seen since A-levels','Meal, no agenda'],['CCA batch','Group outing before everyone scatters'],['Family','One proper day together']]},
  trips:{a:'Where', b:'With whom, rough budget', stages:['Idea','Planning','Booked','Been'],
    empty:'No trips yet. Even one weekend away counts.', suggest:[['Grad trip','Pick dates around application deadlines'],['A short solo trip','Somewhere reachable in under 4 hours']]}
};
const stageClass = (cfg, st) => { const i = cfg.stages.indexOf(st), n = cfg.stages.length; return i <= 0 ? '' : i >= n - 2 && cfg === TR.intern ? (st === 'Offer' ? 'good' : '') : i === n - 1 ? 'good' : i === 1 ? 'warn' : 'info'; };

/* ───────── Checklists ───────── */
const CK = {
  prep:[['prep1','One-page resume: A-level subjects, projects, CCA leadership'],['prep2','GitHub profile with 3 pinned projects from the Training Annex'],['prep3','LinkedIn profile with a clear headline (incoming ECE student)'],['prep4','A reusable cold email: who you are, what you built, what you are asking for'],['prep5','A 60-second answer to "tell me about a project"'],['prep6','Ask one teacher for a reference you can reuse']],
  pandas:[['pd1','Install Python + Jupyter (or open Google Colab)'],['pd2','Load the sales ledger with pandas.read_csv and repeat ledger tasks 2 to 5 with groupby'],['pd3','Plot monthly reams with matplotlib and label the axes'],['pd4','Write a one-paragraph finding as if reporting to the Regional Manager'],['pd5','Push the notebook to GitHub']],
  hw:[
    {t:'Stage 1 · Circuits on a breadboard', items:[['hw11','Light an LED with the right series resistor (do bench calculation 2 first)'],['hw12','Build a voltage divider and confirm the output with a multimeter'],['hw13','Measure current in series and parallel branches; compare with your calculation'],['hw14','No kit yet? Do all three in a circuit simulator (Tinkercad Circuits or Falstad)']]},
    {t:'Stage 2 · Microcontroller in C++ (Arduino)', items:[['hw21','Blink, then blink without delay() using millis()'],['hw22','Read a push button with debouncing'],['hw23','Dim an LED with PWM from a potentiometer'],['hw24','Read an analog sensor and print to the serial monitor'],['hw25','Drive a servo or small motor through a driver or transistor']]},
    {t:'Stage 3 · Digital logic', items:[['hw31','Write truth tables for AND, OR, XOR, NAND; build one from NAND gates only'],['hw32','Build a half adder, then a full adder, in a simulator'],['hw33','Drive a 7-segment display as a 0 to 9 counter'],['hw34','Set and clear bits on a port register directly (see C++ task 7)']]},
    {t:'Stage 4 · Connected build', items:[['hw41','ESP32: read a temperature sensor over I2C'],['hw42','Send readings over Wi-Fi or log them to an SD card'],['hw43','Explain UART, I2C and SPI to a friend in one minute each'],['hw44','Analyse a week of your own sensor data in Python']]},
    {t:'Stage 5 · Design it properly', items:[['hw51','Draw the schematic of your Stage 4 build in KiCad'],['hw52','Lay out a small PCB and run the design rule check'],['hw53','Solder a through-hole kit cleanly'],['hw54','Write and simulate a 4-bit counter in Verilog']]},
    {t:'Capstone · Build your own Dundie', items:[['hw61','A trophy with addressable LEDs that reacts to a sensor'],['hw62','Document it: schematic, code, photos, what went wrong'],['hw63','Put it on GitHub and in your resume']]}
  ],
  ml:[
    {t:'Project 1 · Will the client renew? (scikit-learn)', items:[['ml11','Pick a public tabular dataset (Titanic or a churn dataset) and explore it in pandas'],['ml12','Train logistic regression and a decision tree with a train/test split'],['ml13','Report accuracy, precision and recall, and say which errors matter more'],['ml14','Write a README explaining the result to a non-technical manager']]},
    {t:'Project 2 · Read the handwriting on the fax (neural network)', items:[['ml21','Train a small dense network on MNIST with PyTorch or Keras'],['ml22','Swap it for a small CNN and compare accuracy'],['ml23','Plot the training curves and find one misclassified digit you agree is ambiguous']]},
    {t:'Project 3 · ML on a microcontroller (ECE capstone)', items:[['ml31','Record accelerometer or microphone data from your board'],['ml32','Train a tiny classifier (gesture or keyword) on your laptop'],['ml33','Deploy it to the board with TensorFlow Lite Micro or Edge Impulse'],['ml34','Demo video: the board reacts with no laptop attached']]}
  ]
};
const ckIds = k => k === 'hw' || k === 'ml' ? CK[k].flatMap(s => s.items.map(i => i[0])) : CK[k].map(i => i[0]);

/* ───────── Sample ledger (generated, fictional) ───────── */
const SALES_CSV = (() => {
  let a = 20261111; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const reps = ['Jim','Dwight','Stanley','Phyllis','Andy'], clients = ['Lackawanna County','Dunmore High','Vance Refrigeration','Scranton Business Park','Poor Richards Pub','Alfredos Pizza Cafe','Prince Family Paper','Electric City Sign Co'];
  const prods = [['Copy 20lb',4.25],['Cardstock',9.80],['Legal pad',2.10],['Premium laser',6.75]];
  const out = ['order_id,date,rep,client,product,reams,unit_price']; let d = '2026-01-05';

const defaults = () => ({v:1, t:0, from:today(), start:'', tr:{intern:[], apps:[], friends:[], trips:[]}, ck:{}, done:{}, habits:[], log:{}, rev:{}});
let S = defaults(), CODE = {}, codeT = 0;
const ui = {track:'data', ch:{}, out:{}, sample:null};
const store = {ref:null, cref:null, writing:false, ds:false, dc:false, timer:0};
function loadLocal(){ try { const a = JSON.parse(localStorage.getItem('sbi.state')); if (a && a.v === 1) S = Object.assign(defaults(), a); const c = JSON.parse(localStorage.getItem('sbi.code')); if (c) { CODE = c.code || {}; codeT = c.t || 0; } } catch (e) {} }
function keepLocal(){ try { localStorage.setItem('sbi.state', JSON.stringify(S)); localStorage.setItem('sbi.code', JSON.stringify({code:CODE, t:codeT})); } catch (e) {} }
function save(){ S.t = Date.now(); keepLocal(); store.ds = true; sched(); }
function saveCode(){ codeT = Date.now(); keepLocal(); store.dc = true; sched(); }
function sched(){ clearTimeout(store.timer); store.timer = setTimeout(flush, 900); }
async function flush(){
  if (!store.ref || store.writing) return; store.writing = true;
  try { if (store.ds) { store.ds = false; await store.ref.set(S); } if (store.dc) { store.dc = false; await store.cref.set({code:CODE, t:codeT}); } setSync('ok'); }
  catch (e) { setSync('err'); }
  store.writing = false; if (store.ds || store.dc) sched();
}
function setSync(m){ $('#sync').textContent = m === 'ok' ? 'Saved to your account. Your file follows you across devices.' : m === 'err' ? 'Could not reach your account just now. Changes are kept on this device and will retry on the next edit.' : 'Saved on this device only.'; }
async function connect(){
  if (!window.claude || !window.claude.use) return setSync('local');
  const [db, user, sample] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('sample')]);
  ui.sample = sample; if (sample) render();
  if (!db || !user) return setSync('local');
  const id = await user.id(); if (!id) return setSync('local');
  const col = db.collection('data/users/' + id); store.ref = col.doc('state'); store.cref = col.doc('code');
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000));
  const [a, b] = await Promise.race([Promise.all([store.ref.get(), store.cref.get()]), timeout]);
  const ra = a.data(), rb = b.data();
  if (ra && ra.v === 1 && (ra.t || 0) > (S.t || 0)) { S = Object.assign(defaults(), ra); } else if (S.t) store.ds = true;
  if (rb && (rb.t || 0) > codeT) { CODE = rb.code || {}; codeT = rb.t; } else if (codeT) store.dc = true;
  keepLocal(); setSync('ok'); render(); if (store.ds || store.dc) sched();
}

  return pageHead(d) + memo('toby', 'Weekly review', 'It only takes five minutes. Nobody else reads these. Three questions, once a week, and after a few months you will be able to see how far you have come. That is all I wanted to say.') +
    panel(`Week of ${fmtDate(k)}`, f('win', 'What went well', 'One thing you finished or are proud of') + f('stuck', 'What got in the way', 'Be specific, and kind') + f('next', 'The one thing for next week', 'If only one thing happens, it is this')) +
    (past.length ? panel('Filed reviews', past.map(x => `<div class="stage"><h3>Week of ${fmtDate(x)}</h3>${['win','stuck','next'].filter(q => S.rev[x][q]).map(q => `<p class="small"><span class="muted">${q === 'win' ? 'Went well' : q === 'stuck' ? 'In the way' : 'Next'}:</span> ${esc(S.rev[x][q])}</p>`).join('')}</div>`).join('')) : '');
}

/* ───────── Coding lab ───────── */
function curCh(){ const list = chOf(ui.track); return list.find(c => c.id === ui.ch[ui.track]) || list.find(c => !S.done[c.id]) || list[0]; }
function chList(){ const cur = curCh(); return chOf(ui.track).map((c, i) => `<button data-act="open" data-id="${c.id}" ${c.id === cur.id ? 'aria-current="true"' : ''}><span class="${S.done[c.id] ? 'ok' : 'n'}">${S.done[c.id] ? '✓' : i + 1}</span><span>${esc(c.t)}</span></button>`).join(''); }
function viewLab(d){
  const tr = TRACKS.find(t => t.id === ui.track), c = curCh(), h = HEADS[tr.head], code = CODE[c.id] != null ? CODE[c.id] : c.starter, o = ui.out[c.id];
  const tabs = `<div class="tabs" role="tablist">${TRACKS.map(t => `<button class="tab" role="tab" aria-selected="${t.id === ui.track}" data-act="track" data-tr="${t.id}">${badge(t.head)}<span class="tx"><b>${t.name}</b><span>${t.sub} · <span class="num">${labDone(t.id)}/${chOf(t.id).length}</span></span></span></button>`).join('')}</div>`;
  const dataPanel = ui.track === 'data' ? `<details><summary class="small"><b>The ledger</b> is available in your code as <span class="inl">SALES_CSV</span> (48 fictional orders). Show the first rows.</summary><pre class="io" style="margin-top:8px">${esc(SALES_CSV.split('\n').slice(0, 9).join('\n'))}\n…</pre><div class="row" style="margin-top:8px"><button class="btn" data-act="copycsv">Copy the full CSV</button><span class="small muted" id="copymsg">Paste it into a file called sales.csv for the pandas take-home.</span></div></details>` : '';
  const io = c.io ? `<div class="grid g2" style="gap:10px"><div><div class="eyebrow">Sample input</div><pre class="io">${esc(c.io[0])}</pre></div><div><div class="eyebrow">Expected output</div><pre class="io">${esc(c.io[1])}</pre></div></div>` : '';
  const actions = c.cpp
    ? `<button class="btn pri" data-act="cppdone">${S.done[c.id] ? 'Mark as not done' : 'It compiles and matches the sample'}</button>`
    : `<button class="btn pri" data-act="run" id="runbtn">Run and submit</button>`;
  const ai = ui.sample ? `<button class="btn" data-act="ask" id="askbtn">${c.cpp ? 'Request a code review from ' + h.n.split(' ')[0] : 'Ask ' + h.n.split(' ')[0] + ' for a hint'}</button>` : '';
  const cppNote = c.cpp ? `<p class="small muted">C++ does not run in this page. Write and compile it on your machine with <span class="inl">g++ -std=c++17 -Wall main.cpp</span>, or in an online compiler such as <a href="https://godbolt.org" target="_blank" rel="noopener">Compiler Explorer</a>, then paste your final version here so it is kept with your file.</p>` : '';
  const extra = ui.track === 'data' ? checklist('pandas', 'Take-home: the same ledger in pandas') : ui.track === 'ml' ? ladder('ml', 'Take-home projects') : ui.track === 'cp' ? `<p class="small muted">After a task is approved in Python, solve it again in C++. Speed with <span class="inl">vector</span>, <span class="inl">map</span> and <span class="inl">sort</span> is what contests reward.</p>` : '';
  return pageHead(d, `<span class="pill info num">${labDone()} of ${CH.length} approved</span>`) + tabs +
  `<div class="lab"><section class="panel"><header><h2>${esc(tr.name)}</h2><span class="small muted">${esc(h.n)}</span></header><div class="chlist" id="chlist">${chList()}</div></section>
   <section class="panel"><header><h2>${esc(c.t)}</h2><span class="pill ${S.done[c.id] ? 'good' : ''}" id="chstate">${S.done[c.id] ? 'Approved' : c.cpp ? 'C++ · self-checked' : 'Python · auto-checked'}</span></header>
   <div class="body"><div class="brief">${c.brief}</div>${io}${dataPanel}${cppNote}
   <label class="eyebrow" for="code">${c.cpp ? 'main.cpp' : 'solution.py'}</label>
   <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" rows="16">${esc(code)}</textarea>
   <div class="row">${actions}${ai}<button class="btn ghost" data-act="reset">Reset to starter</button></div>
   <div id="outwrap" ${o ? '' : 'hidden'}><div class="verdict ${o ? o.cls : ''}" id="verdict">${o ? esc(o.v) : ''}</div><pre id="out" style="margin-top:6px">${o ? esc(o.text) : ''}</pre></div>
   </div></section></div>` + extra;
}
function showOut(id, cls, v, text){ ui.out[id] = {cls, v, text}; if (curCh().id !== id) return; $('#outwrap').hidden = false; const e = $('#verdict'); e.className = 'verdict ' + cls; e.textContent = v; $('#out').textContent = text; }
function runPy(code, c){
  if (!window.Sk) return Promise.resolve({ok:false, out:'', err:'The Python runner did not load. Check your connection and reload the page.'});
  const pre = c.tr === 'data' ? PRELUDE : '', off = pre ? 1 : 0, userLines = code.split('\n').length;
  let out = '';
  Sk.configure({output: t => { if (out.length < 20000) out += t; }, read: x => { if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined) throw "File not found: '" + x + "'"; return Sk.builtinFiles.files[x]; }, __future__: Sk.python3, execLimit: 8000});
  return Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, pre + code + '\n' + (c.check || ''), true)).then(() => ({ok:true, out}), e => {
    let m = String(e && e.toString ? e.toString() : e);
    m = m.replace(/ on line (\d+)/, (s, n) => { n = +n - off; return n >= 1 && n <= userLines ? ' on line ' + n : ''; });
    if (/TimeLimitError|exceeded run time/i.test(m)) m = 'Your program ran for more than 8 seconds and was stopped. Look for a loop that never ends.';
    return {ok:false, out, err:m};
  });
}
window.__lab = {CH, runPy};
async function doRun(){
  const c = curCh(), code = $('#code').value; CODE[c.id] = code; saveCode();
  const btn = $('#runbtn'); btn.disabled = true; btn.textContent = 'Running…';
  const r = await runPy(code, c);
  btn.disabled = false; btn.textContent = 'Run and submit';
  if (r.ok) { const first = !S.done[c.id]; S.done[c.id] = S.done[c.id] || today(); save(); showOut(c.id, 'pass', 'Approved. All checks passed.', r.out || '(no output)'); if (first) { $('#chlist').innerHTML = chList(); const s = $('#chstate'); s.textContent = 'Approved'; s.className = 'pill good'; renderNav(); } }
  else showOut(c.id, 'fail', 'Not approved yet.', (r.out ? r.out + '\n' : '') + r.err);
}
async function doAsk(){
  const c = curCh(), tr = TRACKS.find(t => t.id === c.tr), h = HEADS[tr.head], code = $('#code').value, last = ui.out[c.id];
  CODE[c.id] = code; saveCode();
  const btn = $('#askbtn'), label = btn.textContent; btn.disabled = true; btn.textContent = 'Asking…';
  const task = c.brief.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
  const prompt = `You are a coding mentor on a personal practice dashboard themed as a paper company office. Reply in the voice of ${h.n} (${h.v}), but keep the technical content accurate and useful. The learner is a pre-university student who knows basic Python, is new to C++, and plans to study Electrical and Computer Engineering.\n\nTask (${c.cpp ? 'C++17' : 'Python'}): ${c.t}. ${task}\n${c.io ? `Sample input:\n${c.io[0]}\nExpected output:\n${c.io[1]}\n` : ''}\nTheir code:\n${code}\n${last && !c.cpp ? `\nLatest run result: ${last.v}\n${last.text.slice(0, 1500)}\n` : ''}\n${c.cpp ? 'Give a code review: say whether it looks correct for the sample, name one thing done well, and give up to three specific improvements (correctness first, then idiomatic C++).' : 'Give one hint that moves them forward. Point at the concept or the line that needs attention. Do not write the full solution.'} Under 170 words. Plain text only, no markdown.`;
  showOut(c.id, '', h.n + ' is reading your code…', '');
  try { const r = await ui.sample(prompt, {cache:false, onText: u => { if (curCh().id === c.id) $('#out').textContent = u.text; }}); showOut(c.id, '', h.n + ' says:', r.text); }
  catch (e) { const code = e && e.code; showOut(c.id, 'fail', 'No reply.', code === 'rate_limited' ? 'Too many requests for now. Try again in a few minutes.' : code === 'not_granted' ? 'Mentor replies are turned off for this page. You can allow them in the page\'s Permissions menu.' : 'The mentor could not be reached. Try again later.'); if (code === 'not_granted') { btn.hidden = true; } }
  btn.disabled = false; btn.textContent = label;
}

/* ───────── Render and events ───────── */
const VIEWS = {'front-desk':viewFront, sales:viewSales, admin:viewAdmin, lab:viewLab, warehouse:viewWarehouse, farm:viewFarm, social:viewSocial, hr:viewHR};
function render(){
  const h = location.hash.slice(1); route = VIEWS[h] ? h : 'front-desk';
  const a = document.activeElement, keep = a && a.id && a.closest('#main') ? {id:a.id, s:a.selectionStart, e:a.selectionEnd, v:a.id === 'code' ? a.value : null, top:a.scrollTop} : null;
  renderNav(); $('#main').innerHTML = VIEWS[route](DEPTS.find(d => d.id === route));
  if (keep) { const el = document.getElementById(keep.id); if (el) { if (keep.v != null && el.dataset.keep !== '0') el.value = keep.v; el.focus({preventScroll:true}); try { el.setSelectionRange(keep.s, keep.e); el.scrollTop = keep.top; } catch (e) {} } }
}
function stashCode(){ const el = $('#code'); if (el && route === 'lab') { const c = curCh(); if (el.value !== (CODE[c.id] != null ? CODE[c.id] : c.starter)) { CODE[c.id] = el.value; saveCode(); } } }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.matches('input,select,textarea')) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'track') { stashCode(); ui.track = b.dataset.tr; if (route === 'lab') { document.activeElement.blur(); render(); } return; }
  if (a === 'open') { stashCode(); ui.ch[ui.track] = b.dataset.id; document.activeElement.blur(); return render(); }
  if (a === 'run') return doRun();
  if (a === 'ask') return doAsk();
  if (a === 'reset') { const c = curCh(); delete CODE[c.id]; delete ui.out[c.id]; saveCode(); document.activeElement.blur(); return render(); }
  if (a === 'cppdone') { const c = curCh(); CODE[c.id] = $('#code').value; saveCode(); if (S.done[c.id]) delete S.done[c.id]; else S.done[c.id] = today(); save(); document.activeElement.blur(); return render(); }
  if (a === 'copycsv') { const m = $('#copymsg'); navigator.clipboard.writeText(SALES_CSV).then(() => { m.textContent = 'Copied.'; }, () => { m.textContent = 'Copy was blocked. Print SALES_CSV in the editor and copy it from the output.'; }); return; }
  if (a === 'del') { S.tr[k] = S.tr[k].filter(x => x.id !== b.dataset.id); save(); return render(); }
  if (a === 'suggest') { S.tr[k] = TR[k].suggest.map(s => ({id:uid(), a:s[0], b:s[1] || '', cat:s[2] || '', st:TR[k].stages[0], due:''})); save(); return render(); }
  if (a === 'regimen') { S.habits = ['Strength or run session','8,000 steps','Asleep before midnight','Two litres of water'].map(n => ({id:uid(), name:n})); save(); return render(); }
  if (a === 'delhabit') { S.habits = S.habits.filter(h => h.id !== b.dataset.h); save(); return render(); }
  if (a === 'tick') { const d = b.dataset.d, h = b.dataset.h; S.log[d] = S.log[d] || {}; S.log[d][h] = !S.log[d][h]; save(); return render(); }
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.act; if (!a) return;
  if (a === 'start') { S.start = el.value; save(); return render(); }
  if (a === 'ck') { S.ck[el.dataset.id] = el.checked; save(); return render(); }
  if (a === 'tick') { const d = el.dataset.d, h = el.dataset.h; S.log[d] = S.log[d] || {}; S.log[d][h] = el.checked; save(); return render(); }
  if (a === 'stage' || a === 'due') { const x = S.tr[el.dataset.k].find(i => i.id === el.dataset.id); if (x) { x[a === 'stage' ? 'st' : 'due'] = el.value; save(); render(); } return; }
  if (a === 'rev') { const k = weekKey(); S.rev[k] = S.rev[k] || {}; S.rev[k][el.dataset.f] = el.value; save(); renderNav(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form, v = id => { const el = document.getElementById(k + '-' + id); return el ? el.value.trim() : ''; };
  if (!v('a')) return;
  if (k === 'habit') S.habits.push({id:uid(), name:v('a')});
  else S.tr[k].push({id:uid(), a:v('a'), b:v('b'), cat:v('cat'), st:TR[k].stages[0], due:v('due')});
  save(); document.activeElement.blur(); render();
});
document.addEventListener('keydown', e => {
  if (e.target.id !== 'code') return;
  if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const t = e.target, s = t.selectionStart; t.setRangeText('    ', s, t.selectionEnd, 'end'); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && $('#runbtn')) { e.preventDefault(); doRun(); }
});
document.addEventListener('focusout', e => { if (e.target.id === 'code') stashCode(); });
window.addEventListener('hashchange', () => { document.activeElement && document.activeElement.blur(); render(); window.scrollTo(0, 0); });

loadLocal(); render(); connect().catch(() => setSync(store.ref ? 'err' : 'local'));
</script>

<title>Panel Room SG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar + MRT-style "line" tabs; each board is a line with its own colour and station-code badge.
   Content is a dossier column beside a trainer column, stacking to one column on phones. Practice opens as a full-screen studio. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E6EBEE; --ink:#111B23; --ink-2:#4B5963; --line:#D2DADF;
  --accent:#C8232C; --accent-ink:#FFFFFF; --accent-soft:#F8E3E3;
  --good:#1D7A4C; --warn:#9A5B00; --bad:#B3261E; --focus:#005EC4;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --gap:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1216; --surface:#131B21; --surface-2:#1B252C; --ink:#E3E9EC; --ink-2:#9BA9B2; --line:#28343C;
  --accent:#FF5B52; --accent-ink:#1C0A0A; --accent-soft:#3A1A1A;
  --good:#4CC38A; --warn:#E5A33B; --bad:#FF7A70; --focus:#73AEFF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1216; --surface:#131B21; --surface-2:#1B252C; --ink:#E3E9EC; --ink-2:#9BA9B2; --line:#28343C;
  --accent:#FF5B52; --accent-ink:#1C0A0A; --accent-soft:#3A1A1A;
  --good:#4CC38A; --warn:#E5A33B; --bad:#FF7A70; --focus:#73AEFF; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:82%;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(26px,4vw,38px);font-weight:800}
h2{font-size:clamp(21px,2.6vw,26px);font-weight:800}
h3{font-size:17px;font-weight:750}
h4{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-stretch:100%}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.tab-nums{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:900;font-size:13px;font-stretch:75%}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:850;font-stretch:78%;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--ink-2);line-height:1.2}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:5px 11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.dot.on{background:var(--good)} .dot.busy{background:var(--warn);animation:pulse 1s infinite} .dot.off{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.lines{display:flex;gap:6px;overflow-x:auto;padding-block:8px 10px;scrollbar-width:thin}
.line-tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font:600 13.5px var(--f-body);cursor:pointer;white-space:nowrap}
.line-tab:hover{border-color:var(--ink-2)}
.line-tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.code{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:7px;font:800 12px var(--f-display);font-stretch:85%;letter-spacing:.04em;color:#fff;background:var(--c,#555)}
.code.lt{color:#13200A}
.code.big{min-width:54px;height:38px;font-size:18px;border-radius:10px}

/* generic */
main{padding-block:22px 64px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flat{background:transparent;border-style:dashed}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{font-size:13px;padding:6px 10px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.chip.official{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.reported{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
textarea,input[type=text],select{width:100%;font:15px/1.5 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{resize:vertical;min-height:110px}
label.lbl{font-size:13px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:5px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.clean li::marker{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:9px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.kv b{display:block;font-size:14px;line-height:1.35;margin-top:2px}
details.sec{border-top:1px solid var(--line);padding-block:12px}
details.sec:first-of-type{border-top:0;padding-top:4px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font:700 18px var(--f-mono);color:var(--ink-2)}
details.sec[open]>summary::after{content:"–"}
details.sec>.body{padding-top:10px}
.md{display:flex;flex-direction:column;gap:9px;min-width:0;overflow-wrap:anywhere}
.md h3{margin-top:6px}
.md ul,.md ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.md strong{font-weight:700}
.out{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin-top:6px}
.out.thinking{color:var(--ink-2);font-style:italic}
.note{font-size:13px;color:var(--ink-2)}
.err{color:var(--bad);font-size:14px}

/* briefing */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:stretch;margin-bottom:22px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.drill{background:var(--ink);color:var(--bg);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.drill .eyebrow{font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.drill q{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.15;quotes:"“" "”"}
.drill .btn{border-color:transparent}
.drill .btn.ghost{color:var(--bg);opacity:.85}
.drill .btn.ghost:hover{border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.asof{display:flex;flex-direction:column;gap:10px}
.asof .big{font:850 44px/1 var(--f-display);font-stretch:75%;color:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:420px){.themes{grid-template-columns:minmax(0,1fr)}}
.theme{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.theme .stamp{font:600 12px var(--f-mono);color:var(--ink-2)}
.theme ul{font-size:14px}
.theme .links{display:flex;gap:5px;flex-wrap:wrap}
.theme .links .code{height:20px;min-width:28px;font-size:10.5px;border-radius:6px}
.theme .actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:30px 0 14px}

/* board header */
.board-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.board-head .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.qitem p{font-size:14.5px;min-width:0}
.qitem .tag{font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);display:block;margin-bottom:2px}
.qitem .btn{flex:0 0 auto}
.sources{font-size:13px}
.sources a{word-break:break-word}

/* studio */
.studio{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.studio-bar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.studio-bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px;flex-wrap:wrap}
.studio-q{padding-block:22px 6px}
.studio-q .qtext{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:clamp(22px,3.2vw,32px);line-height:1.15;margin-top:8px;text-wrap:balance}
.cam{position:relative;aspect-ratio:4/3;max-width:100%;background:#0b1013;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#cfd8dc;text-align:center}
.cam video{width:100%;height:100%;object-fit:cover;background:#0b1013}
.cam video.mirror{transform:scaleX(-1)}
.cam .ph{padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;font-size:14px;max-width:360px}
.cam .ph .btn{background:#1d272d;color:#e8eef0;border-color:#33424a}
.rec{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:4px 10px;font:600 13px var(--f-mono)}
.rec i{width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:pulse 1s infinite}
.meter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter div{background:var(--surface-2);border-radius:9px;padding:8px 10px}
.meter span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.meter b{font:600 18px var(--f-mono)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.score{background:var(--surface-2);border-radius:9px;padding:10px 12px}
.score .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ink)}
.bar i.hi{background:var(--good)} .bar i.mid{background:var(--warn)} .bar i.lo{background:var(--bad)}
.overall{display:flex;gap:16px;align-items:center}
.overall .n{font:850 56px/1 var(--f-display);font-stretch:72%}
.fu{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.fu:first-child{border-top:0}
.model{background:var(--surface-2);border-radius:10px;padding:14px 16px;white-space:pre-wrap}

/* profile / progress */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.attempt{border-top:1px solid var(--line);padding-block:10px}
.attempt summary{cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between}
.attempt summary span.q{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

  <div class="wrap">

   "The resident **total fertility rate fell to 0.87 in 2025** (0.97 in 2024), a record low. About **one in five citizens is 65 or older**, compared with one in eight in 2015.",
   "DPM Gan Kim Yong said that without new measures the **citizen population will start shrinking in the early 2040s**.",
   "NDR 2026: a new **SG Child Support Package** replaces the Baby Bonus. It gives **S$2,000 a year** in child credits from age 1 to 16, regardless of birth order, about **S$70,000 per child by 17**, fully for children born from **1 Apr 2027**.",
   "Childcare leave rises to **8/10/12 days** for parents with 1/2/3+ children aged 12 and below. Full-day childcare at government-supported centres will fall to **S$150/month** (infant care S$300) by 2030."],
  tensions:["Money vs. culture: can incentives move fertility at all?","Immigration as a fix vs. social cohesion","An older workforce means automation is a necessity"],
  angle:"Fewer NS soldiers, bus captains and nurses mean automation is a matter of national capacity. Autonomous systems, robotics and assistive tech are how engineers respond.",
  qs:["Singapore’s TFR is 0.87. Is the new SG Child Support Package going to work?","What role should technology play in an ageing Singapore?","Should Singapore take in more immigrants to deal with its falling birth rate?"]},
 {id:"housing", title:"Housing and cost of living", stamp:"Latest: 24 Aug 2026", boards:["psc","mas"],
  facts:[
   "The BTO household income ceiling rose from **S$14,000 to S$16,000** (EC: S$16,000 to S$18,000) from **24 Aug 2026**, because couples now marry later and earn more by then.",
   "From the **Feb 2027** sales exercise, first-timers get **one extra ballot chance per child** they have or are expecting.",
   "HDB has classified new flats as **Standard, Plus or Prime** since Oct 2024, to keep central locations affordable and fair.",
   "Cost-of-living support: a S$200–400 Cost-of-Living Special Payment (Sep 2026), U-Save rebates, and **S$500 CDC vouchers in Jan 2027**. Public transport fares rise by **12–13 cents per ride from Dec 2026**."],
  tensions:["Affordability vs. housing as a store of wealth","Broad handouts vs. targeted help","Fare increases vs. sustainable public transport financing"],
  angle:"Data-driven planning (demand forecasting for BTO launches, digital twins of new towns like Tengah) is where engineers shape housing.",
  qs:["Is public housing in Singapore still affordable?","Should the Government keep raising income ceilings for BTO flats?","How should Singapore help people with the cost of living without fuelling inflation?"]},
 {id:"climate", title:"Climate, coasts and haze", stamp:"Latest: haze, Oct 2026", boards:["pub","psc","lta","astar"],
  facts:[
   "**Haze** from fires in Indonesia (especially Kalimantan) pushed the PSI into the **unhealthy range on 4 Sep 2026** (central PSI 123) for the first time in three years, and air quality stayed unhealthy into Oct. PM Wong said the Government is looking into companies that may be responsible. The Transboundary Haze Pollution Act (2014) allows action against them.",
   "**Long Island**: preparatory works on the ~**800 ha** reclamation off East Coast start from **end-2026**. It will include two barrages, pumping stations and a new reservoir. East Coast Park flooded in **Jan 2024 and Jan 2026**.",
   "Mean sea level could rise up to **1.15 m by 2100**, and up to 4–5 m in extreme tide and storm-surge events. PUB has been the national coastal protection agency since 2020.",
   "The **Equatic-1** seawater CO₂-removal plant began operating in Tuas on **31 Mar 2026**. It removes about 1 tonne of CO₂ a day at first."],
  tensions:["Spend billions now on coastal defence vs. other needs","Hold the line with hard engineering vs. nature-based solutions","Diplomacy vs. legal action on transboundary haze"],
  angle:"Sensing and forecasting: tide-gauge networks, flood digital twins, satellite fire detection and air-quality models. This is ECE and data work.",
  qs:["Is Long Island worth tens of billions of dollars?","The haze is back. Should Singapore take legal action against companies abroad?","Is Singapore doing enough on climate change, given it emits so little globally?"]},
 {id:"transport", title:"Transport and the next islands", stamp:"Latest: RTS delay, 2 Oct 2026", boards:["lta","psc","dsta"],
  facts:[
   "**Circle Line Stage 6** opened on **12 Jul 2026**, completing the loop. Cross Island Line Stage 3 (four stations) was detailed in Jul. LTA is studying **bus rapid transit for Tuas South**.",
   "The **Johor Bahru–Singapore RTS Link** (4 km, about 10,000 passengers per hour in each direction, roughly 5 minutes) has reportedly been **pushed from Dec 2026 to Feb 2027**, pending independent safety certification.",
   "The **Ai.R autonomous shuttle** started public service in Punggol on **1 Apr 2026**. At NDR 2026, PM Wong said AVs will be scaled up once proven, citing hard-to-fill bus captain jobs and an ageing taxi workforce.",
   "NDR 2026: Singapore is studying **undersea tunnels to Pulau Tekong**. Southern Tekong will be reclaimed for SAF training, leaving about **500 ha for civilian use**.",
   "Road safety returned to the spotlight after a six-year-old was killed by a speeding car in Chinatown (Feb 2026)."],
  tensions:["Automation vs. jobs for bus and taxi drivers","Fares vs. subsidies","Car-lite ambitions vs. the cost of car ownership"],
  angle:"Signalling, condition-based maintenance, sensor fusion for AVs and network reliability engineering are where an ECE/CS scholar contributes.",
  qs:["Should Singapore replace bus captains with autonomous buses?","What makes cross-border rail like the RTS Link so hard to deliver?","How would you reduce MRT breakdowns?"]},
 {id:"digital", title:"Online safety, AI risk and scams", stamp:"Latest: NDR 23 Aug 2026", boards:["imda","sn","mas","psc"],
  facts:[
   "The **Online Safety Commission** began work on **29 Jun 2026** under the Online Safety (Relief and Accountability) Act 2025. Victims of harassment, doxxing, stalking, intimate image abuse and image-based child abuse can seek takedowns, usually after a platform fails to act within 24 hours.",
   "NDR 2026: platforms must run **robust age checks** instead of relying on self-declared ages. Singapore will form **coalitions with countries and companies on practical AI safeguards**. PM Wong cited an AI agent that went beyond its test environment and attacked a company.",
   "**SG Alert**, a cell-broadcast emergency alert system, was tested from **10 May 2026**.",
   "Scams: a Shared Responsibility Framework for banks and telcos took effect in Dec 2024, and the Protection from Scams Act (2025) lets the police restrict a victim’s banking transactions."],
  tensions:["Safety by design vs. privacy (age verification data)","Regulate AI early vs. let innovation run","Individual responsibility vs. platform accountability for scams"],
  angle:"Age assurance, deepfake detection, secure-by-design systems and agent sandboxing are concrete engineering problems you can discuss in depth.",
  qs:["Should social media be banned for children under 16?","How should Singapore keep AI agents safe without stifling innovation?","Who should pay when a Singaporean is scammed: the bank, the telco or the victim?"]},
 {id:"defence", title:"Defence and Total Defence", stamp:"Latest: Jul 2026", boards:["dsta","psc","sn"],
  facts:[
   "Defence spending stays at **about 3% of GDP** (Budget 2026), with room to spend more if threats require it.",
   "The **Digital and Intelligence Service (DIS)** has been the SAF’s fourth service since **Oct 2022**. In **Jul 2026**, DIS and DSTA began working with IBM on **quantum computing for mission planning and logistics optimisation**. MINDEF, DSTA and DSO are also co-developing generative AI models with Mistral AI.",
   "**Exercise SG Ready** began on 1 Feb 2026 with the Public Warning System sounding at 3pm. Total Defence has six pillars, including Digital Defence (added 2019).",
   "A new NS medical classification system will replace the Physical Employment Standards from **Oct 2027**."],
  tensions:["Deterrence vs. diplomacy for a small state","Smaller NS cohorts vs. more complex threats","Buy foreign systems vs. build sovereign capability"],
  angle:"Systems-of-systems integration, cyber defence, unmanned systems and AI decision support: DSTA’s work is mostly integration engineering.",
  qs:["Why does Singapore still need such a strong military?","How should the SAF stay strong with fewer people?","What can Singapore learn from the war in the Middle East?"]},
 {id:"politics", title:"Politics, institutions and trust", stamp:"Latest: Sep 2026", boards:["psc"],
  facts:[
   "**GE2025 (3 May 2025)**: the PAP won 87 of 97 seats with about 65.6% of the vote. Lawrence Wong led it as PM for the first time. The Workers’ Party won 10 seats.",
   "On **15 Jan 2026** PM Wong removed **Pritam Singh as Leader of the Opposition**, after Parliament found him unsuitable following his conviction for lying to a parliamentary committee (upheld on appeal in Dec 2025).",
   "**Cabinet reshuffle** (effective 27 Jul 2026): K Shanmugam became Senior Minister, Ng Chee Meng became Minister in the PMO, Jasmin Lau became Acting Minister for Manpower, and MTI became METI.",
   "Political office-holder and MP salaries rose from **15 Oct 2026**, the first increase in 15 years. Chief Justice Sundaresh Menon will step down in **Feb 2027**."],
  tensions:["Paying for talent vs. the ethos of public service","A dominant party vs. a stronger opposition","Holding office-holders to high standards vs. fairness and due process"],
  angle:"Show how you would earn public trust as a technocrat: transparency, explaining trade-offs plainly, and owning mistakes (for example, open data and clear incident post-mortems).",
  qs:["Why should a talented engineer join the public service instead of the private sector?","Should ministers be paid so much?","What does it mean to be a public servant in a world of low trust?"]},
 {id:"research", title:"Research, chips and quantum", stamp:"Latest: RIE2030 from Apr 2026", boards:["astar","edb","dsta","sn"],
  facts:[
   "**RIE2030** commits **S$37b** over five years from Apr 2026, across four domains: advanced manufacturing and engineering; health and biomedical sciences; sustainability and urban solutions; and AI, quantum and digital.",
   "New in RIE2030: **RIE Flagships and Grand Challenges**. A **Semiconductor RIE Flagship** led by A*STAR and EDB focuses on **heterogeneous integration / advanced packaging and silicon photonics**.",
   "The National Quantum Strategy (2024) builds quantum computing, sensing and communications capability. DIS/DSTA’s 2026 quantum pilot with IBM is one application.",
   "EDB says Singapore makes about **one in ten of the world’s chips** and about a fifth of global semiconductor equipment. AI-driven chip demand drove growth in 2026."],
  tensions:["Basic science vs. near-term industrial payoff","Attract global firms vs. build local deep-tech champions","Talent pipelines: PhDs who stay vs. leave"],
  angle:"Silicon photonics, advanced packaging and edge AI hardware sit squarely in ECE. Say which one excites you and why.",
  qs:["How should Singapore measure whether S$37b of research spending was worth it?","Why should Singapore invest in quantum computing?","Should Singapore try to build its own chip companies?"]}
];

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:!?]|$)/g,"$1<em>$2</em>")}
function md(src){
  const lines=String(src??"").replace(/\r/g,"").split("\n"); let html="", list=null;
  const close=()=>{if(list){html+=`</${list}>`;list=null}};
  for(const raw of lines){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){close();continue}
    if((m=l.match(/^#{1,4}\s+(.*)/))){close();html+=`<h3>${inline(m[1])}</h3>`;continue}
    if((m=l.match(/^\s*[-•*]\s+(.*)/))){if(list!=="ul"){close();html+="<ul>";list="ul"}html+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){close();html+="<ol>";list="ol"}html+=`<li>${inline(m[1])}</li>`;continue}
    close();html+=`<p>${inline(l)}</p>`;
  }
  close();return html;
}

function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function codeBadge(o,cls=""){return `<span class="code ${o.lightText?"lt":""} ${cls}" style="--c:${o.color}">${esc(o.code)}</span>`}

const AI = {
  mode:"checking", sample:null, web:false, imgLimit:0, busy:0,
  async init(){
    try{
      if(window.claude && typeof window.claude.use==="function"){
        this.sample = await window.claude.use("sample");
        if(this.sample){
          this.mode="artifact";
          try{const lim=await this.sample.limits();this.imgLimit=lim?.images?.maxCount||0}catch{this.imgLimit=0}
          return this.paint();
        }
      }
    }catch{}
    try{
      const r=await fetch("/api/health",{cache:"no-store"});
      if(r.ok){const j=await r.json();this.mode="local";this.web=!!j.web;this.imgLimit=6;return this.paint()}
    }catch{}
    this.mode="none";this.paint();
  },
  lastMode:null,
  paint(){
    const dot=$("#aiDot"),txt=$("#aiText");
    dot.className="dot "+(this.busy?"busy":this.mode==="none"?"off":this.mode==="checking"?"":"on");
    txt.textContent = this.busy? "Claude is working…" :
      this.mode==="artifact"?"Claude connected":this.mode==="local"?("Claude API (local)"+(this.web?" · web search on":"")):
      this.mode==="none"?"Claude not connected":"Connecting to Claude…";
    if(this.mode!==this.lastMode){this.lastMode=this.mode;document.dispatchEvent(new CustomEvent("ai-mode"))}
  },
  ready(){return this.mode==="artifact"||this.mode==="local"},
  errorText(e){
    const c=e?.code;
    if(c==="not_granted"||c==="sampling_disabled")return "Claude access was declined for this page. Allow it from the artifact’s permissions to use AI features.";
    if(c==="rate_limited")return "Too many requests right now. Wait a minute, then try again.";
    if(c==="refused")return "Claude declined that request. Try rephrasing it.";
    if(c==="prompt_too_large")return "That input is too long. Paste a shorter excerpt.";
    if(c==="image_rejected")return "One of the video frames couldn’t be read. Feedback will run without them if you retry.";
    if(c==="invalid_json")return "Claude’s reply came back in the wrong format. Try again.";
    if(c==="cancelled")return "Stopped.";
    if(c==="no_ai")return "Claude isn’t connected. Open this page on claude.ai, or run the local server (see the README).";
    return e?.message?e.message:"Something went wrong. Try again.";
  },
  /* ask Claude; returns text. opts: onText, signal, images (Blob[]), json, web, cache */
  async ask(prompt,opts={}){
    if(!this.ready())throw {code:"no_ai"};
    this.busy++;this.paint();
    try{
      if(this.mode==="artifact"){
        const o={};
        if(opts.onText)o.onText=opts.onText;
        if(opts.signal)o.signal=opts.signal;
        if(opts.images?.length&&this.imgLimit)o.images=opts.images.slice(0,this.imgLimit);
        if(opts.tier)o.modelTier=opts.tier;
        if(opts.cache===false)o.cache=false;
        if(opts.json)return await this.sample.json(prompt,o);
        const r=await this.sample(prompt,o);return r.text;
      }
      const images=[];
      for(const b of (opts.images||[]).slice(0,6)) images.push({media_type:b.type||"image/jpeg",data:await blobToB64(b)});
      const res=await fetch("/api/claude",{method:"POST",headers:{"content-type":"application/json"},signal:opts.signal,
        body:JSON.stringify({prompt,images,web:!!opts.web&&this.web,json:!!opts.json,effort:opts.tier==="complex"?"high":opts.tier==="quick"?"low":"medium"})});
      if(!res.ok){let m="HTTP "+res.status;try{m=(await res.json()).error||m}catch{}throw {code:"upstream_error",message:m}}
      const reader=res.body.getReader(),dec=new TextDecoder();let text="";
      for(;;){const {done,value}=await reader.read();if(done)break;const delta=dec.decode(value,{stream:true});if(!delta)continue;text+=delta;opts.onText&&opts.onText({text,delta})}
      const srvErr=text.match(/^\s*\[([^\]]+)\]\s*$/);
      if(opts.json){const v=parseJSON(text);if(v===undefined)throw srvErr?{code:"upstream_error",message:srvErr[1]}:{code:"invalid_json",text};return v}
      return text;
    }catch(e){
      if(e?.name==="AbortError")throw {code:"cancelled"};
      throw e;
    }finally{this.busy--;this.paint()}
  }
};
function blobToB64(b){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(b)})}
function parseJSON(t){
  const tryP=s=>{try{return JSON.parse(s)}catch{return undefined}};
  let v=tryP(t.trim());if(v!==undefined)return v;
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f&&(v=tryP(f[1].trim()))!==undefined)return v;
  const a=Math.min(...["{","["].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i})),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a<b)return tryP(t.slice(a,b+1));return undefined;
}

  },

let ctl=null;
function stream(el,prompt,opts={}){
  if(!AI.ready()){el.innerHTML=`<p class="err">${esc(AI.errorText({code:"no_ai"}))}</p>`;return Promise.resolve(null)}
  el.innerHTML=`<div class="out thinking">Thinking…</div>`;
  const box=el.firstElementChild;
  return AI.ask(prompt,{...opts,onText:({text})=>{box.classList.remove("thinking");box.innerHTML=`<div class="md">${md(text)}</div>`}})
   .then(t=>{box.classList.remove("thinking");box.innerHTML=`<div class="md">${md(t)}</div>`;return t})
   .catch(e=>{box.classList.remove("thinking");box.innerHTML=(e?.text?`<div class="md">${md(e.text)}</div>`:"")+`<p class="err">${esc(AI.errorText(e))}</p>`;return null});
}

const Mock={
  run:null,
  async start(o,btn){
    if(!AI.ready())return toast(AI.errorText({code:"no_ai"}));
    btn.disabled=true;const old=btn.textContent;btn.textContent="Claude is assembling the panel…";
    try{
      const arr=await AI.ask(baseContext(o)+`

TASK: You are chairing a ${o.name} scholarship panel. Prepare a 5-question mock interview for THIS candidate, in this order:
1) an opener about them and their motivation for this board, 2) a question about the board's work and future, 3) a current-affairs question from the briefing tied to the board, 4) a technical or problem-solving question suited to an ECE/CS candidate, 5) a curveball or ethics question.
Make them sound like real panellists: short and pointed.
Reply with only a JSON array of 5 objects: [{"q":"...","type":"personal|board|current|technical|ethics|curveball"}]`,{json:true,cache:false});
      const qs=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.q).slice(0,5).map(x=>({q:String(x.q),type:TYPE_LABEL[x.type]?x.type:"board"}));
      if(!qs.length)throw {code:"invalid_json"};

      Studio.open({q:qs[0].q,type:qs[0].type,org:o.id,mock:true});
    }catch(err){toast(AI.errorText(err))}
    finally{btn.disabled=false;btn.textContent=old}
  },
  record(att){if(this.run)this.run.results[this.run.i]=att},
  next(){if(!this.run)return;this.run.i++;const n=this.run.qs[this.run.i];if(n)Studio.open({q:n.q,type:n.type,org:this.run.org,mock:true});else Studio.verdict()},
  end(){this.run=null}
};

    el.scrollTop=0;

    if(!(window.SpeechRecognition||window.webkitSpeechRecognition))$("#sttNote").textContent="Live transcription isn’t available in this browser. Type, or use your keyboard’s dictation (the mic key on phones, Fn twice on a Mac).";
    if(this.stream)this.attachStream();
  },
  act(s,b){
    if(s==="close")return this.close();

  },
  async startCam(){

      if(!navigator.mediaDevices?.getUserMedia)throw new Error("unsupported");

    }catch(e){
      note.textContent="This page can’t use your camera here (claude.ai blocks camera access in artifacts). Record a clip with your phone or laptop camera and upload it, or answer with the timer. For a live camera, run the local version from the README.";

  },
  attachStream(){
    const v=$("#vid");if(!v)return;v.hidden=false;$("#camPh").hidden=true;v.srcObject=this.stream;v.muted=true;v.classList.add("mirror");v.controls=false;v.play().catch(()=>{});

  },
  upload(file){
    if(!file)return;
    const v=$("#vid");if(this.videoUrl)URL.revokeObjectURL(this.videoUrl);
    this.videoUrl=URL.createObjectURL(file);v.srcObject=null;v.src=this.videoUrl;v.hidden=false;v.muted=false;v.controls=true;v.classList.remove("mirror");$("#camPh").hidden=true;

      this.secs=Math.round(v.duration||0);$("#mT").textContent=fmt(this.secs);this.meters();

      toast(this.frames.length?`Clip loaded: ${this.frames.length} frames for presence feedback`:"Clip loaded");
      $("#sttNote").textContent="Live transcription can’t read uploaded clips. Type or dictate what you said (a rough version is fine). Claude will judge your words plus the frames from your clip.";
    };
  },
  startAnswer(withCam){
    this.frames=[];this.chunks=[];this.finalText=$("#ans").value?$("#ans").value.trim()+" ":"";
    if(withCam&&this.stream&&window.MediaRecorder){
      try{this.rec=new MediaRecorder(this.stream);this.rec.ondataavailable=e=>e.data.size&&this.chunks.push(e.data);this.rec.onstop=()=>this.finishRecording();this.rec.start(1000)}catch{this.rec=null}
    }
    this.t0=Date.now();this.secs=0;$("#recBadge").hidden=!withCam||!this.stream;
    $("#recBtn").disabled=true;$("#stopBtn").disabled=false;$("#timerBtn").disabled=true;
    this.timer=setInterval(()=>{this.secs=Math.round((Date.now()-this.t0)/1000);$("#mT").textContent=fmt(this.secs);$("#recT").textContent=fmt(this.secs);this.meters();
      if(withCam&&this.stream&&[8,30,55,85].includes(this.secs))this.snap();

  },
  stopAnswer(){

    if(this.stream&&this.frames.length<2)this.snap();
    this.meters();
  },
  finishRecording(){
    if(!this.chunks.length)return;
    const blob=new Blob(this.chunks,{type:this.chunks[0].type||"video/webm"});
    if(this.videoUrl)URL.revokeObjectURL(this.videoUrl);this.videoUrl=URL.createObjectURL(blob);
    const cam=$("#cam");if(!cam)return;
    let pb=$("#playback");if(!pb){pb=document.createElement("div");pb.id="playback";pb.className="row";cam.after(pb)}

    }catch{}
  },
  stopSTT(){const r=this.recog;this.recog=null;try{r&&r.stop()}catch{}},

QUESTION: "${this.ctx.q}"
TASK: Without writing the answer for them, give the candidate a 5-bullet plan for answering: the position to consider, the 1–2 facts from the briefing worth using, the trade-off to acknowledge, the engineer's angle, and the link back to ${o?o.short:"the boards they are applying to"}. Under 130 words.`,{tier:"quick"});

      </section>
    </div>`;
    $("#fb").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  },
  async verdict(){
    const run=Mock.run;if(!run)return;const o=ORG[run.org];
    const done=run.results.filter(Boolean);
    const fb=$("#fb");fb.innerHTML=`<div class="panel"><div class="out thinking">The panel is deciding…</div></div>`;
    const summary=done.map((a,i)=>`Q${i+1} (${a.type}): ${a.q}\nAnswer: ${a.answer.slice(0,1500)}\nScore: ${a.fb.overall}/10. Gaps: ${a.fb.gaps.join("; ")}`).join("\n\n");
    try{
      const v=await AI.ask(baseContext(o)+`

TASK: You chaired a 5-question ${o.name} mock panel. Here is the transcript summary:
${summary||"(no answers recorded)"}

Give the panel's overall decision. Reply with only JSON: {"decision":"Strong offer|Likely offer|Borderline|Not yet","summary":"3-4 sentences as a panel chair would write","best_moment":"the single best moment","fixes":["the 3 highest-impact things to work on before the real interview"],"next_drills":["3 specific questions to practise next"]}`,{json:true,cache:false,tier:"complex"});
      fb.innerHTML=`<section class="panel stack">
        <h4>${esc(o.name)} · mock panel decision</h4>
        <h2>${esc(v.decision||"")}</h2>
        <p>${esc(v.summary||"")}</p>
        ${v.best_moment?`<div><h4>Best moment</h4><p>${esc(v.best_moment)}</p></div>`:""}
        <div><h4>Work on these before the real thing</h4><ul class="clean">${(v.fixes||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div><h4>Practise next</h4><div class="qlist">${(v.next_drills||[]).map(q=>`<div class="qitem"><p>${esc(q)}</p><button class="btn small" data-s="followup" data-q="${esc(q)}">Answer</button></div>`).join("")}</div></div>
        <div class="row"><button class="btn primary" data-s="done">See my progress</button></div>
      </section>`;
    }catch(e){fb.innerHTML=`<div class="panel"><p class="err">${esc(AI.errorText(e))}</p></div>`}
  },
  close(){
    this.stopTimer();this.stopSTT();if(this.rec&&this.rec.state!=="inactive")this.rec.stop();
    try{speechSynthesis.cancel()}catch{}
    this.fbCtl?.abort();
    const el=$("#studio");el.hidden=true;el.innerHTML="";document.body.style.overflow="";
    if(tab==="me")render();
  }
};
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function sanitizeFb(r){
  const n=x=>Math.max(1,Math.min(10,Math.round(+x||0)))||1, arr=x=>Array.isArray(x)?x.map(String).filter(Boolean).slice(0,6):[], s=x=>x?String(x):"";
  const sc=r?.scores||{};
  return {overall:n(r?.overall),verdict:s(r?.verdict),scores:{substance:n(sc.substance),structure:n(sc.structure),singapore_insight:n(sc.singapore_insight),board_fit:n(sc.board_fit),engineer_lens:n(sc.engineer_lens),delivery:n(sc.delivery)},
    strengths:arr(r?.strengths),gaps:arr(r?.gaps),followups:arr(r?.followups).slice(0,3),facts_to_use:arr(r?.facts_to_use),better_opening:s(r?.better_opening),model_answer:s(r?.model_answer),presence:s(r?.presence)};
}
async function grabFramesFromFile(v,n){
  const out=[];const d=v.duration;if(!d||!isFinite(d))return out;
  const c=document.createElement("canvas");
  for(let i=1;i<=n;i++){
    const t=d*i/(n+1);
    await new Promise(res=>{const h=()=>{v.removeEventListener("seeked",h);res()};v.addEventListener("seeked",h);v.currentTime=t;setTimeout(res,1500)});
    if(!v.videoWidth)continue;
    const w=640,h=Math.round(640*v.videoHeight/v.videoWidth);c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.8));if(b)out.push(b);
  }
  try{v.currentTime=0}catch{}
  return out;
}

a written form.<\/p>\n<p>Traditional life combines pastoralism in the mountains and plateaux, fishing on the coasts, and date gardens in the wadis. Resource use has long been regulated. Maděra et al. describe 19th-century accounts of land divided into lots and leased to Bedouin groups for resin harvesting. Today Socotra faces the sharpest form of Baldacchino's question: rapid change is being decided by actors far from the island, while the people with the deepest knowledge of its ecosystems have the least formal power.<\/p>\n"]],"readings":["garciaporta2016","madera2020"],"assignment":["Conservation dilemma (900 words)","Design a conservation plan for the dragon's blood tree that is scientifically sound (using Maděra et al. 2020) and socially just to Soqotri herders. Show how you would test whether it works."],"seminar":["Socotra and the Falklands are both continental fragments. Why is one so rich in endemics and the other so poor?","Garcia-Porta et al. find an 'island effect' for body size but not for head shape. What does that imply for the idea of an 'island syndrome'?","Who should decide Socotra's development: Yemen, the UAE, UNESCO or the Soqotri? What would 'on their own terms' mean here?"]},{"id":"synthesis","num":7,"short":"Synthesis","title":"Synthesis: comparing islands","kicker":"Capstone","summary":"Bring the six cases together. Compare them on physical and human dimensions, test the course's theories against them, and write a nissological profile of an island of your own choosing.","objectives":["Compare islands systematically across physical, ecological and human dimensions.","Evaluate the explanatory power of island biogeography theory across very different islands.","Produce an original, research-based island profile."],"sections":[["The six islands side by side","\n<div class=\"table-wrap\"><table class=\"compare\">\n<thead><tr><th>Island<\/th><th>Type<\/th><th>Age of land<\/th><th>Area<\/th><th>Highest<\/th><th>People<\/th><th>Key threat in the readings<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><a href=\"#funafuti\">Funafuti<\/a><\/td><td>Atoll<\/td><td>Islets: last few thousand years<\/td><td>2.6 km²<\/td><td>≈4–5 m<\/td><td>≈5,500 on Fogafale<\/td><td>Sea-level rise; sediment supply<\/td><\/tr>\n<tr><td><a href=\"#pitcairn\">Pitcairn / Henderson<\/a><\/td><td>Hotspot volcano / raised atoll<\/td><td>0.8 Ma / 13 Ma<\/td><td>4.5 / 43 km²<\/td><td>≈340 / 33 m<\/td><td>≈40 / 0<\/td><td>Rats; marine plastic; depopulation<\/td><\/tr>\n<tr><td><a href=\"#falklands\">Falklands<\/a><\/td><td>Continental fragment<\/td><td>Rocks to ≈1 Ga<\/td><td>≈12,000 km²<\/td><td>705 m<\/td><td>≈3,600<\/td><td>Grazing; invasive predators<\/td><\/tr>\n<tr><td><a href=\"#tristan\">Tristan da Cunha<\/a><\/td><td>Hotspot volcano<\/td><td>&lt; 1.3 Ma<\/td><td>98 km²<\/td><td>≈2,060 m<\/td><td>≈240<\/td><td>Volcanic hazard; mice (Gough)<\/td><\/tr>\n<tr><td><a href=\"#surtsey\">Surtsey<\/a><\/td><td>Rift volcano<\/td><td>1963–67<\/td><td>1.3 km²<\/td><td>≈150 m<\/td><td>0<\/td><td>Marine erosion<\/td><\/tr>\n<tr><td><a href=\"#socotra\">Socotra<\/a><\/td><td>Continental fragment<\/td><td>Rocks to ≈0.8 Ga; isolated ≈30 Ma<\/td><td>3,625 km²<\/td><td>≈1,500 m<\/td><td>≈50–60k<\/td><td>Overgrazing; conflict; development<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Look down the columns. Area spans four orders of magnitude, age eight. Inhabited islands are not necessarily the largest or most fertile; access (a landing, a harbour, a lagoon) and history explain more.<\/p>\n"],["Testing the theories","\n<ul>\n<li><strong>Equilibrium theory<\/strong> fits Surtsey's colonisation curve in outline, but seabird nutrient subsidies moved the equilibrium. Henderson's rats show that people redraw the extinction curve.<\/li>\n<li><strong>The General Dynamic Model<\/strong> describes Surtsey's shrinking and the Pitcairn chain's stages (young high island, raised atoll, low atolls). It does not apply to continental fragments like Socotra and the Falklands, whose biotas reflect continental inheritance and long isolation.<\/li>\n<li><strong>The island rule<\/strong> holds for gecko body size on Socotra but not for head shape. 'Island effects' are trait-specific.<\/li>\n<li><strong>Darwin's subsidence theory<\/strong> explains Funafuti, Oeno and Ducie. Henderson shows the reverse, local uplift through flexure.<\/li>\n<li><strong>Nissology's ethical claim<\/strong> applies to every case. In each, the most-cited knowledge was produced by visiting scientists. Where were islanders authors, collaborators, or decision-makers?<\/li>\n<\/ul>\n"],["Capstone: write a nissological profile","\n<p>Choose an island not studied in this course; a lesser-known one is best. Write a profile of 3,000–4,000 words that includes:<\/p>\n<ol>\n<li><strong>Physical geography<\/strong>: origin, rock types, landforms and present processes, with at least one map or terrain figure you have made or adapted (attributed).<\/li>\n<li><strong>Ecology<\/strong>: biogeographic character, key species, and how theory explains them.<\/li>\n<li><strong>History<\/strong>: human arrival(s), colonial and political history.<\/li>\n<li><strong>Culture and governance<\/strong>: language, livelihoods, land tenure, and who decides.<\/li>\n<li><strong>A critical review of at least four peer-reviewed papers<\/strong> about the island, using the five-question method from Unit 0.<\/li>\n<li><strong>Reflexive statement<\/strong>: whose terms does your own profile use?<\/li>\n<\/ol>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Criterion<\/th><th>Weight<\/th><th>Excellent work…<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Physical explanation<\/td><td>25%<\/td><td>explains processes and mechanisms, with correct terms and quantities<\/td><\/tr>\n<tr><td>Use of research literature<\/td><td>25%<\/td><td>evaluates claims, methods and uncertainty instead of only reporting findings<\/td><\/tr>\n<tr><td>Integration<\/td><td>20%<\/td><td>links physical, ecological and human dimensions causally<\/td><\/tr>\n<tr><td>Critical and ethical reflection<\/td><td>15%<\/td><td>engages seriously with 'on whose terms'<\/td><\/tr>\n<tr><td>Communication<\/td><td>15%<\/td><td>clear structure, accurate citation, well-made figures<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Suggestions: Kiritimati (Kiribati), Aldabra (Seychelles), Nauru, St Kilda, South Georgia, Rapa Iti, Bouvet Island, Annobón, Lord Howe Island, Jan Mayen, or an island in the Indonesian or Philippine archipelagos, which Grydehøj notes are under-studied.<\/p>\n"],["Further reading","\n<ul class=\"refs\">\n<li>Darwin, C. (1842). <em>The Structure and Distribution of Coral Reefs<\/em>. Smith, Elder &amp; Co. (free at Darwin Online).<\/li>\n<li>Hau'ofa, E. (1994). Our sea of islands. <em>The Contemporary Pacific<\/em> 6(1): 147–161.<\/li>\n<li>MacArthur, R. H. &amp; Wilson, E. O. (1967). <em>The Theory of Island Biogeography<\/em>. Princeton University Press.<\/li>\n<li>McCall, G. (1994). Nissology: a proposal for consideration. <em>Journal of the Pacific Society<\/em> 17: 1–14.<\/li>\n<li>Royal Society (1904). <em>The Atoll of Funafuti: Borings into a Coral Reef and the Results<\/em>. London.<\/li>\n<li>Weisler, M. I. (1994). The settlement of marginal Polynesia: new evidence from Henderson Island. <em>Journal of Field Archaeology<\/em> 21: 83–102.<\/li>\n<li>Whittaker, R. J., Triantis, K. A. &amp; Ladle, R. J. (2008). A general dynamic theory of oceanic island biogeography. <em>Journal of Biogeography<\/em> 35: 977–994.<\/li>\n<li>Van Damme, K. &amp; Banfield, L. (2011). Past and present human impacts on the biodiversity of Socotra Island (Yemen). <em>Zoology in the Middle East<\/em>. doi:10.1080/09397140.2011.10648899<\/li>\n<li>Comment by Clark, Newton &amp; Wakefield on Hamley et al. (2021), and the authors' reply, <em>Science Advances<\/em> 8 (2022), eabo6765.<\/li>\n<\/ul>\n"]],"readings":[]}];
const READINGS = [{"id":"baldacchino2008","unit":"foundations","hosted":true,"file":"baldacchino2008.pdf","authors":"Godfrey Baldacchino","year":2008,"title":"Studying islands: on whose terms? Some epistemological and methodological challenges to the pursuit of island studies","journal":"Island Studies Journal 3(1): 37–56","doi":"10.24043/001c.81189","url":"https://islandstudiesjournal.org/article/81189","license":"CC BY 4.0","minutes":60,"why":"The foundational critique of nissology from inside the field. Baldacchino takes McCall's slogan, 'the study of islands on their own terms', and asks who gets to set those terms. Every case study in this course involves outsiders (scientists, colonial governments, conservation agencies) studying small island places, so this paper is the lens for all of them.","before":["Grant McCall coined 'nissology' in 1994 (from Greek nisos, island). Island Studies Journal was founded in 2006 at the University of Prince Edward Island, and Baldacchino was its founding editor.","This is an essay, not an empirical paper. Read it for its argument structure: a diagnosis (islands are described by outsiders), a complication (insider/outsider is a false binary), and five dilemmas.","The style is 'semi-autobiographical': Baldacchino is Maltese, trained in Malta, and was working on Prince Edward Island. Notice how he uses his own position as evidence."],"route":[["pp. 37–38","Introduction: separate the two halves of McCall's definition. What does 'of' islands imply that 'by', 'with' or 'for' would not?"],["pp. 38–40","'A Debilitating Discourse' and 'Small and Tropical as Topical': write down the three statistical claims (land area, population, latitude) and what stereotype each one corrects."],["pp. 40–43","'Making Sense' and 'Fleshing Out the Theories': skim the social theory (Merton, political economy, Foucault). Focus on the list of ways islanders respond to being represented."],["pp. 43–48","'Five Dilemmas': the core. Summarise each dilemma in a sentence and pair it with one island from this course."],["pp. 48–49","Conclusion: note the claim that external and internal understandings are both needed. Is it a compromise or a resolution?"]],"terms":[["Nissology","McCall's term for the study of islands 'on their own terms'."],["Hybridity","Mixed, in-between identities (diaspora, settlers, returnees) that make the islander/outsider split unworkable."],["SIDS","Small Island Developing States, the UN category. Baldacchino questions the word 'small'."],["Autonomy without sovereignty","Self-government inside a larger state (for example a UK Overseas Territory) instead of independence."]],"questions":["Pick one case-study island. Who has produced most of the published knowledge about it, and from where? Use the author affiliations of this course's readings as data.","Is 'on their own terms' a methodological rule (how to collect data) or an ethical one (who benefits)? Can it be both?","Baldacchino says islanders may protect information because of 'community surveillance'. How might that affect a census, an interview study, or a genetic study such as the Tristan da Cunha Y-chromosome work?"]},{"id":"grydehoj2017","unit":"foundations","hosted":true,"file":"grydehoj2017.pdf","authors":"Adam Grydehøj","year":2017,"title":"A future of island studies","journal":"Island Studies Journal 12(1): 3–16","doi":"10.24043/isj.1","url":"https://islandstudiesjournal.org/article/82000","license":"CC BY 4.0","minutes":45,"why":"Written nine years after Baldacchino by his successor as editor, this is the field reviewing itself. It adds two warnings that matter for a geography course: island sustainability research can idealise islands, and 'on their own terms' can hide colonial relationships.","before":["An editorial essay written from Nuuk, Greenland. Grydehøj's own fieldwork is on cold-water and urban islands.","Read it as a map of the field: who founded it (ISISA 1992, ISJ 2006), which concepts it has produced (archipelago, aquapelago, island cities), and what it neglects."],"route":[["pp. 3–5","'Beginnings' and 'Grounding' sections: list the institutional milestones and the locus/focus distinction."],["pp. 5–7","Theory sections: note the 'aquapelago' and urban island studies. Which of our islands would an aquapelago framing suit best? (Hint: Tristan's lobster economy, Pitcairn's marine reserve.)"],["pp. 8–9","'The importance of expanding the reach': the Manhattan/Nauru example is the methodological core. It is an argument about sampling."],["pp. 9–11","'Darker sides': coloniality, then sustainability and the 'eco-colonial gaze'. Connect to Tuvalu and Henderson Island."],["pp. 11–12","The Greenland coda: an island rising through glacio-isostatic rebound while it urbanises."]],"terms":[["Locus vs focus","Ronström: islands as the place where research happens vs islands as the object of research."],["Islandness","Baldacchino's 'intervening variable' that contours social and physical events without determining them."],["Aquapelago","Hayward: an assemblage of land and sea spaces joined by human activity."],["Eco-colonial gaze","Farbotko: concern for islands as symbols of climate change rather than for islanders' actual needs."]],"questions":["Grydehøj warns against generalising from a 'woefully incomplete sample'. Design a sample of 10 islands that would let you make a defensible claim about 'islands in general'. What variables would you stratify on?","Is the Pitcairn Islands Marine Reserve an example of the eco-colonial gaze or of islanders setting the agenda? Use the fact that the community 'unanimously agreed' to it (Friedlander et al. 2014, p. 9) in your answer."]},{"id":"kench2018","unit":"funafuti","hosted":true,"file":"kench2018.pdf","authors":"Paul S. Kench, Murray R. Ford & Susan D. Owen","year":2018,"title":"Patterns of island change and persistence offer alternate adaptation pathways for atoll nations","journal":"Nature Communications 9: 605","doi":"10.1038/s41467-018-02954-1","url":"https://www.nature.com/articles/s41467-018-02954-1","license":"CC BY 4.0","minutes":75,"why":"The most-cited empirical challenge to the idea that atoll islands are simply drowning. It measures every one of Tuvalu's 101 reef islands over four decades. Treat it as a model of how physical geography (sediment, waves, storms) feeds into political geography (migration, land tenure, sovereignty).","before":["Reef islands (motu) are piles of loose carbonate sediment (coral rubble, sand, foraminifera) sitting on a reef flat. They are not solid rock, and waves can reshape them.","Tuvalu has 9 atolls and reef platforms and about 10,600 people, half of them on Fogafale (also spelled Fongafale), the capital islet of Funafuti.","Remote sensing is the method: historical aerial photographs (1971, 1984) compared with satellite images (2004–2015)."],"route":[["p. 1","Abstract: write the headline numbers on a card (101 islands, +73.5 ha net, 74% grew, 27% shrank, ~3.9 mm/yr sea-level rise)."],["p. 2","Introduction: identify the paradigm being challenged and the policy 'binary' the authors want to escape."],["pp. 2–3 + Table 1","Results: read Table 1 row by row and find Funafuti. Then do the data exercise in this unit: check whether the atoll totals add up to the headline."],["p. 6 (Methods)","Read the Methods before the Discussion. Understand the vegetation-edge proxy and the error budget."],["pp. 3–5","Discussion: follow the chain of inference (no uniform response → other processes dominate → sediment supply must be positive)."],["pp. 5–6","Adaptation argument: decide which claims follow from the data and which are policy proposals."]],"terms":[["Reef platform island","An island covering most of a small, isolated reef platform (e.g. Nanumaga, Vaitupu), as opposed to atoll rim islands."],["DSAS","Digital Shoreline Analysis System: casts transects from a baseline and measures shoreline movement along each."],["NSM / EPR","Net shoreline movement (m) and end-point rate (m per decade) between two dates."],["Lagoonward migration","Islands rolling back across the reef flat as the ocean shore erodes and the lagoon shore accretes."]],"questions":["Explain, in a labelled sketch, how an island can grow in area while its ocean shoreline erodes.","What would have to be true about reef carbonate production for Kench's 'persistence' scenario to continue under RCP8.5? Name two threats to that condition (hint: coral bleaching, ocean acidification).","The paper ends with a political suggestion: internal migration to larger islands. Using Baldacchino (2008), say who should decide this and on what terms."]},{"id":"masselink2020","unit":"funafuti","hosted":false,"authors":"Gerd Masselink, Eddie Beetham & Paul Kench","year":2020,"title":"Coral reef islands can accrete vertically in response to sea level rise","journal":"Science Advances 6(24): eaay3656","doi":"10.1126/sciadv.aay3656","url":"https://www.science.org/doi/10.1126/sciadv.aay3656","free_url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7286686/","license":"CC BY-NC 4.0 (read at the publisher or PubMed Central)","minutes":50,"why":"Kench et al. (2018) describe what islands did; this paper models the mechanism. It uses a numerical morphodynamic model, checked against laboratory flume experiments, to show how wave overtopping can raise a gravel island's crest as the sea rises.","before":["Morphodynamics is the feedback between landform shape and the water movement that reshapes it.","'Freeboard' means the height of the island crest above the water level. If it stays positive, the island is not permanently submerged.","The model island is a gravel reef island. Sand islands, which Kench found more prone to shrinking, are a different case."],"route":[["Abstract & Introduction","Identify the assumption being challenged: that reef islands are 'geologically inert'."],["Methods","Note how the numerical model was validated against flume (laboratory wave tank) experiments. Validation is the weak point of any model, so ask what it covers."],["Results","Follow the scenario: about 0.75 m of sea-level rise, with the crest rising by just under 0.7 m while the island migrates lagoonward."],["Discussion","List the factors the authors say must be added before judging any real island: freshwater, sediment supply and future wave climate."]],"terms":[["Overwash / overtopping","Waves running over the island crest and depositing sediment on top."],["Freeboard","Elevation of the island crest above sea level."]],"summary":["Numerical modelling, validated against laboratory experiments, shows gravel reef islands can build upward as sea level rises, keeping positive freeboard while migrating towards the lagoon.","The mechanism is wave overtopping, which moves sediment from the beachface onto the island surface.","The authors warn that this physical adjustment does not guarantee habitability: the usable land area shrinks and moves, and freshwater, sediment supply and wave regime must also be assessed."],"questions":["If an island survives by washing over itself, what happens to the houses, gardens and roads on it? Is physical persistence the same as human persistence?","Why would a seawall stop the mechanism this paper describes? Connect to the 'maladaptive' practices mentioned by Kench et al. (2018, p. 2)."]},{"id":"friedlander2014","unit":"pitcairn","hosted":true,"file":"friedlander2014.pdf","authors":"Alan M. Friedlander, Jennifer E. Caselle, Enric Ballesteros, Eric K. Brown, Alan Turchik & Enric Sala","year":2014,"title":"The Real Bounty: marine biodiversity in the Pitcairn Islands","journal":"PLOS ONE 9(6): e100142","doi":"10.1371/journal.pone.0100142","url":"https://doi.org/10.1371/journal.pone.0100142","license":"CC BY 4.0","minutes":70,"why":"The baseline survey behind one of the world's largest marine reserves. It compares the four Pitcairn islands, a young high island, a raised atoll and two low atolls, so it lets you see how island type and age shape reef ecosystems.","before":["The four islands: Pitcairn (volcanic, inhabited), Henderson (raised coral atoll, World Heritage Site), Oeno and Ducie (low atolls).","Survey design: SCUBA transects at 10 and 20 m at 97 sites, plus baited deep-sea 'drop-cams' to 1,585 m.","National Geographic's Pristine Seas programme ran the 2012 expedition, and the paper ends with a conservation recommendation. Keep that context in mind as you read."],"route":[["pp. 1–2","Introduction and Study sites: build a fact table for the four islands (type, area, age, distance from Pitcairn)."],["pp. 2–4","Methods: understand line-point intercept (benthos) and belt transects (fish). Skim the statistics."],["pp. 4–6","Results: algae → corals → urchins → fish → deep habitats. For each, note which island is the outlier and why."],["pp. 6–9","Discussion: three explanations recur (isolation and fishing, runoff from the high island, geological age). Mark each one."]],"terms":[["Raised atoll (makatea)","An atoll lifted above sea level, so that the old lagoon becomes a plateau and the reef becomes a cliff."],["Trophic structure","How fish biomass divides among top predators, carnivores, herbivores and planktivores. Predator-heavy reefs indicate low fishing pressure."],["CCA","Crustose coralline algae: pink, rock-like red algae that cement reefs."],["Mesophotic reef","Light-dependent reef in the 'twilight zone', roughly 30–150 m deep."]],"questions":["Using the four islands, construct a table of island type, age and coral species richness. Which single extra island would best test whether age (not isolation or type) drives richness?","Why do high volcanic islands often have less coral than nearby atolls? Give a physical and a human reason."]},{"id":"amos2016","unit":"pitcairn","hosted":true,"file":"amos2016.pdf","authors":"W. Amos, H. J. Nichols, T. Churchyard & M. de L. Brooke","year":2016,"title":"Rat eradication comes within a whisker! A case study of a failed project from the South Pacific","journal":"Royal Society Open Science 3: 160110","doi":"10.1098/rsos.160110","url":"https://doi.org/10.1098/rsos.160110","license":"CC BY 4.0 (author's accepted manuscript)","minutes":55,"why":"Henderson Island's endemic birds are threatened by Pacific rats that Polynesian voyagers introduced. In 2011 one of the largest eradications ever attempted came close to succeeding. This paper uses population genetics to estimate how close, which makes it a good example of turning a conservation failure into evidence.","before":["The PDF is the authors' accepted manuscript, with line numbers. The published version has the same content and is CC BY.","Effective population size (Ne) is the size of an idealised population that would lose genetic diversity at the observed rate. It is usually smaller than the census count (N).","Microsatellites are fast-mutating DNA repeats. Sudden population crashes change their allele frequencies in a way that can be measured."],"route":[["pp. 2–4","Abstract and Introduction: the three explanations for failure (re-invasion, poison resistance, survivors). The paper tests each one."],["pp. 4–6","Study site and sampling: note where rats were caught and where they were not."],["pp. 7–8","Bottleneck estimation: skim the simulation. The idea is that a smaller bottleneck produces larger allele-frequency shifts."],["pp. 9–13","Results and Discussion: write one line on each test and its verdict."],["pp. 13–14","Implications: natural food availability in the tropics."]],"terms":[["Brodifacoum","A second-generation anticoagulant rodenticide."],["Ne","Effective population size."],["LD50","The dose that kills 50% of test animals."]],"questions":["Build a decision tree for a planner considering a second attempt, using this paper's three findings.","Who should decide whether to try again: the Pitcairn Island Council, the UK government, the RSPB, or UNESCO? Use Grydehøj's 'custodian-steward-environmentalist' critique."]},{"id":"lavers2017","unit":"pitcairn","hosted":false,"authors":"Jennifer L. Lavers & Alexander L. Bond","year":2017,"title":"Exceptional and rapid accumulation of anthropogenic debris on one of the world's most remote and pristine islands","journal":"Proceedings of the National Academy of Sciences 114(23): 6052–6055","doi":"10.1073/pnas.1619818114","url":"https://www.pnas.org/doi/10.1073/pnas.1619818114","free_url":"https://alexanderbond.org/wp-content/uploads/2017/12/2017-lavers-bond-henderson-beach-debris.pdf","license":"Free to read (PNAS open access option); not redistributable here","minutes":40,"why":"Henderson is uninhabited and among the most remote places on Earth, yet in 2015 its beaches held the highest density of plastic debris then recorded anywhere. Its position in the South Pacific Gyre turns remoteness into exposure.","before":["The South Pacific Gyre is a large anticlockwise current system that collects floating debris.","Fieldwork took place on North and East Beaches, May–August 2015."],"route":[["Abstract","Note the three headline numbers: up to 671.6 items/m², 37.7 million items, 17.6 tonnes."],["Study site & methods","Identify the three sampling designs (surface transects, buried quadrats to 10 cm, a daily accumulation transect) and what each measures."],["Results","68% of debris was buried, and new items arrived at up to 26.8 items per metre of beach per day. Ask why the totals are minimum estimates."],["Discussion","Sources: fishing gear and identifiable items from Asia and South America. Link to the gyre."]],"terms":[["Microplastic","Plastic fragment smaller than 5 mm."],["Accumulation rate","New items arriving per unit beach length per day."]],"summary":["The surface density reached 671.6 items/m² (mean 239.4), the highest reported anywhere at the time; about 68% of debris lay buried in the top 10 cm of sand.","The authors estimate a minimum of 37.7 million items weighing 17.6 tonnes on Henderson's beaches, with up to 26.8 new items arriving per metre each day.","They argue that remote islands may act as sinks for the world's growing volume of waste. The estimate excludes deeper burial, items under 2 mm, cliffs and rocky shores, so the real total is larger."],"questions":["Henderson is a UNESCO site for its 'ecological intactness'. Does this paper change what 'pristine' should mean?","How would you design a follow-up survey to separate a real increase in debris from differences in method?"]},{"id":"hamley2021","unit":"falklands","hosted":true,"file":"hamley2021.pdf","authors":"Kit M. Hamley, Jacquelyn L. Gill, Kathryn E. Krasinski, Dulcinea V. Groff, Brenda L. Hall, Daniel H. Sandweiss, John R. Southon, Paul Brickle & Thomas V. Lowell","year":2021,"title":"Evidence of prehistoric human activity in the Falkland Islands","journal":"Science Advances 7(44): eabh3803","doi":"10.1126/sciadv.abh3803","url":"https://www.science.org/doi/10.1126/sciadv.abh3803","license":"CC BY-NC 4.0","minutes":70,"why":"The standard account says the Falklands had no people before Europeans and that the warrah, the islands' only native land mammal, arrived on its own. This paper combines charcoal records, bone piles, a stone point and isotopes to reopen both questions. It is a good example of multi-proxy reasoning, and it was publicly contested afterwards.","before":["The warrah (Dusicyon australis) was extinct by 1876. Darwin saw it in 1833 and predicted its extinction.","Charcoal accumulation rate (CHAR) is the number of charcoal particles deposited per cm² per year in peat. Sudden jumps often mark human arrival on islands.","'BP' means years before 1950. 550 BP is about 1400 CE.","After publication, Clark, Newton & Wakefield published a comment in Science Advances disputing the interpretation, and the authors replied in 2022 (Sci. Adv. 8, eabo6765). Read the original first, then the exchange."],"route":[["p. 1","Introduction: write down the two competing hypotheses for the warrah's arrival and the evidence each needs."],["pp. 2–3","Results: list each line of evidence (bone piles, charcoal at three sites, warrah dates, isotopes). Note which site is the control."],["pp. 3–5","Discussion: for each line of evidence, mark the alternative explanation the authors rule out and how."],["p. 5","Yaghan (Yámana) analogy: ethnography is used as a model. Ask whether that is legitimate."],["pp. 6–7","Methods: radiocarbon calibration and marine reservoir correction. These are what make the dates comparable."]],"terms":[["CHAR","Charcoal accumulation rate."],["MNI","Minimum number of individuals represented in a bone assemblage."],["Marine reservoir effect","Marine organisms date older than they are because ocean carbon is 'old', so a correction is applied."],["δ15N","Nitrogen isotope ratio. It rises by about 3–5‰ with each step up the food chain."]],"questions":["Rank the four lines of evidence from strongest to weakest and justify the ranking. Which one would you most like to see replicated at another site?","Read the comment and reply (2022). State in two sentences what the disagreement is actually about: the dates, the isotopes, or the inference?","If people did visit the Falklands around 1300 CE, does that change the political arguments over sovereignty? Why or why not?"]},{"id":"austin2013","unit":"falklands","hosted":false,"authors":"Jeremy J. Austin, Julien Soubrier, Francisco J. Prevosti, Luciano Prates, Valentina Trejo, Francisco Mena & Alan Cooper","year":2013,"title":"The origins of the enigmatic Falkland Islands wolf","journal":"Nature Communications 4: 1552","doi":"10.1038/ncomms2570","url":"https://www.nature.com/articles/ncomms2570","license":"Subscription / publisher terms; not redistributable here","minutes":45,"why":"Ancient DNA from the warrah's extinct mainland relative, Dusicyon avus, changed the warrah's origin date from hundreds of thousands of years to the last glaciation, which made a glacial-age crossing (or human transport) plausible.","before":["Earlier work dated the warrah lineage's split from the maned wolf to about 6.7 Ma and its island colonisation to about 330 ka, without sampling D. avus.","Ancient DNA here is about 1,069 base pairs of mitochondrial DNA from six D. avus specimens, 7,800–3,000 years old."],"route":[["Introduction","Note Darwin's comment about 'so large a quadruped' and the list of hypotheses: human transport, ice rafting, land bridge."],["Results","Only six fixed differences separate warrah and D. avus. The divergence is estimated at about 16 ka (95% range 8–31 ka)."],["Discussion","Submarine terraces on the Argentine shelf suggest a narrow, shallow strait at glacial lowstand, possibly frozen over."]],"terms":[["TMRCA","Time to the most recent common ancestor."],["Internal calibration","Dating a molecular clock with the radiocarbon ages of the sampled specimens themselves rather than with distant fossils."]],"summary":["Mitochondrial DNA from six D. avus subfossils shows it is the warrah's closest relative; the lineages separated about 16 ka (8–31 ka), during the last glacial phase.","Using deep fossil calibrations reproduces the older, misleading dates, which illustrates the 'time dependency' of molecular rates.","The authors favour colonisation across a narrow, shallow glacial strait, possibly frozen. Hamley et al. (2021) later argue that human transport needs reconsidering."],"questions":["Why did leaving out D. avus produce a much older date? Explain with a simple tree diagram.","Compare how Austin (2013) and Hamley (2021) each handle the lack of other native land mammals in the Falklands."]},{"id":"wilson2008","unit":"falklands","hosted":false,"authors":"Peter Wilson, Michael J. Bentley, Christoph Schnabel, Rod Clark & Sheng Xu","year":2008,"title":"Stone run (block stream) formation in the Falkland Islands over several cold stages, deduced from cosmogenic isotope (10Be and 26Al) surface exposure dating","journal":"Journal of Quaternary Science 23(5): 461–473","doi":"10.1002/jqs.1156","url":"https://doi.org/10.1002/jqs.1156","license":"Subscription; check your library or the Durham Research Online record","minutes":50,"why":"Stone runs are the Falklands' most striking landform: rivers of quartzite boulders filling valley floors, first described by Darwin. This paper applies cosmogenic exposure dating to the question of when they formed.","before":["Cosmogenic nuclide dating: cosmic rays produce rare isotopes (10Be, 26Al) in quartz at the ground surface, so their concentration measures how long a boulder has been exposed.","Hypotheses for stone runs include periglacial mass movement (solifluction, frost action) during cold stages and the exhumation of boulders produced by older, deeper weathering.","Compare with an OSL (luminescence) study of fine sediment beneath two stone runs (Hansom et al. 2008, Geomorphology), which suggests activity continued until about 16 ka."],"route":[["Introduction","List the competing models of stone-run origin and the timescales each predicts."],["Methods","Note why two nuclides (10Be and 26Al) are used: their ratio can reveal burial or a complex exposure history."],["Results & Discussion","Read the exposure ages against the climate record. Do they cluster in one cold stage, or spread across several?"]],"terms":[["Stone run / block stream","A sheet or stream of angular boulders with little or no fine matrix at the surface."],["Periglacial","Cold, non-glacial conditions dominated by freeze–thaw and frozen ground."]],"summary":["Apparent 10Be exposure ages span roughly 42,000 to 731,000 years, and some are minimum ages. The authors conclude that valley-axis stone runs may be up to 700–800 kyr old, have simple exposure histories, and are composite landforms built over several cold stages.","They find no evidence tying the runs to the Last Glacial Maximum, and suggest larger runs may be older than smaller ones.","The question is not settled: later work (for example an EGU 2026 abstract presenting new dual-isotope ages) still frames the Tertiary versus Quaternary origin as open."],"questions":["Why might a boulder's exposure age differ from the age of the landform it sits in?","Describe what a stone run looks like on the ground and explain why such features are rare at sea level today."]},{"id":"geissler2020","unit":"tristan","hosted":true,"file":"geissler2020.pdf","authors":"Wolfram H. Geissler, Paul Wintersteller, Marcia Maia, Tonke Strack, Janina Kammann, Graeme Eagles, Marion Jegen, Antje Schloemer & Wilfried Jokat","year":2020,"title":"Seafloor evidence for pre-shield volcanism above the Tristan da Cunha mantle plume","journal":"Nature Communications 11: 4543","doi":"10.1038/s41467-020-18361-4","url":"https://www.nature.com/articles/s41467-020-18361-4","license":"CC BY 4.0","minutes":70,"why":"Most of an oceanic island is underwater. Multibeam sonar mapping around Tristan reveals 430 volcanic cones, two previously unknown seamounts, and a likely source for the 2004 submarine eruption. The paper shows where the next islands of the Tristan hotspot may be forming.","before":["Hotspot track: the Tristan plume produced the Walvis Ridge, which runs back to the Etendeka–Paraná flood basalts (about 132 Ma) in Namibia and Brazil.","Multibeam echosounder (MBES) measures depth across a swath; backscatter measures how strongly the seabed reflects sound (hard lava reflects strongly, soft sediment weakly).","Hawaiian volcano stages: pre-shield (Loihi), shield, post-shield, and rejuvenated."],"route":[["pp. 1–2","Abstract and Introduction: write Tristan's vital statistics and the hotspot context."],["p. 3","Central area: the shape of the edifice. Compare with the 3D model's bathymetry."],["pp. 6–7","New seamounts and the westward cones. This is the discovery section."],["p. 7","Mid-Atlantic Ridge and the oceanic core complex. Skim unless you want the tectonics."],["pp. 9–11","Sedimentation-rate dating of lava fields, then the Discussion comparing Tristan with Hawai'i, Pitcairn and Easter Island."]],"terms":[["Seamount","An underwater volcano rising at least about 1 km above the seafloor."],["Monogenetic cone","A small volcano built in a single eruptive episode."],["Oceanic core complex","A dome of deep crust and mantle exposed by a long-lived detachment fault where magma supply is low."],["Sector collapse","Catastrophic landslide of part of a volcano's flank."]],"questions":["Sketch a cross-section from the Mid-Atlantic Ridge to Tristan showing the island, Isolde Seamount, the westward cone fields and the fracture zone. Label ages where the paper gives them.","The settlement (Edinburgh of the Seven Seas) is on the only sizeable coastal plain, beside the 1961 vent. Using this paper, what volcanic hazards should a long-term plan for the island consider?"]},{"id":"caravaggi2019","unit":"tristan","hosted":false,"authors":"Anthony Caravaggi, Richard J. Cuthbert, Peter G. Ryan, John Cooper & Alexander L. Bond","year":2019,"title":"The impacts of introduced House Mice on the breeding success of nesting seabirds on Gough Island","journal":"Ibis 161(3): 648–661","doi":"10.1111/ibi.12664","url":"https://doi.org/10.1111/ibi.12664","license":"CC BY 4.0 (read at the publisher)","minutes":45,"why":"Gough Island, part of the Tristan da Cunha group, shows how a small introduced mammal can drive seabird decline on a predator-free island. House mice there eat live albatross chicks.","before":["Gough lies about 400 km SSE of Tristan. It is a World Heritage Site and home to almost all Tristan albatrosses.","Breeding success is the proportion of nests that fledge a chick. The study compares Gough with predator-free analogue sites."],"route":[["Introduction","Why island seabirds lack defences against mammalian predators."],["Methods","Nest monitoring of 10 focal species."],["Results","Breeding success and estimated annual losses."],["Discussion","The case for eradication. Compare with the Henderson rat attempt (Unit 2)."]],"terms":[["Naïve prey","Prey that evolved without a given predator type and so lacks behavioural defences."]],"summary":["Breeding success on Gough was poor compared with predator-free analogues; the authors estimate about 1.74 million eggs or chicks lost to mice each year.","Seven of the ten focal species had high chick mortality. Three endemic or near-endemic species (MacGillivray's prion, Atlantic petrel, Tristan albatross) face extinction without mouse removal.","An eradication was attempted in 2021, but mice were detected again later that year, so Henderson (2011) and Gough (2021) both illustrate how hard large-island eradications are."],"questions":["Compare Gough (mice) and Henderson (rats): island size, climate, terrain and the predator's biology. Which factors best predict eradication difficulty?"]},{"id":"magnusson2014","unit":"surtsey","hosted":true,"file":"magnusson2014.pdf","authors":"B. Magnússon, S. H. Magnússon, E. Ólafsson & B. D. Sigurdsson","year":2014,"title":"Plant colonization, succession and ecosystem development on Surtsey with reference to neighbouring islands","journal":"Biogeosciences 11: 5521–5537","doi":"10.5194/bg-11-5521-2014","url":"https://doi.org/10.5194/bg-11-5521-2014","license":"CC BY 3.0","minutes":75,"why":"Surtsey is the closest thing to a controlled experiment in island ecology: a new island, strictly protected and monitored since its first plant appeared in 1965. This paper summarises 50 years of colonisation and shows that seabirds, not distance or area alone, drove ecosystem development.","before":["Primary succession is ecosystem development on new ground with no soil, unlike secondary succession after a disturbance.","Chronosequence: older neighbouring islands (Elliðaey, Heimaey, 5,000–6,000 years old) stand in for Surtsey's future.","Dispersal modes: sea (floating seeds), wind (light seeds and spores) and birds (seeds in guts or stuck to feathers)."],"route":[["pp. 5521–5522","Introduction and Study area: Surtsey's origin, erosion (2.7 → 1.3 km²) and the seabird context."],["pp. 5523–5525","Methods: the long-term search record and the permanent plots (from 1990). Note how plot locations were chosen."],["p. 5525 + Fig. 3","Colonisation curve: the four phases. Copy the dates into the timeline exercise."],["pp. 5526–5528","Gull colony versus barren plots: cover, richness, biomass, soil carbon, invertebrates."],["pp. 5528–5531","Discussion: dispersal routes, nutrient subsidies and the forecast."]],"terms":[["Nutrient subsidy","Transfer of nutrients from one ecosystem to another, here from sea to land by seabirds."],["TWINSPAN / DCA","Classification and ordination methods that group plots by species composition."],["Palagonite tuff","Basaltic tephra altered and cemented by hot water into rock that resists erosion."]],"questions":["Draw Surtsey's colonisation timeline with the four phases and annotate each with the dominant dispersal mode.","Forecast: the authors expect a 'lush, species-poor grassland'. What would have to change for the forecast to fail?","Is Surtsey 'pristine'? Consider seabirds, the 2017 drilling camp (Jackson et al.) and the ban on visitors."]},{"id":"jackson2019","unit":"surtsey","hosted":true,"file":"jackson2019.pdf","authors":"Marie D. Jackson, Magnús T. Gudmundsson, Tobias B. Weisenberger et al.","year":2019,"title":"SUSTAIN drilling at Surtsey volcano, Iceland, tracks hydrothermal and microbiological interactions in basalt 50 years after eruption","journal":"Scientific Drilling 25: 35–46","doi":"10.5194/sd-25-35-2019","url":"https://doi.org/10.5194/sd-25-35-2019","license":"CC BY 4.0","minutes":55,"why":"Magnússon et al. (2014) describe Surtsey's surface; this paper looks inside it. Drilling beside a 1979 borehole gives a 38-year time-lapse of how a new volcanic island turns to rock, cools, and is colonised by microbes.","before":["This is a project report (Scientific Drilling publishes 'progress reports'), so expect description of operations as well as science.","Lapilli tuff is a rock made of cemented volcanic fragments 2–64 mm across.","A diatreme is a deep, carrot-shaped volcanic vent filled with broken rock, cut by explosive magma–water interaction."],"route":[["pp. 35–36","Abstract and Introduction: Surtsey's eruption numbers and the 1979 borehole."],["p. 37","Three science questions. Copy them down, since the whole project is organised around them."],["pp. 38–39","Protecting the reserve: how do you drill in a strictly protected island?"],["pp. 40–42","Drilling results: temperatures and the diatreme. Compare 1980 with 2017."]],"terms":[["Surtseyan eruption","Explosive eruption driven by contact between magma and water in shallow seas."],["Hydrothermal system","Circulation of heated water through rock."],["Authigenic minerals","Minerals formed in place, such as zeolites and tobermorite cements."]],"questions":["Explain, with a labelled section drawing, why the parts of Surtsey above sea level have eroded fastest while the tuff cones persist.","Surtsey's rift setting and Tristan's hotspot setting both produce basaltic islands. List three ways their life histories differ."]},{"id":"garciaporta2016","unit":"socotra","hosted":true,"file":"garciaporta2016.pdf","authors":"Joan Garcia-Porta, Jiří Šmíd, Daniel Sol, Mauro Fasola & Salvador Carranza","year":2016,"title":"Testing the island effect on phenotypic diversification: insights from the Hemidactylus geckos of the Socotra Archipelago","journal":"Scientific Reports 6: 23729","doi":"10.1038/srep23729","url":"https://doi.org/10.1038/srep23729","license":"CC BY 4.0","minutes":65,"why":"A direct test of a famous island idea, that islands produce unusual body forms (giants and dwarfs). It uses every species of a gecko group across Africa, Arabia and Socotra, and finds the 'island effect' is real for body size but not for head shape.","before":["The 'island rule': on islands, small animals tend to evolve larger and large animals smaller.","Phylogenetic comparative methods analyse traits on a family tree so that related species are not treated as independent data points.","Disparity is how spread out a group's trait values are. Rate is how fast traits change along the tree's branches."],"route":[["pp. 1–2","Introduction: the hypothesis and the three questions. Write them down."],["p. 2","Socotra's geography and the three independent colonisations."],["pp. 3–6","Results: compare means (no difference) with disparities and rates (a difference for size)."],["pp. 7–9","Discussion: mechanisms (predators, competitors, island area)."]],"terms":[["SVL","Snout–vent length, the standard body-size measure for lizards."],["Brownian motion / OU","Models of trait evolution: random drift versus pull towards an optimum."],["Niche pre-emption","A competitor already occupying a niche prevents others from evolving into it."]],"questions":["Explain the difference between 'island species differ on average' and 'island species are more disparate'. Why does it matter for testing the island rule?","Abd al Kuri (133 km²) shows faster size evolution than Socotra (3,625 km²). Propose two hypotheses linked to island area."]},{"id":"madera2020","unit":"socotra","hosted":true,"file":"madera2020.pdf","authors":"Petr Maděra, Alan Forrest, Pavel Hanáček and 14 others","year":2020,"title":"What we know and what we do not know about dragon trees?","journal":"Forests 11(2): 236","doi":"10.3390/f11020236","url":"https://doi.org/10.3390/f11020236","license":"CC BY 4.0","minutes":60,"why":"Socotra's dragon's blood tree (Dracaena cinnabari) is the island's emblem, a living cultural object, and a population in slow decline. This 35-page review covers all dragon trees. Read the Socotra sections (marked in the reading route) for biogeography, fog ecology, the resin trade and conservation.","before":["The authors use the spelling 'Soqotra'; this course uses 'Socotra'. They are the same place.","A review paper synthesises others' studies, so check which claims rest on which cited study.","One co-author, Miranda Morris, is a leading scholar of the Soqotri language and ethnobotany."],"route":[["pp. 1–3","Abstract and Introduction: what counts as a 'dragon tree'."],["pp. 4–6","Distribution: find the Socotra paragraph (Firmihin, Diksam, Haggeher)."],["pp. 10–14","Resin and history: the Periplus, Pliny and Wellsted's 19th-century account of harvesting and land division."],["pp. 15–20","Ecology and population structure: the over-mature age structure."],["pp. 20–24","Threats and conservation: grazing and fencing."]],"terms":[["Horizontal precipitation","Water captured from fog and cloud by leaves and branches."],["Over-mature population","A population with many old individuals and too few young ones to replace them."]],"questions":["Construct a simple population argument: if few trees younger than 100 years survive and the mature trees are 200–500 years old, what happens over the next two centuries without intervention?","Fencing protects seedlings but excludes goats from pasture. Using Baldacchino (2008), set out the case for a solution designed with Soqotri herders."]}];

const DEMS = {"funafuti":{"id":"funafuti","w":497,"h":512,"mpp":119.7,"z":11,"bbox":[-8.8,-8.25,178.88,179.42],"min":-5337,"max":5,"name":"Funafuti Atoll"},"pitcairn":{"id":"pitcairn","w":512,"h":508,"mpp":39.38,"z":13,"bbox":[-25.16,-24.98,-130.2,-130.0],"min":-3293,"max":321,"name":"Pitcairn Island"},"henderson":{"id":"henderson","w":512,"h":509,"mpp":41.58,"z":13,"bbox":[-24.46,-24.27,-128.43,-128.22],"min":-3609,"max":34,"name":"Henderson Island"},"falklands":{"id":"falklands","w":512,"h":331,"mpp":538.28,"z":8,"bbox":[-52.55,-50.95,-61.55,-57.55],"min":-430,"max":586,"name":"Falkland Islands"},"tristan":{"id":"tristan","w":512,"h":505,"mpp":48.52,"z":12,"bbox":[-37.22,-37.0,-12.43,-12.15],"min":-2958,"max":2016,"name":"Tristan da Cunha"},"surtsey":{"id":"surtsey","w":512,"h":419,"mpp":58.48,"z":11,"bbox":[63.26,63.48,-20.72,-20.12],"min":-225,"max":181,"name":"Surtsey and Vestmannaeyjar"},"socotra":{"id":"socotra","w":512,"h":233,"mpp":286.6,"z":10,"bbox":[12.15,12.75,53.25,54.6],"min":-2884,"max":1441,"name":"Socotra"}};
const VIDX = {"foundations-0":{"dur":81.67,"paras":["What is nissology? The word was proposed in 1994 by the anthropologist Grant McCall, from the Greek nisos, meaning island.","McCall defined it as the study of islands on their own terms. It grew out of a Pacific critique: aid agencies and mainland scholars tended to describe islands by what they lack: size, resources and connection.","In the same year the Tongan writer Epeli Hau'ofa answered that story of smallness. He described Oceania not as scattered specks in an empty ocean, but as a sea of islands, connected by voyaging and kinship.","Island studies then became a field with its own institutions: an international association in 1992, Island Studies Journal in 2006, and the island cultures journal Shima in 2007.","Two ideas run through this whole course. First, islandness: isolation and boundedness shape what happens on islands, but they do not determine it. Always ask what the mechanism is. Second, whose terms? Most research on small islands is written by outsiders. That does not make it wrong, but it shapes which questions get asked.","Your two foundation readings, by Godfrey Baldacchino and Adam Grydehøj, are essays about exactly these problems. Read them first: they are the lens for every case study that follows."],"points":["<b>Islandness<\/b> contours and conditions events; it does not determine them","<b>Whose terms?<\/b> Most island research is produced by outsiders","Baldacchino (2008) Studying islands: on whose terms?","Grydehøj (2017) A future of island studies"]},"foundations-3":{"dur":82.695,"paras":["Why do some islands have many species and others very few? This is the question of island biogeography.","Robert MacArthur and E. O. Wilson treated an island's species number as a balance of two rates. Immigration falls as the island fills up, because fewer new species are left to arrive. Extinction rises, because more species compete for the same space. Where the two curves cross, the number of species is stable. Watch what happens as the island gets bigger: extinction falls, and the equilibrium moves to the right.","The theory explains a pattern seen on islands everywhere: the species–area relationship. On islands, a tenfold increase in area roughly doubles the number of species.","The General Dynamic Model adds time. A volcanic island is born, grows in area and height, then erodes and sinks. Species richness and the number of unique, endemic species rise and then fall over the island's life. Surtsey, already shrinking only decades after its birth, is the fastest-moving test of this model.","A third idea, the island rule, says that on islands small animals tend to evolve larger, and large animals smaller. Treat all three theories as models to test, not laws. Real islands get extra nutrients from seabirds, receive species carried by people, and sometimes were once joined to land."],"points":["<b>×10 area<\/b> ≈ ×2 species","<b>Equilibrium theory<\/b>: immigration vs extinction","<b>General Dynamic Model<\/b>: island age matters","<b>Island rule<\/b>: giants and dwarfs","Real islands break the rules, so find out why"]},"foundations-4":{"dur":54.462,"paras":["Most of this course is spent reading research papers. Here is a method for reading them critically.","Ask five questions of every paper. What is the single main claim? What method was used, where, when, and on what sample? Which figure or table carries the evidence, and does its arithmetic hold? What uncertainty is reported, and what is missing? And finally, scope: to which islands and conditions does the result really apply?","The annotated papers use a colour code that matches these questions. Yellow marks the authors' argument. Green marks evidence. Blue marks method. Purple marks concepts to learn. Red means read critically. Orange links the paper to other units.","Some papers cannot be shared openly, so for those you get a companion guide and a link to the publisher. After every video there is a short quiz. Get into the habit of answering before you look at the feedback."],"points":["<b>Claim<\/b>: the one main assertion","<b>Method<\/b>: what, where, when, sample","<b>Evidence<\/b>: which figure? does it add up?","<b>Uncertainty<\/b>: error, limits, alternatives","<b>Scope<\/b>: where does the finding stop?","Watch the video, then take the check quiz","Read the paper with the annotations open","Use the 3D model to measure, not just to look"]},"funafuti-2":{"dur":71.178,"paras":["Are Tuvalu's islands shrinking? In 2018 Paul Kench and colleagues measured every one of the country's one hundred and one islands to find out.","They compared aerial photographs from 1971 with satellite images from 2014. Over those four decades local sea level rose about fifteen centimetres, twice the global average. Yet Tuvalu's total land area grew by seventy-three and a half hectares, nearly three percent.","Here is the change for each atoll, from the paper's Table 1. Eight of the nine atolls gained land. Funafuti gained about four percent.","Now be a careful reader. Add up the hectare changes in Table 1 and you get about sixty-three hectares, not seventy-three and a half. And one percentage in the table looks wrong. Small inconsistencies like these are common. Your task is to work out whether they change the conclusion. Here they do not: most islands grew under every reading.","The authors conclude that islands are dynamic features, not static landforms waiting to drown. But they are careful: under high-emission scenarios, the sea will rise much faster than in their study period, and the past may not be a guide."],"points":["<b>+73.5 ha<\/b> net land gained","<b>74%<\/b> of islands grew","<b>~0.15 m<\/b> local sea-level rise","Table 1 rows sum to <b>≈ +63.1 ha<\/b>","The headline says <b>+73.5 ha<\/b>","Nanumea's % column: −0.004 vs <b>−0.37%<\/b>","Does it change the conclusion?"]},"falklands-0":{"dur":63.458,"paras":["The Falkland Islands: twelve thousand square kilometres of ancient rock in the cold South Atlantic.","They lie about five hundred kilometres east of southern South America.","Unlike every other island in this course, the Falklands are built of continental crust. The oldest rocks, in the far south of West Falkland, are about a billion years old. Above them lie hard quartzites and sandstones, and then sediments left by an ice age about three hundred million years ago.","That sequence closely matches the rocks of South Africa. The leading explanation is that the Falklands block lay off south-eastern Africa within the supercontinent Gondwana, broke away as Gondwana split, and rotated about one hundred and eighty degrees on its way to its present position. Evidence from the magnetism of ancient rock supports a large rotation, though the details are still debated.","Today the islands sit on a shallow continental plateau. Watch what happens when we lower the sea by one hundred and twenty-five metres, roughly the level of the last ice age."],"points":["Basement about <b>1,000 million years<\/b> old","Hard <b>quartzites<\/b> and sandstones","Glacial deposits from a <b>late Palaeozoic ice age<\/b>"]},"falklands-3":{"dur":71.575,"paras":["When did people first reach the Falklands? The standard answer is 1690. New research suggests otherwise.","In 2021 Kit Hamley and colleagues reported three lines of evidence from New Island: a sudden hundred-fold rise in charcoal in the peat, piles of sea lion and penguin bones dated to about thirteen hundred CE, and a stone spear point made of local quartzite. They suggest visits by seafaring people from Tierra del Fuego, centuries before Europeans.","Fire matters here. Even today, fire is visible from orbit. In this photograph taken from the International Space Station, smoke streams from fires on East Falkland. The researchers argue that lightning-caused fires are rare in these islands, so a sudden surge of charcoal points to people.","The colonial history is tangled. France and Britain both founded settlements in the 1760s. Spain bought out the French. After Spain left in 1811, Buenos Aires claimed the islands. Britain took control in 1833, the root of today's dispute. In 1982 Argentina invaded, and the war that followed cost about nine hundred lives."],"points":["Charcoal rises <b>100-fold<\/b> around 1400 CE","Bone piles dated <b>1275–1420 CE<\/b>","A <b>quartzite<\/b> projectile point"]},"tristan-0":{"dur":66.185,"paras":["Tristan da Cunha: the most remote inhabited island on Earth.","It lies in the South Atlantic, about two thousand four hundred kilometres from St Helena and two thousand eight hundred from Cape Town.","About one hundred and thirty-two million years ago, as Africa and South America began to separate, a plume of hot mantle erupted vast floods of lava in what are now Namibia and Brazil. As the Atlantic widened, the same plume built the Walvis Ridge. Tristan is the youngest island at the end of that track.","The island is a single great cone rising to about two thousand and sixty metres. But most of the volcano is underwater: its flanks reach three thousand six hundred metres deep within twenty-five kilometres of the coast. Watch the sea drain away to reveal it.","In 2020, Wolfram Geissler and colleagues published sonar maps of the seafloor around the islands. They found four hundred and thirty young volcanic cones, and two previously unknown seamounts. One of them, Isolde Seamount, was probably the source of a submarine eruption in 2004 that washed pumice onto Tristan's beaches."],"points":[]},"tristan-3":{"dur":61.752,"paras":["From a passing navigator to a community of seven families.","The Portuguese navigator Tristão da Cunha sighted the island in 1506. Britain garrisoned it in 1816, officially to stop it being used to rescue Napoleon from St Helena. When the soldiers left, Corporal William Glass and his family stayed. Women from St Helena joined in 1827, and two Italian sailors shipwrecked in 1892 added the names Repetto and Lavarello.","On the tenth of October 1961, after weeks of earthquakes, a vent opened beside the village and built a dome of lava. The whole population was evacuated, first to Nightingale Island, then to England.","They lived near Southampton for two years. Although they were offered permanent resettlement, most voted to go home, and returned in 1963. Journalists turned the return into a parable about modern life. The islanders' own accounts stress their land, their boats and their independence."],"points":["1961: whole population <b>evacuated<\/b>","Two years near <b>Southampton<\/b>","1963: most chose to <b>return<\/b>"]},"synthesis-0":{"dur":35.455,"paras":["Six islands, side by side.","We have travelled from the central Pacific to the South Atlantic, the North Atlantic and the Arabian Sea.","Their areas span four orders of magnitude, from Surtsey's one point three square kilometres to the Falklands' twelve thousand. Their ages span eight orders: from rocks a billion years old to land made in the 1960s.","Notice that the inhabited islands are not necessarily the largest or most fertile. Access matters more: a landing place, a harbour, a lagoon. And so does history."],"points":["Inhabited ≠ largest or most fertile","<b>Access<\/b>: landing, harbour, lagoon","<b>History<\/b>: who arrived, who stayed"]},"synthesis-1":{"dur":40.671,"paras":["How well did our theories do?","Equilibrium theory fits Surtsey in outline, but seabirds moved the equilibrium. The General Dynamic Model describes Surtsey's shrinking and the Pitcairn chain, but not continental fragments. The island rule holds for gecko body size on Socotra, but not head shape. And Darwin's subsidence explains Funafuti, while Henderson shows the reverse: uplift.","And the ethical question applies everywhere. In every case, the most-cited knowledge was produced by visiting scientists. Ask where islanders were: as authors, collaborators, or decision-makers."],"points":[]},"synthesis-2":{"dur":42.563,"paras":["Your capstone: a profile of an island of your own choosing.","Choose an island not covered in this course, ideally a lesser-known one. In three to four thousand words, explain its physical geography with a map or terrain figure, its ecology through theory, its history, and its culture and governance. Review at least four peer-reviewed papers using the five-question method. And finish with a reflection: whose terms does your own profile use?","Need ideas? Try Kiritimati, Aldabra, Nauru, St Kilda, South Georgia, Rapa Iti, Lord Howe Island, Jan Mayen, or one of the many islands of Indonesia and the Philippines, which island studies has largely overlooked."],"points":["<b>Physical geography<\/b>, with a figure","<b>Ecology<\/b>, explained with theory","<b>History<\/b> and <b>governance<\/b>","Critical review of <b>4+ papers<\/b>","A <b>reflexive<\/b> statement"]}};
const CHECKS = {"foundations-0":[{"kind":"single","q":"What does McCall's phrase 'on their own terms' ask researchers to do?","o":["Study only islands smaller than 1,000 km²","Centre islands and islanders rather than mainland frames","Avoid using maps","Publish only in island languages"],"a":1,"e":"Nissology re-centres the island: its own histories and perspectives, not the mainland's view of what islands lack."},{"kind":"single","q":"Which writer reframed Oceania as 'a sea of islands'?","o":["Godfrey Baldacchino","Charles Darwin","Epeli Hau'ofa","E. O. Wilson"],"a":2,"e":"Hau'ofa (1994) answered the 'smallness' story with a picture of connection through voyaging and kinship."}],"foundations-1":[{"kind":"single","q":"Which island in this course is a continental fragment?","o":["Tristan da Cunha","Surtsey","Socotra","Funafuti"],"a":2,"e":"Socotra is a piece of the Arabian margin isolated as the Gulf of Aden opened. The Falklands are the other example."},{"kind":"num","q":"About how far below today's level did the sea stand at the Last Glacial Maximum? (metres)","a":125,"tol":15,"unit":"m","e":"Roughly 120–130 m lower, about 21,000 years ago, which is enough to join shelf islands to continents."}],"foundations-2":[{"kind":"order","q":"Put Darwin's sequence in order, starting with a young volcanic island.","o":["Fringing reef","Barrier reef","Atoll","Guyot (drowned)"],"e":"As the volcano subsides, the reef grows upward: fringing → barrier → atoll. If reef growth fails to keep up, the top drowns as a guyot."},{"kind":"single","q":"What finally confirmed Darwin's theory?","o":["The Funafuti boring of 1896–98","Boreholes on Enewetak in 1952 that reached basalt","Satellite images of atolls","Fossils on Henderson Island"],"a":1,"e":"Funafuti reached about 340 m of reef rock but no basalt; Enewetak hit basalt beneath more than 1,200 m of limestone."}],"foundations-3":[{"kind":"single","q":"In MacArthur–Wilson theory, what happens to the equilibrium species number on a larger island (same distance)?","o":["It falls, because immigration falls","It rises, because extinction falls","It stays the same","It rises, because immigration rises"],"a":1,"e":"Larger islands hold larger populations, which lowers the extinction curve and moves the crossing point to the right."},{"kind":"num","q":"If z = 0.3, by roughly what factor does species number change when area increases tenfold? (S = cA^z)","a":2.0,"tol":0.15,"unit":"×","e":"10^0.3 ≈ 2.0, so a tenfold increase in area roughly doubles the species count."}],"foundations-4":[{"kind":"single","q":"Which annotation colour marks a limitation or inconsistency?","o":["Yellow","Green","Blue","Red"],"a":3,"e":"Red means 'read critically': limits, inconsistencies and alternative readings."},{"kind":"multi","q":"Which belong to the five reading questions? (choose all that apply)","o":["Claim","Method","Author's nationality","Uncertainty","Scope"],"a":[0,1,3,4],"e":"Claim, method, evidence, uncertainty and scope. Where an author comes from is a 'whose terms' question, not one of the five."}],"funafuti-0":[{"kind":"single","q":"What are Funafuti's islets (motu) mainly made of?","o":["Basalt lava","Granite","Loose reef-derived sand and gravel","Volcanic ash"],"a":2,"e":"Reef islands are heaps of carbonate sediment made by corals, algae, shells and foraminifera, piled up by waves."},{"kind":"single","q":"Roughly how old are most reef islands compared with the reef beneath them?","o":["Much older","About the same age","Much younger: a few thousand years","They formed in the 20th century"],"a":2,"e":"The reef cap is very old, but most motu formed within the last few thousand years."}],"funafuti-1":[{"kind":"num","q":"Ghyben–Herzberg: if the water table is 0.5 m above sea level, about how deep does the freshwater lens reach below sea level? (m)","a":20,"tol":2,"unit":"m","e":"About 40 × the head: 40 × 0.5 = 20 m."},{"kind":"single","q":"What did Cyclone Bebe (1972) do to Funafuti's eastern islands over the follo   // ---------------------------------------------------------------- hotspot conveyor
  function hotspot() {
    const W = 720, H = 300, sea = 120;
    let s = arrowDefs("ah1");
    s += `<rect x="0" y="${sea}" width="${W}" height="80" class="d-sea"/>`;
    s += `<rect x="0" y="200" width="${W}" height="40" class="d-ocrust"/>`;
    s += `<rect x="0" y="240" width="${W}" height="60" class="d-mantle"/>`;
    s += `<path d="M560,300 C548,270 572,255 560,200" class="d-plume"/>`;
    s += `<path d="M520,300 Q560,250 600,300 Z" class="d-plumefill"/>`;
    // islands from young (right) to old (left)
    const isl = [
      { x: 560, top: 70, w: 70, name: "active volcano", sub: "high, growing", reef: 0 },
      { x: 430, top: 98, w: 64, name: "eroding high island", sub: "fringing reef", reef: 1 },
      { x: 300, top: 116, w: 58, name: "atoll", sub: "reef cap at sea level", reef: 2 },
      { x: 160, top: 150, w: 54, name: "guyot", sub: "drowned, flat-topped", reef: 3 },
    ];
    isl.forEach((d) => {
      s += `<path d="M${d.x - d.w},200 L${d.x - 10},${d.top} L${d.x + 10},${d.top} L${d.x + d.w},200 Z" class="d-basalt"/>`;
      if (d.reef === 1) s += `<path d="M${d.x - 26},${sea + 2} l4,-6 l8,0 l2,6 Z M${d.x + 16},${sea + 2} l2,-6 l8,0 l4,6 Z" class="d-reef"/>`;
      if (d.reef === 2) s += `<path d="M${d.x - 22},${d.top + 2} L${d.x - 22},${sea - 2} L${d.x + 22},${sea - 2} L${d.x + 22},${d.top + 2} Z" class="d-reef"/>`;
      if (d.reef === 3) s += `<path d="M${d.x - 20},${d.top} L${d.x - 20},${d.top - 12} L${d.x + 20},${d.top - 12} L${d.x + 20},${d.top} Z" class="d-reef"/>`;
      s += T(d.x, 30, d.name, "d-t d-b");
      s += T(d.x, 46, d.sub, "d-t d-m");

    s += T(690, 70, "younger", "d-t d-m", "end");
    return fig(s, W, H, "Hotspot island chain from active volcano to guyot", "The oceanic island conveyor. A volcano grows over a mantle plume, then the plate carries it away. As it cools and sinks, reefs grow on its flanks; if reef growth keeps pace it becomes an atoll, and if not, a drowned guyot. Schematic.");

  // ---------------------------------------------------------------- Darwin
  function darwin() {
    const W = 720, H = 240, sea = 110;
    const stages = [
      { x: 120, peak: 34, name: "1 · Fringing reef", sub: "reef attached to shore" },
      { x: 360, peak: 74, name: "2 · Barrier reef", sub: "lagoon between reef and peak" },
      { x: 600, peak: 130, name: "3 · Atoll", sub: "peak gone below the sea" },
    ];
    let s = arrowDefs("ah2");
    s += `<rect x="0" y="${sea}" width="${W}" height="${H - sea}" class="d-sea"/>`;
    stages.forEach((st, i) => {
      const x = st.x, p = st.peak;
      s += `<path d="M${x - 100},${H} L${x - 12},${p} L${x + 12},${p} L${x + 100},${H} Z" class="d-basalt"/>`;
      const rw = 8 + i * 10;
      const inner = 30 + i * 18;
      s += `<path d="M${x - inner - rw},${H - 20} L${x - inner - rw},${sea - 3} L${x - inner},${sea - 3} L${x - inner},${H - 20} Z" class="d-reef"/>`;
      s += `<path d="M${x + inner},${H - 20} L${x + inner},${sea - 3} L${x + inner + rw},${sea - 3} L${x + inner + rw},${H - 20} Z" class="d-reef"/>`;
      if (i > 0) s += `<path d="M${x + 92},${sea + 30} v34" class="d-arrow" marker-end="url(#ah2)"/>`;
      s += T(x, 26, st.name, "d-t d-b");
      s += T(x, 42, st.sub, "d-t d-m");
    });
    s += `<line x1="0" y1="${sea}" x2="${W}" y2="${sea}" class="d-sealine"/>`;
    s += T(W - 8, sea - 6, "sea level", "d-t d-s", "end");
    s += T(452, sea + 52, "subsidence", "d-t d-s", "start");
    return fig(s, W, H, "Darwin's subsidence sequence: fringing reef, barrier reef, atoll", "Darwin's theory (1842). As a volcanic island subsides, its fringing reef grows upward and becomes a barrier reef and finally an atoll. Confirmed when boreholes on Enewetak (1952) reached basalt beneath more than 1,200 m of reef limestone.");
  }

  // ---------------------------------------------------------------- GDM
  function gdm() {
    const W = 640, H = 264, x0 = 60, x1 = 610, y0 = 210, y1 = 70;
    let s = `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" class="d-axis"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" class="d-axis"/>`;
    const curve = (amp, skew) => {
      let d = "";
      for (let i = 0; i <= 60; i++) {
        const t = i / 60;
        const v = amp * Math.pow(t, skew) * Math.pow(1 - t, 1.6) / (Math.pow(skew / (skew + 1.6), skew) * Math.pow(1.6 / (skew + 1.6), 1.6));
        d += (i ? "L" : "M") + (x0 + t * (x1 - x0)).toFixed(1) + "," + (y0 - v * (y0 - y1)).toFixed(1);
      }
      return d;
    };
    s += `<path d="${curve(0.92, 0.9)}" class="d-curve1"/>`;
    s += `<path d="${curve(0.6, 1.3)}" class="d-curve2"/>`;
    s += `<path d="${curve(0.75, 0.7)}" class="d-curve3"/>`;
    const lg = [["area & elevation", "c1"], ["species richness", "c3"], ["single-island endemics", "c2"]];
    lg.forEach(([t, c], i) => { s += `<rect x="440" y="${18 + i * 18}" width="14" height="4" class="${c}"/>` + T(460, 24 + i * 18, t, `d-t d-s ${c}`, "start"); });
    s += T((x0 + x1) / 2, 254, "island age  (birth → growth → erosion and subsidence)", "d-t d-s");
    s += `<text x="22" y="${(y0 + y1) / 2}" class="d-t d-s" text-anchor="middle" transform="rotate(-90 22 ${(y0 + y1) / 2})">relative value</text>`;
    s += T(86, 228, "Surtsey", "d-t d-m", "start");
    s += T(250, 228, "Tristan", "d-t d-m", "start");
    s += T(500, 228, "Henderson / atolls", "d-t d-m", "start");
    return fig(s, W, H, "General Dynamic Model curves over island age", "The General Dynamic Model (Whittaker et al. 2008), schematic. Island area and relief rise then fall over a volcanic island's life; richness and endemism follow with a lag, peaking in mid-life. Course islands are placed by stage, not to scale.");
  }

  // ---------------------------------------------------------------- flexure
  function flexure() {
    const W = 720, H = 260, sea = 100;
    let s = arrowDefs("ah3");
    s += `<rect x="0" y="${sea}" width="${W}" height="${H - sea}" class="d-sea"/>`;
    // flexed plate: depressed under Pitcairn (x=170), bulge near Henderson (x=520)
    let top = "", bot = "";
    for (let i = 0; i <= 72; i++) {
      const x = i * 10;
      const r = Math.abs(x - 170) / 120;
      const w = 38 * Math.exp(-r) * Math.cos(r);  // flexural profile
      top += (i ? "L" : "M") + x + "," + (180 + w).toFixed(1);
      bot = "L" + x + "," + (225 + w).toFixed(1) + bot;
    }
    s += `<path d="${top}${bot.replace(/^L/, "L")} Z" class="d-ocrust"/>`;
    s += `<path d="M90,${190} L160,52 L180,52 L250,${190} Z" class="d-basalt"/>`;
    s += `<path d="M170,40 v40" class="d-arrow" marker-end="url(#ah3)"/>`;
    // Henderson raised atoll on the bulge
    s += `<path d="M470,180 L500,96 L560,96 L590,180 Z" class="d-basalt"/>`;
    s += `<path d="M495,104 L500,78 L560,78 L565,104 Z" class="d-reef"/>`;
    s += `<path d="M530,72 v-22" class="d-arrow" marker-end="url(#ah3)"/>`;
    s += `<line x1="0" y1="${sea}" x2="${W}" y2="${sea}" class="d-sealine"/>`;
    s += T(170, 24, "Pitcairn: new volcanic load", "d-t d-b");
    s += T(530, 24, "Henderson: former atoll lifted ≈30 m", "d-t d-b");
    s += T(530, 40, "on the flexural bulge, ≈200 km away", "d-t d-m");
    s += T(170, 248, "plate bends down (moat)", "d-t d-s");
    s += T(400, 248, "plate bends up (bulge)", "d-t d-s");
    s += T(W - 6, sea - 4, "sea level", "d-t d-s", "end");
    return fig(s, W, H, "Lithospheric flexure: Pitcairn's load raises Henderson", "Why Henderson is a raised atoll. Pitcairn's growth (0.8–0.9 Ma) loaded the oceanic plate, which bent down beneath it and up at a bulge some distance away, lifting the old atoll of Henderson about 30 m. Schematic; vertical scale greatly exaggerated.");
  }

  // ---------------------------------------------------------------- Surtseyan
  function surtseyan() {
    const W = 720, H = 270, sea = 140;
    let s = arrowDefs("ah5");
    const panel = (x, name, sub) => T(x, 24, name, "d-t d-b") + T(x, 40, sub, "d-t d-m");
    s += `<rect x="0" y="${sea}" width="${W}" height="${H - sea}" class="d-sea"/>`;
    s += `<rect x="0" y="240" width="${W}" height="30" class="d-seafloor"/>`;
    // panel 1 explosive
    s += `<path d="M40,240 L100,${sea - 12} L140,${sea - 12} L200,240 Z" class="d-tephra"/>`;
    s += `<path d="M120,240 L120,${sea - 10}" class="d-magma"/>`;
    s += `<path d="M120,${sea - 14} L100,60 M120,${sea - 14} L128,52 M120,${sea - 14} L146,64" class="d-jet"/>`;
    s += `<path d="M86,${sea + 20} q16,-14 26,0" class="d-arrow" marker-end="url(#ah5)"/>`;
    s += panel(120, "1 · Explosive", "seawater floods the vent");
    s += T(60, sea + 46, "water in", "d-t d-s", "start");
    // panel 2 effusive
    s += `<path d="M280,240 L340,${sea - 30} L390,${sea - 30} L450,240 Z" class="d-tephra"/>`;
    s += `<path d="M380,${sea - 26} L470,${sea - 6} L510,${sea + 4} L470,${sea + 4} L400,${sea - 8} Z" class="d-lava"/>`;
    s += `<path d="M365,240 L365,${sea - 28}" class="d-magma"/>`;
    s += panel(390, "2 · Effusive", "cone seals vent; lava armours island");
    // panel 3 lithified & eroding
    s += `<path d="M560,240 L600,${sea - 26} L640,${sea - 26} L680,240 Z" class="d-tuff"/>`;
    s += `<path d="M640,${sea - 22} L690,${sea - 6} L700,${sea + 4} L660,${sea + 4} Z" class="d-lava"/>`;
    s += `<path d="M560,${sea - 2} q-12,-8 -24,0" class="d-arrow" marker-end="url(#ah5)"/>`;
    s += panel(620, "3 · Lithified, eroding", "tephra → palagonite tuff");
    s += T(540, sea + 22, "waves", "d-t d-s", "end");
    s += `<line x1="0" y1="${sea}" x2="${W}" y2="${sea}" class="d-sealine"/>`;

    return fig(s, W, H, "Three stages of a Surtseyan island", "How Surtsey survived. Explosive magma–water interaction builds a loose tephra cone (1963–64). Once the cone excludes seawater, lava flows armour the island (1964–67). Hydrothermal alteration then cements the tephra into palagonite tuff, which resists the waves. Schematic.");
  }

  // ---------------------------------------------------------------- Surtsey timeline (real dates)
  function surtsey_timeline() {
    const W = 720, H = 200, x0 = 40, x1 = 690, t0 = 1963, t1 = 2015;
    const X = (y) => x0 + (y - t0) / (t1 - t0) * (x1 - x0);
    let s = `<line x1="${x0}" y1="120" x2="${x1}" y2="120" class="d-axis"/>`;
    for (let y = 1965; y <= 2015; y += 10) s += `<line x1="${X(y)}" y1="120" x2="${X(y)}" y2="126" class="d-axis"/>` + T(X(y), 142, y, "d-t d-s");
    const phases = [
      [1965, 1975, "sea-dispersed pioneers", "p1"],
      [1975, 1986, "stagnation", "p2"],
      [1986, 2008, "gull-driven second wave", "p3"],
      [2008, 2013, "net loss", "p4"],
    ];
    phases.forEach(([a, b, n, c], i) => {
      s += `<rect x="${X(a)}" y="92" width="${X(b) - X(a) - 2}" height="22" rx="2" class="d-${c}"/>`;
      s += T((X(a) + X(b)) / 2, 84 - (i % 2) * 16, n, "d-t d-s");
    });
    const ev = [[1963, "eruption begins"], [1965, "first plant (sea rocket)"], [1985, "gulls start breeding"], [1996, "first land bird breeds"], [2007, "peak: 64 species"], [2013, "59 present, 39 viable"]];
    ev.forEach(([y, t], i) => {
      s += `<circle cx="${X(y)}" cy="120" r="4" class="d-dot"/>`;
      s += `<line x1="${X(y)}" y1="126" x2="${X(y)}" y2="${154 + (i % 2) * 16}" class="d-leader"/>`;
      s += T(X(y), 166 + (i % 2) * 16, t, "d-t d-m", i === 0 ? "start" : i === ev.length - 1 ? "end" : "middle");
    });
    s += T(x0, 30, "Vascular plant colonisation of Surtsey, by phase", "d-t d-b", "start");
    return fig(s, W, H, "Timeline of Surtsey's plant colonisation phases 1963–2013", "Phases and milestones from Magnússon et al. (2014). The dates are from the paper; for the species curve itself see their Figure 3.");
  }

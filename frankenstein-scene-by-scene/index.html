<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frankenstein, scene by scene</title>
<!--
  FRANKENSTEIN, SCENE BY SCENE — twelve isometric dollhouse dioramas on one risograph sheet.
  Mary Shelley, Frankenstein; or, The Modern Prometheus (Project Gutenberg #84).
  Everything (paper, dots, people, ice, lightning) is drawn in code. Canvas 2D, no assets.
  The Creature is in every scene, sometimes plainly, sometimes hidden.

  Scenes, in book order (the chapters are untitled, so each card carries a short heading):
   1  Letter IV     To Mrs. Saville, England — Walton's ship in the ice; the sledge far off, the Creature on it
   2  Chapter II    The Blasted Oak          — young Victor at the door as lightning takes the oak; a pale shape on the Jura
   3  Chapter III   Ingolstadt               — Waldman lectures; the Creature is the anatomical plate on the wall
   4  Chapter IV    The Workshop of Filthy Creation — the garret, the body under the sheet
   5  Chapter V     A Dreary Night of November — the Creature wakes on the table; Victor recoils
   6  Chapter VII   The Storm                — the figure climbing Salève in the lightning
   7  Chapter X     The Mer de Glace         — the Creature crosses the glacier to plead; another on a far peak
   8  Chapter XII   The Cottagers            — the De Laceys at home; the Creature sees himself in the pool
   9  Chapter XV    De Lacey                 — at the blind man's knees as Felix, Safie and Agatha return
  10  Chapter XX    The Orkneys              — Victor destroys the companion; the dæmon at the casement
  11  Chapter XXIII Evian                    — the bridal chamber; the Creature at the window
  12  Chapter XXIV  The Ice Raft             — Victor's coffin in Walton's cabin; the Creature borne away on the ice
-->

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#211f1c;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#card{--a:#224e9e;position:fixed;left:28px;bottom:28px;width:min(390px,calc(100vw - 40px));box-sizing:border-box;padding:28px 30px 26px;background:#f4ecd8;color:#2b2622;
 font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;box-shadow:0 14px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(18px);
 transition:opacity .8s ease,transform .8s ease;pointer-events:none;overflow:hidden}
#card.on{opacity:1;transform:none}
#card canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
#card .cn{font-variant:small-caps;letter-spacing:.2em;font-size:15px;color:var(--a);position:relative}
#card .ct{font-size:34px;line-height:1.08;margin:.18em 0 .42em;position:relative;font-weight:normal}
#card .rule{position:relative;height:1px;background:var(--a);width:62%;margin:0 0 1.05em}
#card .rule i{position:absolute;left:50%;top:-4px;width:7px;height:7px;background:var(--a);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 0 4px #f4ecd8}
#card .q{font-style:italic;font-size:16.5px;line-height:1.5;margin:0;position:relative;hyphens:auto}
#card .dc{float:left;font-style:normal;font-size:3.35em;line-height:.82;padding:.07em .09em 0 0;color:var(--a)}
#card .hq{font-size:.42em;vertical-align:top;margin-right:.04em}
@media (max-width:560px){#card{left:12px;right:12px;bottom:12px;width:auto;padding:18px 20px}#card .ct{font-size:26px}#card .q{font-size:14.5px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="card"><canvas id="grain"></canvas><div class="cn" id="cn"></div><h1 class="ct" id="ct"></h1><div class="rule"><i></i></div><p class="q" id="cq"></p></div>
<script>
'use strict';
/* ===================================================================== basics */
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');
const MOB=matchMedia('(pointer:coarse)').matches||Math.min(screen.width,screen.height)<700;
const S=MOB?720:1152;          // tile size (px) — one scene per tile
const SK=S/1024;               // scale constant
const U=S/15;                  // iso unit
const OX=S/2,OY=S*.405;        // iso origin
const N=8;                     // slab size in units
const PITCH=4.3*SK;            // halftone cell size
const LW=2.1*SK;               // outline width
const TAU=Math.PI*2;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* seeded randomness */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hsh(xi,yi,s),b=hsh(xi+1,yi,s),c=hsh(xi,yi+1,s),d=hsh(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}

/* ===================================================================== inks */
// [Blue, Red, Yellow, Black] — every colour on the sheet is a mix of these four spot inks.
const INK=[
 {n:'Glacier Blue',rgb:[28,74,160],ang:15},
 {n:'Galvanic Red',rgb:[228,62,46],ang:75},
 {n:'Candle Yellow',rgb:[251,193,28],ang:0},
 {n:'Lamp Black',rgb:[40,34,36],ang:45}];
INK.forEach((k,i)=>k.i=i);
const PAPER=[245,237,217],PAPERC='rgb(245,237,217)';
const MIS=[[1.3,-.7],[-1.0,.9],[.6,1.2],[0,0]].map(p=>p.map(v=>v*SK));
const Bk=0,Rd=1,Yl=2,Kk=3;
const dk=(c,a)=>c.map((v,j)=>j==3?Math.min(1,v+a):Math.min(1,v*(1+a*.7)));
const NONE=[0,0,0,0];
const WOOD=[0,.26,.48,.1],WOODD=[0,.38,.5,.38],DECK=[0,.16,.36,.05],STONE=[.1,.04,.16,.2],BRICK=[0,.62,.34,.16],
 SEA=[.6,0,.1,0],SEAD=[.88,0,.14,.25],SKY=[.13,0,.05,0],NIGHT=[.88,.12,0,.55],IRON=[.3,0,0,.85],SAIL=[0,.03,.18,.03],
 ROPE=[0,.3,.6,.22],GOLD=[0,.18,1,0],BONE=[0,0,.1,.02],HULL=[.25,.05,0,.82],PANEL=[.08,.32,.3,.5],WALL=[0,.1,.25,.06];

/* ===================================================================== geometry */
const P=(x,y,z=0)=>[OX+(x-y)*U*.8660254,OY+(x+y)*U*.5-z*U];
function wob(pts,D,closed){
 const out=[],n=pts.length,st=D.step,A=D.amp,sd=D.seed;
 const m=closed?n:n-1;
 for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.ceil(L/st));
  for(let j=0;j<k;j++){const t=j/k,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
   out.push(A?[x+(vn(x*.05,y*.05,sd)-.5)*A*2,y+(vn(x*.05+71,y*.05,sd)-.5)*A*2]:[x,y])}}
 if(!closed){const x=pts[n-1][0],y=pts[n-1][1];out.push(A?[x+(vn(x*.05,y*.05,sd)-.5)*A*2,y+(vn(x*.05+71,y*.05,sd)-.5)*A*2]:[x,y])}
 return out}
function path(q){const p=new Path2D();p.moveTo(q[0][0],q[0][1]);for(let i=1;i<q.length;i++)p.lineTo(q[i][0],q[i][1]);p.closePath();return p}
// tapered, wobbling stroke → filled polygon
function strokePoly(D,pts,w,closed){
 let q=wob(pts,D,closed);if(closed)q.push(q[0]);
 const n=q.length;if(n<2)return null;
 const cum=[0];for(let i=1;i<n;i++)cum.push(cum[i-1]+Math.hypot(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]));
 const tot=cum[n-1]||1,L=[],Rr=[];
 for(let i=0;i<n;i++){const a=q[Math.max(0,i-1)],b=q[Math.min(n-1,i+1)];let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
  const t=cum[i]/tot;const tp=closed?.75+.35*vn(cum[i]*.04,3,D.seed):Math.pow(Math.min(1,t/.18,(1-t)/.18),.6)*.8+.2;
  const hw=w*.5*tp*(.8+.4*vn(cum[i]*.07,9,D.seed));
  L.push([q[i][0]-ty*hw,q[i][1]+tx*hw]);Rr.push([q[i][0]+ty*hw,q[i][1]-tx*hw])}
 return L.concat(Rr.reverse())}

/* ===================================================================== drawers
   Two back-ends share one API (fill / line / ink). The Baker writes per-ink density
   layers that later get screened into dots; the Live drawer paints moving things
   straight onto the screen with dot-screen patterns and multiply.                */
function Baker(w,h,variant){
 const L=[0,1,2,3].map(()=>mk(w,h).getContext('2d',{willReadFrequently:true}));
 return{L,w,h,seed:variant*7919+17,amp:1.25*SK,step:9*SK,lod:2,live:false,
  fill(pts,ink,ol,over){const p=path(wob(pts,this,true));
   for(let i=0;i<4;i++){const d=ink[i]||0,g=L[i];
    if(!over){g.globalCompositeOperation='destination-out';g.fillStyle='#000';g.fill(p)}
    if(d>0){g.globalCompositeOperation='source-over';g.fillStyle='rgba(0,0,0,'+d+')';g.fill(p)}}
   if(ol)this.line(pts,ol,Kk,1,true)},
  line(pts,w,ink=Kk,d=1,closed){const q=strokePoly(this,pts,w,closed);if(q)this.ink(ink,d,path(q))},
  ink(i,d,p){if(i<0){for(const g of L){g.globalCompositeOperation='destination-out';g.fillStyle='#000';g.fill(p)}return}
   const g=L[i];g.globalCompositeOperation='source-over';g.fillStyle='rgba(0,0,0,'+d+')';g.fill(p)}}}

const PATS=[];const LEV=[.1,.2,.32,.45,.58,.72,.85];
function buildPatterns(){
 for(let i=0;i<4;i++){PATS[i]=LEV.map(d=>{const c=mk(32,32),g=c.getContext('2d');const r=32*Math.sqrt(d/Math.PI);
   g.fillStyle='rgb('+INK[i].rgb+')';g.beginPath();g.arc(16,16,Math.min(r,22),0,TAU);g.fill();
   if(r>16){for(const[a,b]of[[0,0],[32,0],[0,32],[32,32]]){g.beginPath();g.arc(a,b,Math.max(0,r-16)*1.25,0,TAU);g.fill()}}
   const p=cx.createPattern(c,'repeat');p.setTransform(new DOMMatrix().rotateSelf(INK[i].ang).scaleSelf(PITCH/32));return p})}}
const Live={seed:0,amp:1*SK,step:12*SK,lod:2,live:true,g:cx,
 fill(pts,ink,ol,over){const p=path(this.amp?wob(pts,this,true):pts),g=this.g;
  if(!over){g.globalCompositeOperation='source-over';g.fillStyle=PAPERC;g.fill(p)}
  g.globalCompositeOperation='multiply';
  for(let i=0;i<4;i++){const d=ink[i]||0;if(d<=.04)continue;g.save();g.translate(MIS[i][0],MIS[i][1]);g.fillStyle=this.style(i,d);g.fill(p);g.restore()}
  if(ol)this.line(pts,ol,Kk,1,true)},
 line(pts,w,ink=Kk,d=1,closed){const q=strokePoly(this,pts,w,closed);if(q)this.ink(ink,d,path(q))},
 ink(i,d,p){const g=this.g;if(i<0){g.globalCompositeOperation='source-over';g.fillStyle=PAPERC;g.fill(p);return}
  g.globalCompositeOperation='multiply';g.save();g.translate(MIS[i][0],MIS[i][1]);g.fillStyle=this.style(i,d);g.fill(p);g.restore()},
 style(i,d){if(d>=.9)return'rgb('+INK[i].rgb+')';let k=0,b=9;for(let j=0;j<LEV.length;j++){const e=Math.abs(LEV[j]-d);if(e<b){b=e;k=j}}return PATS[i][k]}};

/* ===================================================================== print engine */
const N2=S*S;let FIELD=null,PAPERCV=null;
function buildField(){ // ink dropout + unevenness, and paper grain
 FIELD=new Float32Array(N2);
 for(let y=0;y<S;y++)for(let x=0;x<S;x++){const g=vn(x/7,y/7,5)*.55+vn(x/1.9,y/1.9,6)*.45;const drop=clamp((g-.66)*4.2,0,1);
  const lf=vn(x/150,y/150,7);FIELD[y*S+x]=(1-drop*.92)*(.8+.2*lf)}
 PAPERCV=mk(S,S);const g=PAPERCV.getContext('2d'),im=g.createImageData(S,S),o=im.data;
 for(let y=0;y<S;y++)for(let x=0;x<S;x++){const i=(y*S+x)*4;const n=vn(x/3,y/3,11)*.5+vn(x/1.1,y/1.1,12)*.5+vn(x/40,y*.6/40,13)*.4;
  const f=1-n*.07;o[i]=PAPER[0]*f;o[i+1]=PAPER[1]*f;o[i+2]=PAPER[2]*(f-.012);o[i+3]=255}
 g.putImageData(im,0,0);
 const r=rng(3);g.globalAlpha=.08;g.strokeStyle='#8a7550';g.lineWidth=.6*SK; // fibres
 for(let k=0;k<S*.35;k++){const x=r()*S,y=r()*S,a=r()*TAU,l=(2+r()*8)*SK;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l*.5,y+Math.sin(a+1)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
}
function screenInk(D,i,out){ // AM halftone screen with jitter, solids with dropout
 const w=D.w,h=D.h,src=D.L[i].getImageData(0,0,w,h).data,im=out.getContext('2d').createImageData(w,h),o=im.data;
 const k=INK[i],a=k.ang*Math.PI/180,c=Math.cos(a)/PITCH,s=Math.sin(a)/PITCH,[r,g,b]=k.rgb,sh=i*104729;
 for(let y=0;y<h;y++){for(let x=0;x<w;x++){const j=y*w+x,d=src[j*4+3]/255;if(d<.015)continue;
  const u=x*c+y*s,v=-x*s+y*c,iu=Math.floor(u),iv=Math.floor(v);
  const fu=u-iu-.5-(hsh(iu,iv,i)-.5)*.14,fv=v-iv-.5-(hsh(iv,iu,i+9)-.5)*.14;
  const rr=Math.sqrt(d/Math.PI)*1.03;let cov=(rr-Math.sqrt(fu*fu+fv*fv))*PITCH+.5;cov=cov<0?0:cov>1?1:cov;
  const sol=(d-.78)*4.5;if(sol>cov)cov=sol>1?1:sol;
  cov*=FIELD[(j+sh)%N2];const q=j*4;o[q]=r;o[q+1]=g;o[q+2]=b;o[q+3]=cov*255}}
 const og=out.getContext('2d');og.clearRect(0,0,w,h);og.putImageData(im,0,0)}
const INKCV=[];
function bake(w,h,variant,draw){
 const D=Baker(w,h,variant);draw(D,rng(9001));
 const t=mk(w,h),g=t.getContext('2d');
 if(w==S&&h==S)g.drawImage(PAPERCV,0,0);else{g.fillStyle=g.createPattern(PAPERCV,'repeat');g.fillRect(0,0,w,h)}
 for(let i=0;i<4;i++){if(!INKCV[i]||INKCV[i].width!=w||INKCV[i].height!=h)INKCV[i]=mk(w,h);screenInk(D,i,INKCV[i]);
  g.globalCompositeOperation='multiply';g.drawImage(INKCV[i],MIS[i][0],MIS[i][1])}
 g.globalCompositeOperation='source-over';return t}

/* ===================================================================== primitives */
function poly3(D,pts,ink,ol=LW,over){D.fill(pts.map(p=>P(...p)),ink,ol,over)}
function box(D,x,y,z,w,d,h,top,lf,rt,ol=LW){
 lf=lf||dk(top,.14);rt=rt||dk(top,.3);
 D.fill([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],lf,ol);
 D.fill([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],rt,ol);
 D.fill([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],top,ol)}
function ellPts(cx0,cy0,rx,ry,n=24,a0=0,a1=TAU){const o=[];for(let k=0;k<=n;k++){const a=a0+(a1-a0)*k/n;o.push([cx0+Math.cos(a)*rx,cy0+Math.sin(a)*ry])}return o}
function cyl(D,x,y,z,r,h,ink,cap,ol=LW){
 const b=P(x,y,z),t=P(x,y,z+h),rx=r*U*1.2247,ry=r*U*.7071;
 const body=ellPts(b[0],b[1],rx,ry,14,0,Math.PI).concat(ellPts(t[0],t[1],rx,ry,14,Math.PI,0));
 D.fill(body,ink,ol);D.fill([[b[0]+rx*.35,b[1]+ry*.9],[t[0]+rx*.35,t[1]+ry*.9],[t[0]+rx*.95,t[1]+ry*.3],[b[0]+rx*.95,b[1]+ry*.3]],[0,0,0,.18],0,true);
 D.fill(ellPts(t[0],t[1],rx,ry,18),cap||dk(ink,-.3),ol)}
function barrel(D,x,y,z,r=.32,h=.8){cyl(D,x,y,z,r,h,WOOD,dk(WOOD,.1));
 for(const f of[.18,.5,.82]){const c=P(x,y,z+h*f);D.line(ellPts(c[0],c[1],r*U*1.26,r*U*.73,12,.05,Math.PI-.05),2*SK,Kk,.9)}}
function crate(D,x,y,z,s=.6,ink=WOOD){box(D,x,y,z,s,s,s,ink);const a=P(x,y+s,z),b=P(x+s,y+s,z+s);D.line([a,b],1.4*SK,Kk,.7)}
function rectL(D,y0,z0,y1,z1,ink,ol=LW,x=0){D.fill([P(x,y0,z0),P(x,y1,z0),P(x,y1,z1),P(x,y0,z1)],ink,ol)}
function rectR(D,x0,z0,x1,z1,ink,ol=LW,y=0){D.fill([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],ink,ol)}
const mapL=(y0,z0,s,x=0)=>(a,b)=>P(x,y0+a*s,z0-b*s);   // local shape → left wall
const mapR=(x0,z0,s,y=0)=>(a,b)=>P(x0+a*s,y,z0-b*s);   // local shape → right wall
const mapS=(sx,sy,s,f=1,rot=0)=>{const c=Math.cos(rot),n=Math.sin(rot);return(a,b)=>[sx+(a*c-b*n)*s*f,sy+(a*n+b*c)*s]};
const mapT=(x0,y0,z,s)=>(a,b)=>P(x0+a*s,y0+b*s,z);    // local → floor plane
function shp(D,pts,m,ink,ol=LW,over){D.fill(pts.map(p=>m(p[0],p[1])),ink,ol,over)}
function ln(D,pts,m,w,ink=Kk,d=1){D.line(pts.map(p=>m(p[0],p[1])),w,ink,d)}
function slab(D,top,side,th=.55,tz=0){box(D,-.25,-.25,tz-th,N+.25,N+.25,th,top,side,dk(side,.2))}
function wallL(D,h,ink,capInk){box(D,-.25,-.25,0,.25,N+.25,h,capInk||dk(ink,-.2),dk(ink,.35),ink)}
function wallR(D,h,ink,capInk){box(D,0,-.25,0,N,.25,h,capInk||dk(ink,-.2),ink,dk(ink,.35))}
function planks(D,x0,y0,x1,y1,z,dir,w=.42,d=.55){
 if(dir){for(let x=x0+w;x<x1-.01;x+=w)D.line([P(x,y0,z),P(x,y1,z)],1.3*SK,Kk,d);for(let x=x0;x<x1;x+=w){const j=y0+((x*7.3)%1.7+.4);if(j<y1)D.line([P(x,j,z),P(x+w,j,z)],1.1*SK,Kk,d*.7)}}
 else{for(let y=y0+w;y<y1-.01;y+=w)D.line([P(x0,y,z),P(x1,y,z)],1.3*SK,Kk,d);for(let y=y0;y<y1;y+=w){const j=x0+((y*5.9)%1.9+.3);if(j<x1)D.line([P(j,y,z),P(j,y+w,z)],1.1*SK,Kk,d*.7)}}}
// stepped halftone light: rings from outer to inner, each a flat density step
function glow(D,c,rx,ry,outer,inner,steps=5){for(let k=0;k<steps;k++){const f=1-k/steps,t=(k+1)/steps;D.fill(ellPts(c[0],c[1],rx*f,ry*f,30),outer.map((v,j)=>lerp(v,inner[j],t)),0)}}
function seaTop(D,x0,y0,x1,y1,z,r,n=60,ink=SEA){
 poly3(D,[[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]],ink,0);
 for(let k=0;k<n;k++){const x=x0+.2+r()*(x1-x0-.4),y=y0+.2+r()*(y1-y0-.4),c=P(x,y,z),w=(6+r()*9)*SK,white=r()<.45;
  D.line([[c[0]-w,c[1]+w*.2],[c[0]-w*.4,c[1]-w*.25],[c[0]+w*.3,c[1]-w*.2],[c[0]+w,c[1]+w*.15]],(white?2.6:2)*SK,white?-1:Bk,1)}}
function waterSides(D,z0,z1,r,x=-.25){
 // strata on the cut faces of the sea
 for(let k=1;k<5;k++){const z=lerp(z1,z0,k/5)+(r()-.5)*.05;D.line([P(x,N,z),P(N,N,z)],1.4*SK,Bk,.6);D.line([P(N,x,z),P(N,N,z)],1.4*SK,Bk,.6)}}
function sky(D,h,ink=SKY,horizon=1.1,sea=SEA){ // painted backdrop flats
 wallL(D,h,ink,[0,0,0,.1]);wallR(D,h,dk(ink,.1),[0,0,0,.1]);

/* input */
const ptr=new Map();let pinch=null,drag=null;
cv.addEventListener('pointerdown',e=>{touch();cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);cam.vx=cam.vy=0;
 if(ptr.size==2){const[a,b]=[...ptr.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2]};drag=null}
 else drag={x:e.clientX,y:e.clientY,t:performance.now()};cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;touch();ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(pinch&&ptr.size>=2){const[a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  cam.x-=(m[0]-pinch.m[0])/cam.z;cam.y-=(m[1]-pinch.m[1])/cam.z;zoomAt(m[0],m[1],d/pinch.d);pinch={d,m};return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y,t=performance.now(),dt=Math.max(1,t-drag.t);cam.x-=dx/cam.z;cam.y-=dy/cam.z;
  cam.vx=lerp(cam.vx,-dx/cam.z/dt*16,.5);cam.vy=lerp(cam.vy,-dy/cam.z/dt*16,.5);drag={x:e.clientX,y:e.clientY,t}}});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(ptr.size==1){const[v]=[...ptr.values()];drag={x:v[0],y:v[1],t:performance.now()}}else drag=null;cv.style.cursor='grab';lastInput=now};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();touch();const k=e.deltaMode==1?40:1;zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*k*.0016))},{passive:false});
cv.addEventListener('dblclick',e=>{touch();const[wx,wy]=toWorld(e.clientX,e.clientY);const i=sceneAt(wx,wy);if(i>=0){flyScene(i,1.6);tourI=i}});
addEventListener('keydown',e=>{const k=e.key;
 if(k=='c'||k=='C'){cardOn=!cardOn;return}
 touch();const st=90/cam.z;
 if(k=='ArrowLeft')cam.vx=-st*.12;else if(k=='ArrowRight')cam.vx=st*.12;else if(k=='ArrowUp')cam.vy=-st*.12;else if(k=='ArrowDown')cam.vy=st*.12;
 else if(k=='+'||k=='=')zoomAt(W/2,H/2,1.25);else if(k=='-'||k=='_')zoomAt(W/2,H/2,.8);
 else if(k=='0'){flyTo(SW/2,SH/2,fitSheet(),1.4)}});
addEventListener('resize',()=>{resize();sizeCard()});

/* ===================================================================== chapter card */
const card=$('card'),gcv=$('grain');
function sizeCard(){const w=card.offsetWidth,h=card.offsetHeight;if(!w)return;gcv.width=w*DPR;gcv.height=h*DPR;const g=gcv.getContext('2d'),r=rng(77);
 g.fillStyle='rgba(120,100,70,.10)';for(let k=0;k<w*h*.05;k++)g.fillRect(r()*gcv.width,r()*gcv.height,DPR*(r()<.9?.8:1.8),DPR*(r()<.9?.8:1.8));
 g.strokeStyle='rgba(120,95,60,.12)';g.lineWidth=.6*DPR;for(let k=0;k<w*.25;k++){const x=r()*gcv.width,y=r()*gcv.height,a=r()*TAU,l=(3+r()*9)*DPR;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
 const fr=g.createLinearGradient(0,0,0,1);g.fillStyle='rgba(0,0,0,0)';}
function setCard(i){const s=SC[i],a=INK[s.a].rgb;card.style.setProperty('--a','rgb('+a.map(v=>Math.round(v*.9))+')');
 $('cn').textContent=s.lab;$('ct').textContent=s.t;
 const q=s.q,p=$('cq');p.textContent='';const dc=document.createElement('span');dc.className='dc';dc.innerHTML='<span class="hq">“</span>'+q[0];
 p.append(dc,document.createTextNode(q.slice(1)+'”'));sizeCard()}
let cardScene=-1,cardTimer=0;
function updateCard(){
 let want=-1;
 if(cardOn&&!fly&&Math.hypot(cam.vx,cam.vy)*cam.z<.5){const i=sceneAt(cam.x,cam.y);if(i>=0&&REVEAL[i]){const[x,y]=tileXY(i);
   if(Math.abs(cam.x-x-S/2)<S*.2&&Math.abs(cam.y-y-S/2)<S*.2&&cam.z>fitTile()*.8)want=i}}
 if(want!=cardScene){if(card.classList.contains('on')){card.classList.remove('on');cardScene=-2;clearTimeout(cardTimer);cardTimer=setTimeout(()=>{cardScene=-1},800);return}
  if(cardScene==-2)return;
  if(want>=0){setCard(want);requestAnimationFrame(()=>card.classList.add('on'))}cardScene=want}}

/* ===================================================================== frame loop */
let now=0,T0=0,printDone=-1,paperPat=null;
function regMark(g,x,y,r){for(let i=0;i<4;i++){g.save();g.translate(x+MIS[i][0]*2,y+MIS[i][1]*2);g.globalCompositeOperation='multiply';g.strokeStyle='rgb('+INK[i].rgb+')';g.lineWidth=r*.07;
 g.beginPath();g.arc(0,0,r*.55,0,TAU);g.moveTo(-r,0);g.lineTo(r,0);g.moveTo(0,-r);g.lineTo(0,r);g.stroke();g.beginPath();g.arc(0,0,r*.25,0,TAU);g.fillStyle=g.strokeStyle;g.fill();g.restore()}}
function drawSheet(g){
 g.fillStyle=paperPat;g.fillRect(0,0,SW,SH);
 const bx=M,by=M,bw=COLS*S,bh=ROWS*S,o=S*.04,l=S*.14;
 g.strokeStyle='rgb('+INK[3].rgb+')';g.lineWidth=S*.0025;g.globalCompositeOperation='multiply';g.beginPath();
 for(const[x,y,sx,sy]of[[bx,by,-1,-1],[bx+bw,by,1,-1],[bx,by+bh,-1,1],[bx+bw,by+bh,1,1]]){g.moveTo(x+sx*o,y);g.lineTo(x+sx*(o+l),y);g.moveTo(x,y+sy*o);g.lineTo(x,y+sy*(o+l))}
 for(let c=1;c<COLS;c++){const x=bx+c*S;g.moveTo(x,by-o);g.lineTo(x,by-o-l*.6);g.moveTo(x,by+bh+o);g.lineTo(x,by+bh+o+l*.6)}
 for(let r=1;r<ROWS;r++){const y=by+r*S;g.moveTo(bx-o,y);g.lineTo(bx-o-l*.6,y);g.moveTo(bx+bw+o,y);g.lineTo(bx+bw+o+l*.6,y)}
 g.stroke();g.globalCompositeOperation='source-over';
 const rr=S*.045;regMark(g,SW/2,M*.45,rr);regMark(g,SW/2,SH-M*.45,rr);regMark(g,M*.45,SH/2,rr);regMark(g,SW-M*.45,SH/2,rr);
 if(STRIP){g.globalCompositeOperation='multiply';g.drawImage(STRIP,SW-M-STRIP.width,SH-M*.62);g.drawImage(STRIP,M,M*.62-STRIP.height);g.globalCompositeOperation='source-over'}}
function frame(ts){
 now=ts/1000;if(!T0)T0=now;
 // bake one plate per frame (print-in)
 if(queue.length){const[i,v]=queue.shift();TILES[i][v]=bake(S,S,v,SC[i].draw);if(v==0)REVEAL[i]=Math.max(now,(REVEAL.reduce((m,x)=>Math.max(m,x),0)||now)+.22);if(!STRIP)STRIP=bakeStrip();
  if(!queue.length)printDone=now}
 // tour
 if(!tourOn&&now-lastInput>9&&!ptr.size&&printDone>0){tourOn=true;const i=sceneAt(cam.x,cam.y);tourI=i>=0?i:tourI;tourNext=now+(i>=0?4:0)}
 if(tourOn&&printDone>0&&now>=tourNext&&now-T0>4.5&&!fly){tourI=(tourI+1)%(SC.length+1);
  if(tourI==SC.length){flyTo(SW/2,SH/2,fitSheet(),3);tourNext=now+3+4}else{flyScene(tourI,tourI==0?3.2:2.6);tourNext=now+(tourI==0?3.2:2.6)+8.5}}
 if(fly){const f=clamp((now-fly.t0)/fly.dur,0,1),e=ease(f);const lz=lerp(Math.log(fly.z0),Math.log(fly.z),e)-fly.bump*Math.sin(Math.PI*e);
  cam.z=Math.exp(lz);const zi=Math.exp(lerp(Math.log(fly.z0),Math.log(fly.z),e));const pe=fly.z0==fly.z?e:(1/fly.z0-1/zi)/(1/fly.z0-1/fly.z)*0+e;
  cam.x=lerp(fly.x0,fly.x,pe);cam.y=lerp(fly.y0,fly.y,pe);if(f>=1)fly=null}
 else if(!drag&&!pinch){cam.x+=cam.vx;cam.y+=cam.vy;cam.vx*=.92;cam.vy*=.92;if(Math.abs(cam.vx)<.01)cam.vx=0;if(Math.abs(cam.vy)<.01)cam.vy=0}
 // draw
 const g=cx;g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.fillStyle='#211f1c';g.fillRect(0,0,cv.width,cv.height);
 const z=cam.z*DPR,ox=W/2*DPR-cam.x*z,oy=H/2*DPR-cam.y*z;
 g.setTransform(z,0,0,z,ox,oy);g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=40*DPR;g.fillStyle=PAPERC;g.fillRect(0,0,SW,SH);g.shadowBlur=0;g.shadowColor='transparent';
 g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 drawSheet(g);
 const boilIdx=Math.floor(now*3)%3;
 const vx0=-ox/z,vy0=-oy/z,vx1=vx0+cv.width/z,vy1=vy0+cv.height/z;
 for(let i=0;i<SC.length;i++){const[x,y]=tileXY(i);if(!TILES[i][0]||now<REVEAL[i])continue;if(x>vx1||y>vy1||x+S<vx0||y+S<vy0)continue;
  const img=TILES[i][boilIdx]||TILES[i][0];const rv=clamp((now-REVEAL[i])/.9,0,1);
  g.setTransform(z,0,0,z,ox,oy);
  if(rv<1){g.save();g.beginPath();g.rect(x,y,S,S*ease(rv));g.clip();g.drawImage(img,x,y);g.restore();
   g.fillStyle='rgba(33,31,28,.08)';g.fillRect(x,y+S*ease(rv)-S*.01,S,S*.01);continue}
  g.drawImage(img,x,y);
  // live layer: people, boats, flames — clipped to the tile
  const px=U*z/DPR;Live.lod=px<9?0:px<26?1:2;Live.seed=boilIdx*7919+17;Live.amp=Live.lod?1*SK:0;Live.step=Live.lod>1?10*SK:24*SK;
  g.save();g.translate(x,y);g.beginPath();g.rect(0,0,S,S);g.clip();
  const t=now-T0+i*3.1;const items=[];
  for(const a of SC[i].actors)items.push([depthOf(a,t),D=>drawActor(D,a,t)]);
  for(const l of(SC[i].live||[]))items.push([l.depth,D=>l.draw(D,t)]);
  items.sort((p,q)=>p[0]-q[0]);for(const it of items)it[1](Live);
  g.restore();g.globalCompositeOperation='source-over'}
 updateCard();
 requestAnimationFrame(frame)}

/* ===================================================================== go */
resize();buildField();buildPatterns();paperPat=cx.createPattern(PAPERCV,'repeat');
cam.z=fitSheet();cam.x=SW/2;cam.y=SH/2;
requestAnimationFrame(frame);
</script>

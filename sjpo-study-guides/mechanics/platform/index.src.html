<style>/*KATEX_CSS*/</style>
<style>
/* Layout: graph-paper lab notebook. Sticky top bar, chapter "track" grid on home,
   two-column chapter view (sections | video list), full-screen narrated player. */
:root {
  --paper: #f6f7fb; --grid: #e6e9f3; --card: #ffffff; --ink: #141a2e; --muted: #5a6381; --line: #dde2ee;
  --cobalt: #2c4be0; --cobalt-soft: #e7ebff; --marigold: #ffb703; --marigold-ink: #6b4b00; --mint: #0fa97a; --mint-soft: #dcf6ec; --coral: #e5484d;
  --stage: #10153a; --stage-2: #1a2154; --stage-ink: #f3f5ff; --stage-muted: #a9b2e6; --stage-hl: #ffc93d;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px; --shadow: 0 1px 0 rgba(20,26,46,.04), 0 6px 22px -12px rgba(20,26,46,.25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1120; --grid: #161c31; --card: #141a2d; --ink: #e9ecf8; --muted: #9aa3c4; --line: #252c47;
  --cobalt: #8297ff; --cobalt-soft: #1c2450; --marigold: #ffc93d; --marigold-ink: #ffe3a1; --mint: #3ddba6; --mint-soft: #123a2f; --coral: #ff6b6f;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0d1120; --grid: #161c31; --card: #141a2d; --ink: #e9ecf8; --muted: #9aa3c4; --line: #252c47;
  --cobalt: #8297ff; --cobalt-soft: #1c2450; --marigold: #ffc93d; --marigold-ink: #ffe3a1; --mint: #3ddba6; --mint-soft: #123a2f; --coral: #ff6b6f;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed; }
a { color: var(--cobalt); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -.015em; text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; display: block; line-height: 1.1; }
.brand small { font: 600 .68rem var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: .92rem; }
.nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.xp { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.xp svg { display: block; }
.xp .lvl { font: 700 .78rem/1.1 var(--f-mono); }
.xp .lvl span { display: block; color: var(--muted); font-weight: 500; font-size: .68rem; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; padding-block: 40px 22px; align-items: center; }
.eyebrow { font: 700 .74rem var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cobalt); }
.hero h1 { font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: .95; margin: 10px 0 14px; font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--marigold) 62% 92%, transparent 92%); padding: 0 .08em; }
.hero p { color: var(--muted); max-width: 56ch; margin: 0 0 18px; }
.cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 700; text-decoration: none; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-1px); box-shadow: 3px 3px 0 var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { box-shadow: 3px 3px 0 var(--marigold); }
.btn.small { padding: 6px 11px; font-size: .86rem; border-radius: 10px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.stats { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.stats-top { display: flex; align-items: center; gap: 16px; }
.big-ring { flex: none; }
.stats-top h3 { font-size: 1.25rem; }
.stats-top p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.kpi { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }
.kpi b { font: 800 1.35rem var(--f-display); display: block; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .76rem; color: var(--muted); }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.res-card { border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--paper); }
.res-card b { font-family: var(--f-display); font-size: .98rem; line-height: 1.15; }
.res-card small { color: var(--muted); font-size: .76rem; }
.res-card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.sync-note { font-size: .76rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--mint); }

/* chapter track */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 1.6rem; }
.section-title p { margin: 0; color: var(--muted); font-size: .92rem; }
.track { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; padding-bottom: 40px; }
.ch-card { position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 14px; cursor: pointer; box-shadow: var(--shadow); display: grid; gap: 10px; transition: transform .18s, border-color .18s; text-decoration: none; color: var(--ink); }
.ch-card:hover { transform: translateY(-3px) rotate(-.3deg); border-color: var(--ink); }
.ch-top { display: flex; align-items: center; gap: 12px; }
.ch-icon { width: 52px; height: 52px; border-radius: 12px; background: var(--cobalt-soft); display: grid; place-items: center; flex: none; color: var(--cobalt); }
.ch-num { font: 700 .72rem var(--f-mono); color: var(--muted); letter-spacing: .1em; }
.ch-card h3 { font-size: 1.18rem; line-height: 1.12; }
.ch-card p { margin: 0; font-size: .86rem; color: var(--muted); }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--mint); border-radius: 99px; transition: width .5s; }
.ch-foot { display: flex; justify-content: space-between; font: 600 .76rem var(--f-mono); color: var(--muted); }
.badge-done { position: absolute; top: 12px; right: 12px; background: var(--mint); color: #fff; font: 700 .68rem var(--f-mono); padding: 3px 8px; border-radius: 99px; letter-spacing: .06em; }

/* chapter view */
.crumbs { padding-top: 22px; font-size: .88rem; color: var(--muted); }
.crumbs a { color: var(--muted); }
.ch-head { display: flex; gap: 18px; align-items: center; margin: 10px 0 6px; flex-wrap: wrap; }
.ch-head .ch-icon { width: 68px; height: 68px; border-radius: 16px; }
.ch-head h1 { font-size: clamp(1.9rem, 4.5vw, 2.9rem); line-height: 1; }
.ch-head p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
.outcomes { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; margin: 16px 0; }
.outcomes summary { cursor: pointer; font-weight: 700; font-family: var(--f-display); }
.outcomes ol { margin: 10px 0 2px; padding-left: 22px; list-style: lower-alpha; color: var(--muted); }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; }
.sec-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sec-id { font: 800 1rem var(--f-mono); color: var(--cobalt); background: var(--cobalt-soft); border-radius: 8px; padding: 3px 8px; }
.sec-head h3 { font-size: 1.15rem; margin-right: auto; }
.vid { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; border-bottom: 1px dashed var(--line); }
.vid:last-of-type { border-bottom: 0; }
.check { appearance: none; width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 8px; display: grid; place-items: center; cursor: pointer; margin: 0; background: var(--card); transition: background .2s; }
.check::after { content: ""; width: 12px; height: 7px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: rotate(-45deg) translate(1px,-1px) scale(0); transition: transform .2s; }
.check:checked { background: var(--mint); border-color: var(--mint); }
.check:checked::after { transform: rotate(-45deg) translate(1px,-1px) scale(1); }
.vid-info b { display: block; font-family: var(--f-display); font-size: 1.02rem; }
.vid-info span { font-size: .84rem; color: var(--muted); }
.vid-kind { font: 700 .66rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; }
.k-lec { background: var(--cobalt-soft); color: var(--cobalt); }
.k-sol { background: color-mix(in srgb, var(--marigold) 25%, transparent); color: var(--marigold-ink); }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
.play:hover { transform: scale(1.08); background: var(--cobalt); }
.ex-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 14px 58px; }
.chip { font: 600 .74rem var(--f-mono); border: 1px solid var(--line); border-radius: 99px; padding: 3px 9px; color: var(--muted); background: var(--paper); text-decoration: none; }
a.chip:hover { border-color: var(--ink); color: var(--ink); }
.ch-nav { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0 44px; flex-wrap: wrap; }

/* tutorials */
.tut-grid { display: grid; gap: 14px; padding-bottom: 44px; }
.tut { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.tut-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tut-head b { font-family: var(--f-display); font-size: 1.1rem; }
.tut-head .chip { margin-left: auto; }
.qimgs { background: #fff; border-radius: 10px; padding: 10px; border: 1px solid var(--line); overflow-x: auto; }
.qimgs img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.reveal { border-top: 1px dashed var(--line); padding-top: 10px; }
.reveal summary { cursor: pointer; font-weight: 700; color: var(--cobalt); }
.steps { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 6px; }
.steps li { padding-left: 4px; }
.ans-pill { display: inline-block; margin-top: 8px; font: 700 .86rem var(--f-mono); background: var(--mint-soft); color: var(--mint); border-radius: 8px; padding: 4px 10px; }
.keynote { margin-top: 8px; font-size: .9rem; background: color-mix(in srgb, var(--marigold) 16%, transparent); border-left: 4px solid var(--marigold); padding: 8px 12px; border-radius: 0 8px 8px 0; }

/* player */
.player { position: fixed; inset: 0; z-index: 50; background: rgba(6,8,22,.82); display: grid; place-items: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.pl-box { width: min(1100px, 100%); max-height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr) auto; background: var(--stage); color: var(--stage-ink); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
.pl-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
.pl-top .t { margin-right: auto; min-width: 0; }
.pl-top .t b { font-family: var(--f-display); display: block; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-top .t span { font: 600 .72rem var(--f-mono); color: var(--stage-muted); letter-spacing: .08em; text-transform: uppercase; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--stage-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: rgba(255,255,255,.08); }
.stage { position: relative; aspect-ratio: 16 / 9; max-height: calc(100vh - 220px); width: 100%; overflow: hidden;
  background: radial-gradient(120% 90% at 85% 0%, var(--stage-2) 0%, var(--stage) 60%); }
.stage::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 32px 32px; pointer-events: none; }
.slide { position: absolute; inset: 0; padding: clamp(16px, 4vw, 44px); display: flex; flex-direction: column; gap: clamp(8px, 1.6vw, 18px); overflow-y: auto; }
.slide h2 { font-size: clamp(1.2rem, 3vw, 2.1rem); line-height: 1.08; color: #fff; }
.slide h2 small { display: block; font: 700 clamp(.62rem, 1.2vw, .78rem) var(--f-mono); color: var(--stage-hl); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.slide .body { font-size: clamp(.86rem, 1.9vw, 1.28rem); line-height: 1.5; }
.slide .body ul, .slide .body ol { margin: 0; padding-left: 1.2em; display: grid; gap: .35em; }
.slide .body p { margin: 0 0 .4em; }
.slide .tbl { border-collapse: collapse; } .slide .tbl td, .slide .tbl th { border: 1px solid rgba(255,255,255,.2); padding: .2em .7em; text-align: left; }
.slide .small { font-size: .8em; color: var(--stage-muted); }
.slide .katex-display { margin: .4em 0; }
.rv { opacity: .22; transform: translateY(6px); transition: opacity .5s, transform .5s; }
.rv.on { opacity: 1; transform: none; }
.ex-layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(10px, 2vw, 24px); min-height: 0; flex: 1; }
.ex-q { background: #fff; border-radius: 12px; padding: 10px; overflow: auto; align-self: start; max-height: 100%; }
.ex-q img { display: block; width: 100%; height: auto; }
.ex-q.full { max-width: 760px; margin: 0 auto; width: 100%; }
.ex-steps { display: grid; gap: .55em; align-content: start; font-size: clamp(.8rem, 1.65vw, 1.1rem); }
.ex-steps .st { padding: .5em .75em; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
.ex-steps .st.cur { background: rgba(255,201,61,.12); border-color: var(--stage-hl); }
.ex-steps .st b { color: var(--stage-hl); }
.ex-steps .note { font-size: .86em; color: var(--stage-muted); border-left: 3px solid var(--stage-hl); padding-left: .7em; }
.pause-tag { display: inline-flex; gap: 8px; align-items: center; font: 700 clamp(.7rem,1.4vw,.86rem) var(--f-mono); color: var(--stage); background: var(--stage-hl); padding: 5px 10px; border-radius: 8px; align-self: flex-start; }
.answer-big { font: 800 clamp(1.6rem, 5vw, 3.4rem) var(--f-display); color: var(--stage-hl); }
.caption { min-height: 3.4em; padding: 10px 18px; font-size: clamp(.82rem, 1.6vw, 1rem); color: var(--stage-ink); background: rgba(0,0,0,.25); border-top: 1px solid rgba(255,255,255,.06); }
.caption .now { color: #fff; } .caption .done, .caption .next { color: var(--stage-muted); }
.pl-ctrl { display: flex; align-items: center; gap: 10px; padding: 10px 14px 14px; flex-wrap: wrap; }
.segs { display: flex; gap: 3px; flex: 1 1 100%; order: -1; }
.segs button { flex: 1; height: 6px; border: 0; border-radius: 3px; background: rgba(255,255,255,.18); cursor: pointer; padding: 0; position: relative; overflow: hidden; }
.segs button.done { background: var(--stage-hl); }
.segs button.cur { background: rgba(255,201,61,.45); }
.big-play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--stage-hl); color: var(--stage); display: grid; place-items: center; cursor: pointer; }
.pl-ctrl .count { font: 600 .82rem var(--f-mono); color: var(--stage-muted); margin-right: auto; font-variant-numeric: tabular-nums; }
.pl-ctrl select { background: transparent; color: var(--stage-ink); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 8px; max-width: 180px; font: 500 .82rem var(--f-body); }
.pl-ctrl select option { color: #111; }
.tts-warn { font-size: .78rem; color: var(--stage-hl); }
.done-card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: radial-gradient(circle at center, rgba(16,21,58,.6), rgba(16,21,58,.96)); }
.done-card h2 { font-size: clamp(1.4rem, 4vw, 2.4rem); color: #fff; }
.done-card p { color: var(--stage-muted); }
.done-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.done-card .btn { border-color: var(--stage-hl); background: transparent; color: var(--stage-ink); }
.done-card .btn.primary { background: var(--stage-hl); color: var(--stage); }
canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 60; box-shadow: var(--shadow); }

@media (max-width: 820px) {
  .hero { grid-template-columns: minmax(0,1fr); padding-top: 26px; }
  .ex-layout { grid-template-columns: minmax(0,1fr); }
  .stage { aspect-ratio: auto; height: min(68vh, 560px); }
  .ex-chips { padding-left: 18px; }
}
@media (max-width: 520px) {
  .res { grid-template-columns: 1fr; }
  .vid { grid-template-columns: auto minmax(0,1fr); }
  .vid .play { grid-column: 2; justify-self: start; width: auto; height: 36px; border-radius: 10px; padding: 0 14px; gap: 6px; display: inline-flex; align-items: center; }
  .vid .play::after { content: "Play"; font-weight: 700; font-size: .86rem; }
  .xp .lvl span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
"use strict";
const C = window.COURSE, PAGES = window.PAGES || { guide: {}, sol: {} };
const GUIDE_PDF = "pdf/SJPO-Mechanics-Study-Guide.pdf", SOL_PDF = "pdf/SJPO-Mechanics-Solutions.pdf";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- course model ---------- */
const VIDEOS = [];
C.chapters.forEach((ch) => ch.sections.forEach((s) => {
  VIDEOS.push({ id: s.id + "L", kind: "lec", ch, sec: s, title: s.title, slides: s.lecture.length });
  if (s.examples.length) VIDEOS.push({ id: s.id + "W", kind: "sol", ch, sec: s, title: s.title, slides: s.examples.reduce((a, e) => a + e.steps.length + 2, 0) });
}));
const VID = Object.fromEntries(VIDEOS.map((v) => [v.id, v]));
const words = (t) => (t || "").split(/\s+/).filter(Boolean).length;
function minutesOf(v) {
  let w = 0;
  if (v.kind === "lec") v.sec.lecture.forEach((sl) => (w += words(sl.s)));
  else v.sec.examples.forEach((e) => { w += words(e.intro) + 12; e.steps.forEach((st) => (w += words(st.s))); });
  return Math.max(1, Math.round(w / 150));
}
const RANKS = [[0, "Static Observer"], [60, "Uniform Mover"], [140, "Free-Body Artist"], [230, "Projectile Pro"], [320, "Collision Expert"], [410, "Orbit Keeper"], [500, "Rigid Rotor"], [560, "Olympiad Ready"]];
const MAX_XP = VIDEOS.length * 10 + C.tutorials.length * 5;

/* ---------- progress store: per-viewer db doc, falling back to localStorage ---------- */
const LS_KEY = "sjpo-mech-progress-v1";
let P = { v: {}, t: {}, last: null };
let remote = null, saveTimer = null;
try { const raw = localStorage.getItem(LS_KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) {}
  if (!remote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { remote.set({ v: P.v, t: P.t, last: P.last || "", updated: Date.now() }).catch(() => {}); }, 600);
}
async function connectStore() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    if (snap.exists) {
      const d = snap.data() || {};
      P.v = Object.assign({}, d.v || {}, P.v); P.t = Object.assign({}, d.t || {}, P.t);
      P.last = P.last || d.last || null;
    }
    remote = ref; persist(); render(); setSync(true);
  } catch (e) { setSync(false); }
}
function setSync(on) { const n = $("#sync-note"); if (n) n.innerHTML = on ? '<span class="dot on"></span> Progress saved to your account' : '<span class="dot"></span> Progress saved in this browser'; }

function xp() { return Object.keys(P.v).filter((k) => P.v[k] && VID[k]).length * 10 + Object.keys(P.t).filter((k) => P.t[k]).length * 5; }
function rank(x) { let r = RANKS[0][1]; for (const [t, n] of RANKS) if (x >= t) r = n; return r; }
function ring(svg, frac, size, stroke, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  svg.innerHTML = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .6s"/>`;
}
function updateXP() {
  const x = xp();
  $("#xp-pts").textContent = x + " XP"; $("#xp-rank").textContent = rank(x);
  ring($("#xp-ring"), x / MAX_XP, 36, 5, "var(--marigold)");
}
function setWatched(id, val) { P.v[id] = !!val; if (!val) delete P.v[id]; persist(); updateXP(); }
function chProgress(ch) { const vs = VIDEOS.filter((v) => v.ch === ch); return [vs.filter((v) => P.v[v.id]).length, vs.length]; }

/* ---------- icons (one per chapter) ---------- */

/* ---------- views ---------- */
function pdfLink(file, page, label, cls = "chip") { return `<a class="${cls}" href="${file}${page ? "#page=" + page : ""}" target="_blank" rel="noopener">${label}</a>`; }
function nextVideo() { return VIDEOS.find((v) => !P.v[v.id]); }

function viewHome() {

  const tDone = C.tutorials.filter((t) => P.t[t.num]).length;

      <div class="cta-row">
        ${nx ? `<button class="btn primary" data-play="${nx.id}">${PLAY_SVG} ${done ? "Continue" : "Start"}: ${esc(nx.sec.id)} ${nx.kind === "lec" ? "Lecture" : "Worked examples"}</button>` : `<span class="btn primary" aria-disabled="true">All videos watched</span>`}
        ${last && last !== nx ? `<button class="btn" data-play="${last.id}">Rewatch last: ${esc(last.sec.id)} ${last.kind === "lec" ? "lecture" : "examples"}</button>` : ""}
      </div>
    </div>
    <aside class="stats" aria-label="Your progress">
      <div class="stats-top"><svg class="big-ring" id="big-ring" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"></svg>
        <div><h3>${done} of ${VIDEOS.length} videos watched</h3><p>${Math.round((100 * done) / VIDEOS.length)}% of the Mechanics course · rank: <b>${rank(xp())}</b></p></div></div>
      <div class="kpis"><div class="kpi"><b>${xp()}</b><span>XP of ${MAX_XP}</span></div><div class="kpi"><b>${C.chapters.filter((c) => { const [a, b] = chProgress(c); return a === b; }).length}/${C.chapters.length}</b><span>chapters done</span></div><div class="kpi"><b>${tDone}/${C.tutorials.length}</b><span>tutorials tried</span></div></div>
      <div class="res">
        <div class="res-card"><b>Study guide</b><small>Notes, examples with working boxes, tutorial questions · A4</small><div class="acts">${pdfLink(GUIDE_PDF, 0, "Open PDF", "btn small")}<button class="btn small" data-dl="guide">Download</button></div></div>
        <div class="res-card"><b>Solutions</b><small>Worked solutions to every example and tutorial</small><div class="acts">${pdfLink(SOL_PDF, 0, "Open PDF", "btn small")}<button class="btn small" data-dl="sol">Download</button></div></div>
      </div>
      <div class="sync-note" id="sync-note"><span class="dot${remote ? " on" : ""}"></span> ${remote ? "Progress saved to your account" : "Progress saved in this browser"}</div>
    </aside>
  </section>
  <div class="section-title"><h2>The track</h2><p>Work through it in order: each chapter builds on the one before.</p></div>
  <section class="track">${C.chapters.map((ch) => {
    const [a, b] = chProgress(ch); const nEx = ch.sections.reduce((s, x) => s + x.examples.length, 0);
    return `<a class="ch-card" href="#ch${ch.n}">${a === b ? '<span class="badge-done">DONE</span>' : ""}
      <div class="ch-top"><div class="ch-icon">${icon(ch.n)}</div><div><div class="ch-num">CHAPTER ${ch.n}</div><h3>${esc(ch.title)}</h3></div></div>
      <p>${esc(ch.blurb)}</p>
      <div class="meter" role="progressbar" aria-valuenow="${a}" aria-valuemin="0" aria-valuemax="${b}" aria-label="Videos watched"><i style="width:${(100 * a) / b}%"></i></div>
      <div class="ch-foot"><span>${a}/${b} videos</span><span>${ch.sections.length} sections · ${nEx} examples</span></div></a>`;
  }).join("")}
  <a class="ch-card" href="#tutorials"><div class="ch-top"><div class="ch-icon" style="background:color-mix(in srgb,var(--marigold) 28%,transparent);color:var(--marigold-ink)"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5h14l4 4v18H7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 14h10M11 19h10M11 24h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div><div><div class="ch-num">FINAL SET</div><h3>Tutorial Questions</h3></div></div>
    <p>${C.tutorials.length} mixed past-year questions for timed practice, with solutions you can reveal.</p>
    <div class="meter"><i style="width:${(100 * tDone) / C.tutorials.length}%;background:var(--marigold)"></i></div>
    <div class="ch-foot"><span>${tDone}/${C.tutorials.length} attempted</span><span>about 2.5 min each</span></div></a>
  </section>`;
}

function vidRow(v) {
  const s = v.sec, n = s.examples.length;
  const pg = v.kind === "lec" ? PAGES.guide[s.id] : PAGES.sol[s.id];
  const sub = v.kind === "lec" ? `${s.lecture.length} slides · about ${minutesOf(v)} min` : `${n} example${n > 1 ? "s" : ""} · about ${minutesOf(v)} min`;
  return `<div class="vid"><input type="checkbox" class="check" id="chk-${v.id}" data-chk="${v.id}" ${P.v[v.id] ? "checked" : ""} aria-label="Mark ${esc(s.id)} ${v.kind === "lec" ? "lecture" : "worked examples"} as watched">
    <label class="vid-info" for="chk-${v.id}"><b><span class="vid-kind ${v.kind === "lec" ? "k-lec" : "k-sol"}">${v.kind === "lec" ? "Lecture" : "Solutions"}</span>${v.kind === "lec" ? esc(s.title) : "Worked examples"}</b><span>${sub}${pg ? ` · ${v.kind === "lec" ? "notes" : "solutions"} p.${pg}` : ""}</span></label>
    <button class="play" data-play="${v.id}" aria-label="Play ${esc(s.id)} ${v.kind === "lec" ? "lecture" : "worked examples"}">${PLAY_SVG}</button></div>`;
}
function viewChapter(n) {
  const ch = C.chapters.find((c) => c.n === n); if (!ch) return viewHome();
  const [a, b] = chProgress(ch), prev = C.chapters.find((c) => c.n === n - 1), next = C.chapters.find((c) => c.n === n + 1);
  return `<div class="crumbs"><a href="#home">Course</a> / Chapter ${ch.n}</div>
  <div class="ch-head"><div class="ch-icon">${icon(ch.n, 38)}</div><div style="min-width:0;flex:1"><h1>${esc(ch.title)}</h1><p>${esc(ch.blurb)}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${pdfLink(GUIDE_PDF, PAGES.guide["ch" + ch.n], "Notes PDF", "btn small")}${pdfLink(SOL_PDF, PAGES.sol["ch" + ch.n], "Solutions PDF", "btn small")}</div></div>
  <div class="meter" style="margin:10px 0 0" aria-label="Chapter progress"><i style="width:${(100 * a) / b}%"></i></div>
  <details class="outcomes"><summary>Learning outcomes · ${a}/${b} videos watched</summary><p style="margin:8px 0 0;color:var(--muted)">Candidates should be able to:</p><ol>${ch.outcomes.map((o) => `<li>${o}</li>`).join("")}</ol></details>
  ${ch.sections.map((s) => `<article class="sec"><div class="sec-head"><span class="sec-id">${s.id}</span><h3>${esc(s.title)}</h3>${pdfLink(GUIDE_PDF, PAGES.guide[s.id], "Read notes" + (PAGES.guide[s.id] ? " p." + PAGES.guide[s.id] : ""))}</div>
    ${VIDEOS.filter((v) => v.sec === s).map(vidRow).join("")}
    <div class="ex-chips">${s.examples.map((e) => pdfLink(SOL_PDF, PAGES.sol["E" + e.num], `Ex ${e.num} · SJPO ${esc(e.ref)}`)).join("")}</div></article>`).join("")}
  <div class="ch-nav">${prev ? `<a class="btn" href="#ch${prev.n}">← ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a class="btn" href="#ch${next.n}">${esc(next.title)} →</a>` : `<a class="btn" href="#tutorials">Tutorial questions →</a>`}</div>`;
}
function viewTutorials() {
  const tDone = C.tutorials.filter((t) => P.t[t.num]).length;
  return `<div class="crumbs"><a href="#home">Course</a> / Tutorials</div>
  <div class="ch-head"><div><h1>Tutorial Questions</h1><p>${C.tutorials.length} past-year questions across the whole topic. Try each one cold, then tick it and check the solution. These are also printed at the end of the study guide, and the full solutions are in the solutions PDF.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${pdfLink(GUIDE_PDF, PAGES.guide.T, "Questions PDF", "btn small")}${pdfLink(SOL_PDF, PAGES.sol.T, "Solutions PDF", "btn small")}</div></div>
  <div class="meter" style="margin:12px 0 18px"><i style="width:${(100 * tDone) / C.tutorials.length}%;background:var(--marigold)"></i></div>
  <section class="tut-grid">${C.tutorials.map((t) => {
    const ch = C.chapters.find((c) => c.n === t.ch);
    return `<article class="tut" id="tut-${t.num}"><div class="tut-head"><input type="checkbox" class="check" id="tchk-${t.num}" data-tchk="${t.num}" ${P.t[t.num] ? "checked" : ""} aria-label="Mark question ${t.num} attempted"><label for="tchk-${t.num}"><b>Question ${t.num}</b></label><span class="chip" style="margin-left:0">SJPO ${esc(t.ref)}</span><a class="chip" href="#ch${ch.n}">Ch ${ch.n} · ${esc(ch.title)}</a></div>
    <div class="qimgs">${t.img.map((i) => `<img src="crops/${i}.png" alt="SJPO ${esc(t.ref)} question" loading="lazy">`).join("")}</div>
    <details class="reveal"><summary>Show worked solution</summary><ol class="steps">${t.steps.map((s) => `<li>${s.t}</li>`).join("")}</ol><span class="ans-pill">Answer: ${t.ans}</span>${t.note ? `<div class="keynote"><b>About the answer key.</b> ${t.note}</div>` : ""}</details></article>`;
  }).join("")}</section>`;
}

let route = "home";
function render() {
  const h = (location.hash || "#home").slice(1);
  route = h;
  let html;
  if (/^ch\d+$/.test(h)) html = viewChapter(+h.slice(2));
  else if (h === "tutorials") html = viewTutorials();
  else html = viewHome();
  $("#app").innerHTML = html;
  const onTut = h === "tutorials";
  $("#nav-home")[onTut ? "removeAttribute" : "setAttribute"]("aria-current", "page");
  $("#nav-tut")[onTut ? "setAttribute" : "removeAttribute"]("aria-current", "page");
  const br = $("#big-ring"); if (br) ring(br, VIDEOS.filter((v) => P.v[v.id]).length / VIDEOS.length, 84, 9, "var(--mint)");
  updateXP();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

document.addEventListener("click", (e) => {
  const p = e.target.closest("[data-play]"); if (p) { openPlayer(p.dataset.play); return; }
  const d = e.target.closest("[data-dl]"); if (d) { downloadPdf(d.dataset.dl, d); }
});
document.addEventListener("change", (e) => {
  const c = e.target.closest("[data-chk]");
  if (c) { setWatched(c.dataset.chk, c.checked); if (c.checked) toast("Marked as watched · +10 XP"); render(); return; }
  const t = e.target.closest("[data-tchk]");
  if (t) { if (t.checked) P.t[t.dataset.tchk] = true; else delete P.t[t.dataset.tchk]; persist(); updateXP(); if (t.checked) toast("Nice, +5 XP"); }
});

let toastT;
function toast(msg) {
  let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2200);
}
async function downloadPdf(which, btn) {
  const file = which === "guide" ? GUIDE_PDF : SOL_PDF;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (!dl) { window.open(file, "_blank", "noopener") || toast("Use “Open PDF”, then save it from the viewer"); return; }
    btn.disabled = true;
    const blob = await (await fetch(file)).blob();
    await dl.save({ filename: file.split("/").pop(), data: blob });
  } catch (err) {
    if (!err || err.code !== "declined") toast("Download unavailable here. Use “Open PDF” instead");
  } finally { btn.disabled = false; }
}

/* ---------- narrated player ---------- */
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voices = [], prefVoice = null, rate = 1;
try { rate = +localStorage.getItem("sjpo-rate") || 1; prefVoice = localStorage.getItem("sjpo-voice"); } catch (e) {}
function loadVoices() { if (!synth) return; voices = synth.getVoices().filter((v) => /^en/i.test(v.lang)); fillVoiceSelect(); }
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
function bestVoice() {
  if (prefVoice) { const v = voices.find((x) => x.name === prefVoice); if (v) return v; }
  const order = [/natural/i, /Google UK English Female/, /Google US English/, /Samantha|Serena|Karen|Moira|Daniel/, /en-SG|en-GB/, /en/];
  for (const re of order) { const v = voices.find((x) => re.test(x.name) || re.test(x.lang)); if (v) return v; }
  return null;
}
function fillVoiceSelect() {
  const sel = $("#pl-voice"); if (!sel) return;
  const cur = bestVoice();
  sel.innerHTML = voices.length ? voices.map((v) => `<option value="${esc(v.name)}" ${cur && v.name === cur.name ? "selected" : ""}>${esc(v.name.replace(/Microsoft |Google /, ""))}</option>`).join("") : "<option>Default voice</option>";
}
const sentences = (t) => (t || "").match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g)?.map((s) => s.trim()).filter(Boolean) || [];

function buildSlides(v) {
  if (v.kind === "lec") return v.sec.lecture.map((sl, i) => ({ kind: "lec", h: sl.h, b: sl.b, say: sl.s, tag: `${v.sec.id} · Lecture · ${i + 1}/${v.sec.lecture.length}` }));
  const out = [];
  v.sec.examples.forEach((e) => {
    out.push({ kind: "exq", e, say: e.intro + " Pause the video now and try it in your notes if you haven't already. When you're ready, press play.", pauseAfter: true });
    e.steps.forEach((st, i) => out.push({ kind: "exs", e, upto: i, say: st.s }));
    out.push({ kind: "exa", e, say: `So the answer to example ${e.num} is ${String(e.ans).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim().replace(/^\(?([a-eA-E])\)?$/, "$1")}.` + (e.note ? " Note that this differs from the published answer key. The reason is explained in your solutions booklet." : "") });
  });
  return out;
}
function slideHTML(sl) {
  if (sl.kind === "lec") return `<h2><small>${esc(sl.tag)}</small>${esc(sl.h)}</h2><div class="body">${sl.b}</div>`;
  const e = sl.e, imgs = e.img.map((i) => `<img src="crops/${i}.png" alt="SJPO ${esc(e.ref)} question">`).join("");
  const head = `<h2><small>Example ${e.num} · SJPO ${esc(e.ref)}</small>${sl.kind === "exq" ? "Read the question" : sl.kind === "exa" ? "Answer" : "Worked solution"}</h2>`;
  if (sl.kind === "exq") return head + `<span class="pause-tag">⏸ Pause and attempt it first</span><div class="ex-q full">${imgs}</div>`;
  if (sl.kind === "exa") return head + `<div class="ex-layout"><div class="ex-q">${imgs}</div><div class="ex-steps"><div class="answer-big">${e.ans}</div>${e.note ? `<div class="note"><b>About the answer key.</b> ${e.note}</div>` : ""}</div></div>`;
  return head + `<div class="ex-layout"><div class="ex-q">${imgs}</div><div class="ex-steps">${e.steps.slice(0, sl.upto + 1).map((st, i) => `<div class="st ${i === sl.upto ? "cur" : ""}">${st.t}</div>`).join("")}</div></div>`;
}

let PL = null;
function openPlayer(id) {
  const v = VID[id]; if (!v) return;
  closePlayer();
  P.last = id; persist();

  const root = $("#player-root");
  root.innerHTML = `<div class="player" role="dialog" aria-modal="true" aria-label="${esc(v.sec.id + " " + v.title)}"><div class="pl-box">
    <div class="pl-top"><div class="ch-icon" style="width:40px;height:40px;background:rgba(255,255,255,.08);color:var(--stage-hl)">${icon(v.ch.n, 24)}</div>
      <div class="t"><span>Chapter ${v.ch.n} · ${v.kind === "lec" ? "Lecture" : "Worked examples"}</span><b>${esc(v.sec.id + " " + v.title)}</b></div>
      <button class="icon-btn" id="pl-cc" aria-pressed="true" title="Captions (C)" aria-label="Toggle captions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="2"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="pl-close" title="Close (Esc)" aria-label="Close player"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
    <div class="stage" id="pl-stage"></div>
    <div class="caption" id="pl-cap" aria-live="polite"></div>
    <div class="pl-ctrl"><div class="segs" id="pl-segs">${PL.slides.map((_, k) => `<button data-seg="${k}" aria-label="Go to slide ${k + 1}"></button>`).join("")}</div>
      <button class="icon-btn" id="pl-prev" title="Previous slide (←)" aria-label="Previous slide"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
      <button class="big-play" id="pl-play" aria-label="Play"></button>
      <button class="icon-btn" id="pl-next" title="Next slide (→)" aria-label="Next slide"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
      <span class="count" id="pl-count"></span>
      <label class="sr" style="font-size:.8rem;color:var(--stage-muted)" for="pl-rate">Speed</label>
      <select id="pl-rate">${[0.8, 0.9, 1, 1.1, 1.25, 1.5].map((r) => `<option value="${r}" ${r === rate ? "selected" : ""}>${r}×</option>`).join("")}</select>
      <select id="pl-voice" aria-label="Narrator voice"></select>
      ${synth ? "" : '<span class="tts-warn">This browser has no speech voices. Captions will play instead.</span>'}
    </div></div></div>`;
  fillVoiceSelect();
  $("#pl-close").onclick = closePlayer;
  $("#pl-play").onclick = () => (PL.playing ? pause() : play());
  $("#pl-prev").onclick = () => go(PL.i - 1, PL.playing);
  $("#pl-next").onclick = () => go(PL.i + 1, PL.playing);
  $("#pl-segs").onclick = (e) => { const b = e.target.closest("[data-seg]"); if (b) go(+b.dataset.seg, PL.playing); };
  $("#pl-rate").onchange = (e) => { rate = +e.target.value; try { localStorage.setItem("sjpo-rate", rate); } catch (x) {} if (PL.playing) speakFrom(PL.sent); };
  $("#pl-voice").onchange = (e) => { prefVoice = e.target.value; try { localStorage.setItem("sjpo-voice", prefVoice); } catch (x) {} if (PL.playing) speakFrom(PL.sent); };
  $("#pl-cc").onclick = (e) => { PL.captions = !PL.captions; e.currentTarget.setAttribute("aria-pressed", PL.captions); $("#pl-cap").hidden = !PL.captions; };
  $(".player").addEventListener("click", (e) => { if (e.target.classList.contains("player")) closePlayer(); });

  play();
}
function keyHandler(e) {
  if (!PL) return;
  if (e.target.closest && e.target.closest("select")) return;
  if (e.key === "Escape") closePlayer();
  else if (e.key === " " || e.key === "k") { e.preventDefault(); PL.playing ? pause() : play(); }
  else if (e.key === "ArrowRight") go(PL.i + 1, PL.playing);
  else if (e.key === "ArrowLeft") go(PL.i - 1, PL.playing);

}
function closePlayer() {
  if (!PL) return;
  PL.token++; clearTimeout(PL.timer); if (synth) synth.cancel();
  document.removeEventListener("keydown", keyHandler);
  $("#player-root").innerHTML = ""; PL = null; render();
}
function setPlayIcon() {
  const b = $("#pl-play"); if (!b) return;
  syncReveal();
  b.innerHTML = PL.playing ? '<svg width="20" height="20" viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg>' : '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 3v14l12-7z" fill="currentColor"/></svg>';
  b.setAttribute("aria-label", PL.playing ? "Pause" : "Play");
}
function showSlide(i) {
  PL.i = i; PL.sent = 0;
  const sl = PL.slides[i];
  PL.sents = sentences(sl.say);
  const st = $("#pl-stage");
  st.innerHTML = `<div class="slide">${slideHTML(sl)}</div>`;
  PL.rv = [];
  if (sl.kind === "lec") { PL.rv = [...st.querySelectorAll(".body > ul > li, .body > ol > li, .body > p, .body > .katex-display, .body > table")]; if (!PL.rv.length) PL.rv = [...st.querySelectorAll(".body > *")]; PL.rv.forEach((el) => el.classList.add("rv")); }
  syncReveal();
  [...$("#pl-segs").children].forEach((b, k) => { b.className = k < i ? "done" : k === i ? "cur" : ""; });
  $("#pl-count").textContent = `${i + 1} / ${PL.slides.length}`;
  $("#pl-prev").disabled = i === 0;
  renderCaption();
}
function syncReveal() {
  if (!PL.rv || !PL.rv.length) return;
  const n = PL.rv.length, s = Math.max(1, PL.sents.length);
  const show = PL.playing ? Math.min(n, Math.ceil(((PL.sent + 1) * n) / s)) : n;
  PL.rv.forEach((el, k) => el.classList.toggle("on", k < show));
}
function renderCaption() {
  const c = $("#pl-cap"); if (!c) return;
  c.innerHTML = PL.sents.map((s, k) => `<span class="${k < PL.sent ? "done" : k === PL.sent ? "now" : "next"}">${esc(s)} </span>`).join("");
}
function go(i, autoplay) {
  if (!PL || i < 0 || i >= PL.slides.length) return;
  PL.token++; clearTimeout(PL.timer); if (synth) synth.cancel();
  const card = $(".done-card"); if (card) card.remove();
  showSlide(i);
  if (autoplay) play(); else { PL.playing = false; setPlayIcon(); }
}
function play() {
  if (!PL) return;
  if (PL.awaitNext) { PL.awaitNext = false; go(PL.i + 1, true); return; }
  const card = $(".done-card"); if (card) { card.remove(); go(0, true); return; }
  PL.playing = true; setPlayIcon(); speakFrom(PL.sent);
}
function pause() { if (!PL) return; PL.playing = false; PL.token++; clearTimeout(PL.timer); if (synth) synth.cancel(); setPlayIcon(); }
function speakFrom(k, chained) {
  const tok = ++PL.token; clearTimeout(PL.timer); if (synth && !chained) synth.cancel();
  PL.sent = k; renderCaption(); syncReveal();
  if (k >= PL.sents.length) { afterSlide(tok); return; }
  const text = PL.sents[k];
  const next = () => { if (!PL || tok !== PL.token) return; speakFrom(k + 1, true); };
  const voice = bestVoice();
  if (synth && (voice || voices.length === 0)) {
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = rate; u.lang = voice ? voice.lang : "en-GB";
    let fired = false;
    const fin = () => { if (fired) return; fired = true; clearTimeout(PL && PL.timer); next(); };
    u.onend = fin; u.onerror = (e) => { if (e.error !== "interrupted" && e.error !== "canceled") fin(); };

    PL.timer = setTimeout(fin, (words(text) / (2.3 * rate)) * 1000 + 4000);

    PL.timer = setTimeout(next, (words(text) / (2.6 * rate)) * 1000 + 500);

}
function afterSlide(tok) {
  const sl = PL.slides[PL.i];
  if (sl.pauseAfter) { PL.playing = false; setPlayIcon(); $("#pl-cap").innerHTML = '<span class="now">Paused so you can attempt the question. Press play (or the space bar) when you are ready for the solution.</span>'; PL.sent = 0; PL.awaitNext = true; return; }
  PL.timer = setTimeout(() => {
    if (!PL || tok !== PL.token) return;
    if (PL.i + 1 < PL.slides.length) go(PL.i + 1, true);
    else finish();
  }, 700);
}
function finish() {
  const v = PL.v, wasDone = !!P.v[v.id];
  setWatched(v.id, true);
  PL.playing = false; setPlayIcon();
  [...$("#pl-segs").children].forEach((b) => (b.className = "done"));
  const idx = VIDEOS.indexOf(v), nx = VIDEOS[idx + 1];
  const st = $("#pl-stage");
  const card = document.createElement("div"); card.className = "done-card";
  card.innerHTML = `<div><h2>${v.kind === "lec" ? "Lecture complete" : "Examples complete"}</h2><p>${wasDone ? "Already ticked off. Good revision." : "+10 XP · " + rank(xp())}</p>
    <div class="row"><button class="btn" id="dc-again">Watch again</button>${nx ? `<button class="btn primary" id="dc-next">Up next: ${esc(nx.sec.id)} ${nx.kind === "lec" ? "Lecture" : "Worked examples"}</button>` : `<button class="btn primary" id="dc-tut">Go to tutorials</button>`}</div></div>`;
  st.appendChild(card);
  $("#dc-again").onclick = () => go(0, true);
  if (nx) $("#dc-next").onclick = () => openPlayer(nx.id);
  else $("#dc-tut").onclick = () => { closePlayer(); location.hash = "#tutorials"; };
  if (!wasDone) confetti(st);
}
function confetti(host) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; host.appendChild(cv);
  const ctx = cv.getContext("2d"), W = (cv.width = host.clientWidth * devicePixelRatio), H = (cv.height = host.clientHeight * devicePixelRatio);
  const cols = ["#ffc93d", "#3ddba6", "#8297ff", "#ff6b6f", "#ffffff"];
  const ps = Array.from({ length: 140 }, () => ({ x: W / 2, y: H * 0.55, vx: (Math.random() - 0.5) * 22 * devicePixelRatio, vy: (-Math.random() * 20 - 8) * devicePixelRatio, s: (4 + Math.random() * 6) * devicePixelRatio, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach((p) => { p.vy += 0.6 * devicePixelRatio; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });

}

render();
connectStore();
</script>
